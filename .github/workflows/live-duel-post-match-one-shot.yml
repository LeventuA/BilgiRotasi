name: Live Duel post-match one-shot patch

on:
  push:
    branches:
      - fix/live-duel-post-match-finalization-20260818

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'ci: apply Live Duel post-match finalization patch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-duel-post-match-finalization-20260818
          fetch-depth: 0

      - name: Verify expected base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "15ebf296bce2782bcdc19748c8581d77700ef036"

      - name: Apply deterministic Live Duel patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_text, old, new, label):
              path = Path(path_text)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          screen = 'lib/live_duel_screen.dart'
          play = 'lib/live_duel_play_screen.dart'

          replace_once(
              screen,
              """class LiveDuelScreen extends StatefulWidget {
""",
              """bool liveDuelResumeStillCurrent({
  required LiveDuelResumeMatch stale,
  required LiveDuelResumeMatch? fresh,
}) {
  return fresh != null && fresh.matchId == stale.matchId;
}

class LiveDuelScreen extends StatefulWidget {
""",
              'resume-current helper',
          )

          replace_once(
              screen,
              """  Future<void> _loadProfile() async {
    final profile = await LiveDuelProfileService.load();

    if (!mounted) return;

    setState(() {
      _profile = profile;
      _loadingProfile = false;
    });
  }
""",
              """  Future<void> _loadProfile() async {
    if (mounted) {
      setState(() {
        _loadingProfile = true;
      });
    }

    final profile = await LiveDuelProfileService.load();

    if (!mounted) return;

    setState(() {
      _profile = profile;
      _loadingProfile = false;
    });
  }
""",
              'profile loading reset',
          )

          replace_once(
              screen,
              """  Future<void> _loadResumeMatch() async {
    try {
      final match = await LiveDuelConnectionService.findResumableMatch();
""",
              """  Future<void> _loadResumeMatch() async {
    if (mounted) {
      setState(() {
        _loadingResume = true;
        _resumeMatch = null;
      });
    }

    try {
      final match = await LiveDuelConnectionService.findResumableMatch();
""",
              'resume loading reset',
          )

          old_resume = """  Future<void> _resumeDuel() async {
    final match = _resumeMatch;
    if (match == null || _openingResume) return;

    setState(() {
      _openingResume = true;
      _errorMessage = null;
    });

    await Navigator.of(context).push<void>(
      MaterialPageRoute<void>(
        builder:
            (context) => LiveDuelPlayScreen(
              matchId: match.matchId,
              questionCount: match.questionCount,
            ),
      ),
    );

    if (!mounted) return;

    setState(() {
      _openingResume = false;
    });

    await _loadProfile();
    await _loadResumeMatch();
  }
"""
          new_resume = """  Future<void> _resumeDuel() async {
    final staleMatch = _resumeMatch;
    if (staleMatch == null || _openingResume) return;

    setState(() {
      _openingResume = true;
      _errorMessage = null;
    });

    try {
      final freshMatch = await LiveDuelConnectionService.findResumableMatch();
      if (!mounted) return;

      if (!liveDuelResumeStillCurrent(stale: staleMatch, fresh: freshMatch)) {
        setState(() {
          _resumeMatch = freshMatch;
          _loadingResume = false;
          _errorMessage =
              freshMatch == null
                  ? 'Bu düello zaten tamamlandı. Profilin güncellendi.'
                  : 'Yarım kalan düello değişti. Tekrar deneyebilirsin.';
        });
        await _loadProfile();
        return;
      }

      final currentMatch = freshMatch!;
      await Navigator.of(context).push<void>(
        MaterialPageRoute<void>(
          builder:
              (context) => LiveDuelPlayScreen(
                matchId: currentMatch.matchId,
                questionCount: currentMatch.questionCount,
              ),
        ),
      );

      if (!mounted) return;

      await Future.wait<void>([_loadProfile(), _loadResumeMatch()]);
    } on LiveDuelConnectionException catch (error) {
      if (!mounted) return;
      setState(() {
        _errorMessage = error.message;
      });
    } catch (error, stack) {
      await AppErrorLogService.record(
        source: 'Canlı düello yarım maç doğrulaması',
        error: error,
        stack: stack,
      );
      if (!mounted) return;
      setState(() {
        _errorMessage = 'Yarım kalan düello doğrulanamadı. Lütfen tekrar dene.';
      });
    } finally {
      if (mounted) {
        setState(() {
          _openingResume = false;
        });
      }
    }
  }
"""
          replace_once(screen, old_resume, new_resume, 'resume revalidation')

          replace_once(
              screen,
              """      await _loadProfile();
      await _loadResumeMatch();
    } on LiveDuelMatchmakingException catch (error) {
""",
              """      await Future.wait<void>([_loadProfile(), _loadResumeMatch()]);
    } on LiveDuelMatchmakingException catch (error) {
""",
              'post-matchmaking refresh',
          )

          replace_once(
              play,
              """class LiveDuelPlayException implements Exception {
""",
              """bool liveDuelSupportRewardEligible(LiveDuelCompletedMatch match) {
  return !match.forfeited;
}

String liveDuelSupportRewardGameId(LiveDuelCompletedMatch match) {
  return 'live_duel:${match.matchId}';
}

class LiveDuelPlayException implements Exception {
""",
              'support reward helpers',
          )

          replace_once(
              play,
              """            if (award.alreadyApplied) ...[
              const SizedBox(height: 10),
              const Text(
                'Bu maçın BR sonucu daha önce işlendi; tekrar puan eklenmedi.',
                textAlign: TextAlign.center,
              ),
            ],
            const SizedBox(height: 24),
""",
              """            if (liveDuelSupportRewardEligible(award.match)) ...[
              const SizedBox(height: 20),
              SupportRewardCard(
                gameId: liveDuelSupportRewardGameId(award.match),
              ),
            ],
            const SizedBox(height: 24),
""",
              'result support reward card',
          )

          screen_test = Path('test/live_duel_screen_test.dart')
          text = screen_test.read_text(encoding='utf-8')
          if "import 'dart:io';" not in text:
              text = "import 'dart:io';\n\n" + text
          marker = """    test('lig özeti BR puanını içerir', () {
      const profile = LiveDuelProfile(rating: 1450, matchesPlayed: 8);

      final summary = LiveDuelScreenText.leagueSummary(profile);

      expect(summary, contains('Altın'));
      expect(summary, contains('1450 BR'));
    });
"""
          addition = marker + """

    test('tamamlanmış stale maç yeniden açılmaz', () {
      const stale = LiveDuelResumeMatch(matchId: 'match-1', questionCount: 20);
      const same = LiveDuelResumeMatch(matchId: 'match-1', questionCount: 20);
      const other = LiveDuelResumeMatch(matchId: 'match-2', questionCount: 20);

      expect(liveDuelResumeStillCurrent(stale: stale, fresh: same), isTrue);
      expect(liveDuelResumeStillCurrent(stale: stale, fresh: null), isFalse);
      expect(liveDuelResumeStillCurrent(stale: stale, fresh: other), isFalse);
    });

    test('resume sunucuda yeniden doğrulanmadan ekran açılmaz', () {
      final source = File('lib/live_duel_screen.dart').readAsStringSync();
      final resumeStart = source.indexOf('Future<void> _resumeDuel()');
      final revalidation = source.indexOf(
        'LiveDuelConnectionService.findResumableMatch()',
        resumeStart,
      );
      final navigation = source.indexOf(
        'Navigator.of(context).push<void>',
        resumeStart,
      );

      expect(resumeStart, greaterThanOrEqualTo(0));
      expect(revalidation, greaterThan(resumeStart));
      expect(navigation, greaterThan(revalidation));
      expect(
        source.substring(resumeStart, navigation),
        contains('liveDuelResumeStillCurrent'),
      );
    });
"""
          if text.count(marker) != 1:
              raise SystemExit('live_duel_screen_test marker mismatch')
          screen_test.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          play_test = Path('test/live_duel_play_screen_test.dart')
          text = play_test.read_text(encoding='utf-8')
          if "import 'dart:io';" not in text:
              text = "import 'dart:io';\n\n" + text
          end_marker = """  group('Canlı düello sonuç hesabı', () {
"""
          reward_group = """  group('Canlı düello destek ödülü', () {
    const normalMatch = LiveDuelCompletedMatch(
      matchId: 'match-normal',
      playerUids: <String>['levent', 'emel'],
      scores: <String, int>{'levent': 8, 'emel': 6},
      draw: false,
      winnerUid: 'levent',
    );
    const forfeitMatch = LiveDuelCompletedMatch(
      matchId: 'match-forfeit',
      playerUids: <String>['levent', 'emel'],
      scores: <String, int>{'levent': 8, 'emel': 4},
      draw: false,
      winnerUid: 'levent',
      completionType: LiveDuelCompletionType.forfeit,
      forfeitLoserUid: 'emel',
    );

    test('normal tamamlanan maç bir kez kullanılacak kalıcı gameId üretir', () {
      expect(liveDuelSupportRewardEligible(normalMatch), isTrue);
      expect(
        liveDuelSupportRewardGameId(normalMatch),
        'live_duel:match-normal',
      );
    });

    test('hükmen biten maç destek ödülü üretmez', () {
      expect(liveDuelSupportRewardEligible(forfeitMatch), isFalse);
    });

    test('sonuç UI teknik idempotency mesajını göstermez', () {
      final source = File('lib/live_duel_play_screen.dart').readAsStringSync();
      expect(source, contains('SupportRewardCard('));
      expect(
        source,
        contains('liveDuelSupportRewardEligible(award.match)'),
      );
      expect(
        source,
        isNot(
          contains(
            'Bu maçın BR sonucu daha önce işlendi; tekrar puan eklenmedi.',
          ),
        ),
      );
    });
  });

""" + end_marker
          if text.count(end_marker) != 1:
              raise SystemExit('live_duel_play_screen_test marker mismatch')
          play_test.write_text(
              text.replace(end_marker, reward_group, 1),
              encoding='utf-8',
          )
          PY

          rm .github/workflows/live-duel-post-match-one-shot.yml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/live_duel_screen.dart \
            lib/live_duel_play_screen.dart \
            test/live_duel_screen_test.dart \
            test/live_duel_play_screen_test.dart

      - name: Focused Live Duel tests
        run: |
          flutter test \
            test/live_duel_screen_test.dart \
            test/live_duel_play_screen_test.dart \
            test/live_duel_connection_test.dart \
            test/live_duel_result_test.dart \
            test/ad_monetization_test.dart \
            --concurrency=1 --reporter expanded

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Full Flutter test suite
        run: flutter test --concurrency=1

      - name: Diff safety
        run: |
          git diff --check
          test "$(git diff --name-only | grep -v '^\.github/workflows/live-duel-post-match-one-shot.yml$' | grep -E '^(lib/live_duel_screen\.dart|lib/live_duel_play_screen\.dart|test/live_duel_screen_test\.dart|test/live_duel_play_screen_test\.dart)$' | wc -l)" -eq 4
          test -z "$(git diff --name-only | grep -v -E '^(\.github/workflows/live-duel-post-match-one-shot\.yml|lib/live_duel_screen\.dart|lib/live_duel_play_screen\.dart|test/live_duel_screen_test\.dart|test/live_duel_play_screen_test\.dart)$')"

      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize Live Duel post-match flow'
          git push origin HEAD:fix/live-duel-post-match-finalization-20260818
