name: AdMob runtime diagnostics patch

on:
  push:
    branches:
      - fix/admob-runtime-diagnostics-20260821

permissions:
  contents: write

concurrency:
  group: admob-runtime-diagnostics-patch
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.event.head_commit.message != 'fix: expose AdMob runtime diagnostics'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/admob-runtime-diagnostics-20260821
          fetch-depth: 0

      - name: Verify locked base
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=9331802b9a2b12d1f4ec6715da96dc7d0f60b24b
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml)" = "1.68.17+107"

      - name: Apply deterministic diagnostics patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/ad_monetization.dart')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
          """  static const String androidRewardedUnitId =\n      isProduction\n          ? productionAndroidRewardedUnitId\n          : testAndroidRewardedUnitId;\n}\n\nclass RewardedSsvSession {\n""",
          """  static const String androidRewardedUnitId =\n      isProduction\n          ? productionAndroidRewardedUnitId\n          : testAndroidRewardedUnitId;\n}\n\nclass AdRuntimeDiagnostics {\n  const AdRuntimeDiagnostics._();\n\n  static String? _lastFailure;\n\n  static String? get lastFailure => _lastFailure;\n\n  static void clear() {\n    _lastFailure = null;\n  }\n\n  static void record(String stage, {Object? error}) {\n    final normalizedStage = stage.trim().isEmpty ? 'ADMOB_UNKNOWN' : stage.trim();\n    final detail = error == null ? normalizedStage : '$normalizedStage: ${_clean(error)}';\n    _lastFailure = detail;\n    debugPrint('ADMOB_DIAG $detail');\n  }\n\n  static void recordLoadError(String stage, LoadAdError error) {\n    record(\n      stage,\n      error:\n          'code=${error.code} domain=${error.domain} message=${error.message}',\n    );\n  }\n\n  static String get userFacingSummary => _lastFailure ?? 'ADMOB_UNKNOWN';\n\n  static String _clean(Object value) {\n    var text = value.toString().replaceAll(RegExp(r'\\s+'), ' ').trim();\n    if (text.length > 220) {\n      text = '${text.substring(0, 220)}…';\n    }\n    return text;\n  }\n}\n\nclass RewardedSsvSession {\n""")

          replace_once(
          """  Future<bool> _initialize() async {\n    try {\n      if (await emulatorGateway.isEmulator()) return false;\n\n      await consentGateway.requestConsentInfoUpdate();\n      await consentGateway.loadAndShowConsentFormIfRequired();\n      privacyOptionsRequired.value =\n          await consentGateway.isPrivacyOptionsRequired();\n\n      if (!await consentGateway.canRequestAds()) return false;\n\n      await mobileAdsGateway.configureForTeenAudience();\n      await mobileAdsGateway.initialize();\n      _adsReady = true;\n      return true;\n    } catch (_) {\n      _adsReady = false;\n      return false;\n    } finally {\n      _initializing = null;\n    }\n  }\n""",
          """  Future<bool> _initialize() async {\n    try {\n      if (await emulatorGateway.isEmulator()) {\n        AdRuntimeDiagnostics.record('INIT_EMULATOR_BLOCKED');\n        return false;\n      }\n\n      try {\n        await consentGateway.requestConsentInfoUpdate();\n      } catch (error) {\n        AdRuntimeDiagnostics.record('CONSENT_INFO_UPDATE_FAILED', error: error);\n        rethrow;\n      }\n      try {\n        await consentGateway.loadAndShowConsentFormIfRequired();\n      } catch (error) {\n        AdRuntimeDiagnostics.record('CONSENT_FORM_FAILED', error: error);\n        rethrow;\n      }\n      try {\n        privacyOptionsRequired.value =\n            await consentGateway.isPrivacyOptionsRequired();\n      } catch (error) {\n        AdRuntimeDiagnostics.record(\n          'CONSENT_PRIVACY_STATUS_FAILED',\n          error: error,\n        );\n        rethrow;\n      }\n\n      if (!await consentGateway.canRequestAds()) {\n        AdRuntimeDiagnostics.record('CONSENT_CAN_REQUEST_ADS_FALSE');\n        return false;\n      }\n\n      try {\n        await mobileAdsGateway.configureForTeenAudience();\n        await mobileAdsGateway.initialize();\n      } catch (error) {\n        AdRuntimeDiagnostics.record('MOBILE_ADS_INIT_FAILED', error: error);\n        rethrow;\n      }\n      _adsReady = true;\n      return true;\n    } catch (error) {\n      _adsReady = false;\n      if (AdRuntimeDiagnostics.lastFailure == null) {\n        AdRuntimeDiagnostics.record('AD_PRIVACY_INIT_FAILED', error: error);\n      }\n      return false;\n    } finally {\n      _initializing = null;\n    }\n  }\n""")

          replace_once(
          """  Future<bool> _ensureInitialized() {\n    if (_disposed || !Platform.isAndroid) return Future<bool>.value(false);\n    if (_initialized) return Future<bool>.value(true);\n""",
          """  Future<bool> _ensureInitialized() {\n    if (_disposed) {\n      AdRuntimeDiagnostics.record('SERVICE_DISPOSED');\n      return Future<bool>.value(false);\n    }\n    if (!Platform.isAndroid) {\n      AdRuntimeDiagnostics.record('UNSUPPORTED_PLATFORM');\n      return Future<bool>.value(false);\n    }\n    if (_initialized) return Future<bool>.value(true);\n""")

          replace_once(
          """      } catch (_) {\n        _initialized = false;\n        return false;\n      } finally {\n        _initializing = null;\n      }\n""",
          """      } catch (error) {\n        _initialized = false;\n        AdRuntimeDiagnostics.record('MONETIZATION_INIT_FAILED', error: error);\n        return false;\n      } finally {\n        _initializing = null;\n      }\n""")

          replace_once(
          """          onAdFailedToLoad: (_) {\n            _rewardedAd = null;\n            if (!completer.isCompleted) completer.complete(false);\n          },\n""",
          """          onAdFailedToLoad: (error) {\n            _rewardedAd = null;\n            AdRuntimeDiagnostics.recordLoadError('REWARDED_LOAD_FAILED', error);\n            if (!completer.isCompleted) completer.complete(false);\n          },\n""")

          replace_once(
          """      return await completer.future.timeout(\n        const Duration(seconds: 12),\n        onTimeout: () => false,\n      );\n    } catch (_) {\n      return false;\n    } finally {\n""",
          """      return await completer.future.timeout(\n        const Duration(seconds: 12),\n        onTimeout: () {\n          AdRuntimeDiagnostics.record('REWARDED_LOAD_TIMEOUT');\n          return false;\n        },\n      );\n    } catch (error) {\n      AdRuntimeDiagnostics.record('REWARDED_LOAD_EXCEPTION', error: error);\n      return false;\n    } finally {\n""")

          replace_once(
          """  Future<bool> showRewarded({String? gameId}) async {\n    if (!await _loadRewarded()) return false;\n    final ad = _rewardedAd;\n    if (ad == null) return false;\n""",
          """  Future<bool> showRewarded({String? gameId}) async {\n    AdRuntimeDiagnostics.clear();\n    if (!await _loadRewarded()) return false;\n    final ad = _rewardedAd;\n    if (ad == null) {\n      AdRuntimeDiagnostics.record('REWARDED_AD_MISSING_AFTER_LOAD');\n      return false;\n    }\n""")

          replace_once(
          """    if (requiresSsv) {\n      final ssvSession = await RewardedSsvClient.issueForGame(normalizedGameId);\n      if (ssvSession == null) return false;\n      try {\n""",
          """    if (requiresSsv) {\n      final ssvSession = await RewardedSsvClient.issueForGame(normalizedGameId);\n      if (ssvSession == null) {\n        AdRuntimeDiagnostics.record('SSV_SESSION_UNAVAILABLE');\n        return false;\n      }\n      try {\n""")

          replace_once(
          """      } catch (_) {\n        ad.dispose();\n        _rewardedAd = null;\n        unawaited(_loadRewarded());\n        return false;\n      }\n""",
          """      } catch (error) {\n        AdRuntimeDiagnostics.record('SSV_OPTIONS_FAILED', error: error);\n        ad.dispose();\n        _rewardedAd = null;\n        unawaited(_loadRewarded());\n        return false;\n      }\n""")

          replace_once(
          """          if (earned && requiresSsv) {\n            earned = await RewardedSsvClient.confirmForGame(normalizedGameId);\n          }\n          if (!completer.isCompleted) completer.complete(earned);\n""",
          """          if (earned && requiresSsv) {\n            earned = await RewardedSsvClient.confirmForGame(normalizedGameId);\n            if (!earned) {\n              AdRuntimeDiagnostics.record('SSV_CONFIRMATION_FAILED');\n            }\n          }\n          if (!earned && AdRuntimeDiagnostics.lastFailure == null) {\n            AdRuntimeDiagnostics.record('REWARD_CALLBACK_NOT_EARNED');\n          }\n          if (!completer.isCompleted) completer.complete(earned);\n""")

          replace_once(
          """      onAdFailedToShowFullScreenContent: (shownAd, _) {\n        shownAd.dispose();\n        if (!completer.isCompleted) completer.complete(false);\n""",
          """      onAdFailedToShowFullScreenContent: (shownAd, error) {\n        AdRuntimeDiagnostics.record('REWARDED_SHOW_FAILED', error: error);\n        shownAd.dispose();\n        if (!completer.isCompleted) completer.complete(false);\n""")

          replace_once(
          """    } catch (_) {\n      ad.dispose();\n      unawaited(_loadRewarded());\n      return false;\n    }\n  }\n\n  Future<BannerAd?> loadBanner() async {\n""",
          """    } catch (error) {\n      AdRuntimeDiagnostics.record('REWARDED_SHOW_EXCEPTION', error: error);\n      ad.dispose();\n      unawaited(_loadRewarded());\n      return false;\n    }\n  }\n\n  Future<BannerAd?> loadBanner() async {\n""")

          replace_once(
          """        onAdFailedToLoad: (failedAd, _) {\n          failedAd.dispose();\n          if (!completer.isCompleted) completer.complete(null);\n        },\n""",
          """        onAdFailedToLoad: (failedAd, error) {\n          AdRuntimeDiagnostics.recordLoadError('BANNER_LOAD_FAILED', error);\n          failedAd.dispose();\n          if (!completer.isCompleted) completer.complete(null);\n        },\n""")

          replace_once(
          """      return await completer.future.timeout(\n        const Duration(seconds: 12),\n        onTimeout: () {\n          ad.dispose();\n          return null;\n        },\n      );\n    } catch (_) {\n      ad.dispose();\n      return null;\n    }\n""",
          """      return await completer.future.timeout(\n        const Duration(seconds: 12),\n        onTimeout: () {\n          AdRuntimeDiagnostics.record('BANNER_LOAD_TIMEOUT');\n          ad.dispose();\n          return null;\n        },\n      );\n    } catch (error) {\n      AdRuntimeDiagnostics.record('BANNER_LOAD_EXCEPTION', error: error);\n      ad.dispose();\n      return null;\n    }\n""")

          replace_once(
          """    ScaffoldMessenger.of(context)\n      ..hideCurrentSnackBar()\n      ..showSnackBar(\n        const SnackBar(\n          content: Text(\n            'Reklam tamamlanmadı veya sunucu doğrulaması tamamlanamadı; '\n            'XP verilmedi ve bu oyun için hak korunuyor.',\n          ),\n        ),\n""",
          """    final diagnostic = AdRuntimeDiagnostics.userFacingSummary;\n    ScaffoldMessenger.of(context)\n      ..hideCurrentSnackBar()\n      ..showSnackBar(\n        SnackBar(\n          content: Text(\n            'Reklam tamamlanmadı veya sunucu doğrulaması tamamlanamadı; '\n            'XP verilmedi ve bu oyun için hak korunuyor.\\nTanı: $diagnostic',\n          ),\n        ),\n""")

          path.write_text(text)

          test = Path('test/ad_monetization_diagnostics_test.dart')
          test.write_text("""import 'dart:io';\n\nimport 'package:bilgi_rotasi/main.dart';\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  tearDown(AdRuntimeDiagnostics.clear);\n\n  test('AdMob tanısı kullanıcıya güvenli ve tek satır özet verir', () {\n    expect(AdRuntimeDiagnostics.lastFailure, isNull);\n\n    AdRuntimeDiagnostics.record(\n      'BANNER_LOAD_FAILED',\n      error: 'code=3\\ndomain=com.google.android.gms.ads',\n    );\n\n    expect(\n      AdRuntimeDiagnostics.userFacingSummary,\n      'BANNER_LOAD_FAILED: code=3 domain=com.google.android.gms.ads',\n    );\n    expect(AdRuntimeDiagnostics.userFacingSummary, isNot(contains('\\n')));\n  });\n\n  test('AdMob tanısı aşırı uzun SDK mesajını sınırlar', () {\n    AdRuntimeDiagnostics.record('REWARDED_LOAD_FAILED', error: 'x' * 500);\n    expect(AdRuntimeDiagnostics.userFacingSummary.length, lessThan(260));\n  });\n\n  test('runtime kaynak sözleşmesi ortak init ve iki reklam tipini ayırır', () {\n    final source = File('lib/ad_monetization.dart').readAsStringSync();\n\n    expect(source, contains("AdRuntimeDiagnostics.record('CONSENT_CAN_REQUEST_ADS_FALSE')"));\n    expect(source, contains("AdRuntimeDiagnostics.record('MOBILE_ADS_INIT_FAILED'"));\n    expect(source, contains("recordLoadError('BANNER_LOAD_FAILED', error)"));\n    expect(source, contains("recordLoadError('REWARDED_LOAD_FAILED', error)"));\n    expect(source, contains("AdRuntimeDiagnostics.record('SSV_SESSION_UNAVAILABLE')"));\n    expect(source, contains("AdRuntimeDiagnostics.record('SSV_CONFIRMATION_FAILED')"));\n    expect(source, contains('Tanı: $diagnostic'));\n  });\n}\n""")
          PY

          dart format lib/ad_monetization.dart test/ad_monetization_diagnostics_test.dart
          git diff --check
          git diff --name-only

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Run focused and full tests before product commit
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/ad_monetization_diagnostics_test.dart test/ad_monetization_test.dart --reporter expanded
          flutter test --concurrency=1 --reporter expanded
          flutter analyze --no-fatal-warnings --no-fatal-infos
          git diff --check

      - name: Verify scope and commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/admob-runtime-diagnostics-patch.yml
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          printf '%s\n' "${changed[@]}"
          expected=$(printf '%s\n' \
            '.github/workflows/admob-runtime-diagnostics-patch.yml' \
            'lib/ad_monetization.dart' \
            'test/ad_monetization_diagnostics_test.dart' | sort)
          actual=$(printf '%s\n' "${changed[@]}" | sort)
          test "$actual" = "$expected"
          test "$(git diff -- assets/questions.json | wc -c)" -eq 0
          test "$(git diff -- lib/main.dart | wc -c)" -eq 0
          git diff --check
          git config user.name 'ZMilaStudio'
          git config user.email 'levent.ua@gmail.com'
          git add -A
          git commit -m 'fix: expose AdMob runtime diagnostics'
          git push origin HEAD:fix/admob-runtime-diagnostics-20260821
