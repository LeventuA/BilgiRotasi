name: Kelime Avi V6 solid found path link QA

on:
  push:
    branches:
      - fix/kelime-avi-v6-found-path-solid-link-qa-20260901
    paths:
      - '.github/workflows/kelime-avi-v6-found-path-solid-link-qa.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
        with:
          ref: fix/kelime-avi-v6-found-path-solid-link-qa-20260901
          fetch-depth: 0

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Verify exact product base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lib/word_hunt/word_hunt_screens.dart)" = 'ba63f1bdeda7c31a634285bbc8e4eaf3652b2078'
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          grep -q 'strokeWidth = math.max(8, cellExtent \* \.44)' lib/word_hunt/word_hunt_screens.dart
          grep -q 'strokeWidth = math.max(5, cellExtent \* \.27)' lib/word_hunt/word_hunt_screens.dart
          grep -q 'final overlap = cellExtent \* \.34;' lib/word_hunt/word_hunt_screens.dart

      - name: Make found path a solid linked chain
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Color(0x55FF9D22)/Color(0x66FFB52A)/' lib/word_hunt/word_hunt_screens.dart
          sed -i 's/math.max(8, cellExtent \* \.44)/math.max(10, cellExtent * .68)/' lib/word_hunt/word_hunt_screens.dart
          sed -i 's/Color(0xD69B560D)/Color(0xF2C06A12)/' lib/word_hunt/word_hunt_screens.dart
          sed -i 's/math.max(5, cellExtent \* \.27)/math.max(8, cellExtent * .50)/' lib/word_hunt/word_hunt_screens.dart
          sed -i 's/final overlap = cellExtent \* \.34;/final overlap = cellExtent * .12;/' lib/word_hunt/word_hunt_screens.dart
          dart format lib/word_hunt/word_hunt_screens.dart
          grep -q 'strokeWidth = math.max(10, cellExtent \* \.68)' lib/word_hunt/word_hunt_screens.dart
          grep -q 'strokeWidth = math.max(8, cellExtent \* \.50)' lib/word_hunt/word_hunt_screens.dart
          grep -q 'final overlap = cellExtent \* \.12;' lib/word_hunt/word_hunt_screens.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Word Hunt
        run: dart analyze lib/word_hunt

      - name: Focused Word Hunt tests
        shell: bash
        run: flutter test test/word_hunt_*.dart

      - name: Scope and diff gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'lib/word_hunt/word_hunt_screens.dart'
          test "$(git diff --name-only -- assets/questions.json lib/main.dart assets/word_hunt/v5_reference_assets | wc -l)" -eq 0

      - name: Commit tested solid connector
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/word_hunt/word_hunt_screens.dart
          git diff --cached --check
          git commit -m 'fix(kelime-avi): make found word link continuous'
          git push origin HEAD:fix/kelime-avi-v6-found-path-solid-link-qa-20260901
