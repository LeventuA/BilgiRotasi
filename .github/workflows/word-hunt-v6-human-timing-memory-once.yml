# one-shot checkpoint trigger v2
name: Record Kelime Avi V6 B5 B10 Android16 checkpoint once

on:
  push:
    branches:
      - qa/kelime-avi-v6-human-timing-apk-20260901
    paths:
      - .github/workflows/word-hunt-v6-human-timing-memory-once.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/kelime-avi-v6-human-timing-apk-20260901
          fetch-depth: 0

      - name: Update canonical project summary in place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/project-memory/GENEL_PROJE_OZETI.md')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('**Son güncelleme:**'):
                  lines[i] = ('**Son güncelleme:** 2 Eylül 2026 — Kelime Avı V6 B5/B10 insan süre testi için '
                              'ayrı paketli QA APK Android 16 teknik runtime kapısı **PASS**. '
                              'Run `33560432922` SUCCESS; artifact `9821077483`; '
                              'APK SHA-256 `5e7fe5039b6cfbf61ac7a379a633eff4859568fd6dd9d631a742b0f167821180`. '
                              'B5 ve B10 64/64 hücre + full-raster screenshot PASS; install/launch/process-failure scan PASS. '
                              'İnsan zorluk/süre sonucu `PENDING_USER_PLAYTEST`; ürün kodu/sürüm/paket değiştirilmedi, merge yapılmadı.')
                  break
          else:
              raise SystemExit('Son güncelleme satırı bulunamadı')

          checkpoint = '''
## 2 Eylül 2026 — V6 B5/B10 insan süre testi Android 16 teknik gate

- QA branch: `qa/kelime-avi-v6-human-timing-apk-20260901`.
- Kaynak accepted ürün SHA: `4ddeff9e1f76167037756c430f6b61d6c0dd284c`; screen blob `fd4f830adf6d3c6c7ea6b4eaf2777fb7cedda9d1`.
- Ayrı QA package: `com.leventua.bilgirotasi.wordhuntqa`; production package `com.leventua.bilgirotasi` değişmedi.
- Exact QA APK SHA-256: `5e7fe5039b6cfbf61ac7a379a633eff4859568fd6dd9d631a742b0f167821180`.
- Full build/static kaynak run `33553850176`: accepted V6 scope PASS, analyze PASS, **138/138 PASS**, distinct-package APK build PASS.
- Final runtime-only Android 16 / API 36 AOSP ATD run `33560432922`: **SUCCESS**.
- Final artifact ID `9821077483`; digest `sha256:4f6ce9e3e3738fa5681b651e6698a937a68d14679214786e5fef458a4d8bc24e`.
- B5: 64/64 hücre render PASS, full-raster screenshot `02_B5_INITIAL.png` PASS (`2665199` byte).
- B10: 64/64 hücre render PASS, full-raster screenshot `04_B10_INITIAL.png` PASS (`2653485` byte).
- APK install PASS, app launch PASS, aynı process B5→B10 navigation PASS, crash/ANR/process-failure taraması PASS.
- B5 hedef süre 60 sn; B10 hedef süre 120 sn. Bunlar teknik render kapısı değil, **gerçek insan zorluk/süre ölçümü** olarak ayrıca değerlendirilecek.
- `HUMAN_TIMING_RESULT=PENDING_USER_PLAYTEST` — Levent gerçek oynayışı tamamlamadan PASS sayılmayacak.
- Bu QA hattı gameplay engine/path/scoring/timer/progression/content, `lib/main.dart`, `assets/questions.json`, sürüm veya production package üzerinde ürün değişikliği yapmadı.
- Merge yapılmadı.
'''
          marker = '## Kalan aktif sıra — YENİ SOHBET BURADAN DEVAM ETSİN'
          joined = '\n'.join(lines)
          if '## 2 Eylül 2026 — V6 B5/B10 insan süre testi Android 16 teknik gate' not in joined:
              if marker in joined:
                  joined = joined.replace(marker, checkpoint.rstrip() + '\n\n' + marker, 1)
              else:
                  joined = joined.rstrip() + '\n\n' + checkpoint.strip() + '\n'
          path.write_text(joined.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'HUMAN_TIMING_RESULT=PENDING_USER_PLAYTEST' docs/project-memory/GENEL_PROJE_OZETI.md
          grep -Fq '33560432922' docs/project-memory/GENEL_PROJE_OZETI.md

      - name: Commit checkpoint and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZMilaStudio'
          git config user.email 'levent.ua@gmail.com'
          git rm .github/workflows/word-hunt-v6-human-timing-memory-once.yml
          git add docs/project-memory/GENEL_PROJE_OZETI.md
          git diff --cached --check
          git commit -m 'docs(kelime-avi): record B5 B10 Android16 human timing gate [skip ci]'
          git push origin HEAD:qa/kelime-avi-v6-human-timing-apk-20260901
