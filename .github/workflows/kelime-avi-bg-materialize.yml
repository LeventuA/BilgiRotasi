name: Kelime Avı onaylı arka plan materyalizasyonu

on:
  push:
    branches:
      - feat/kelime-avi-clean-release-integration-20260821
    paths:
      - '.tmp/kelime-avi-bg/materialize.trigger'

permissions:
  contents: write

jobs:
  materialize:
    name: Onaylı Başlangıç Limanı JPG doğrula ve uygula
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Exact branch HEAD'i indir
        uses: actions/checkout@v4
        with:
          ref: feat/kelime-avi-clean-release-integration-20260821
          fetch-depth: 0

      - name: Parçaları ve onaylı JPEG hash'ini doğrula
        shell: bash
        run: |
          set -euo pipefail
          expected_count=22
          actual_count="$(find .tmp/kelime-avi-bg -maxdepth 1 -type f -name 'part[0-9][0-9].b64' | wc -l | tr -d ' ')"
          test "$actual_count" = "$expected_count"
          for i in $(seq -w 0 21); do
            test -s ".tmp/kelime-avi-bg/part${i}.b64"
          done
          cat $(printf '.tmp/kelime-avi-bg/part%02d.b64 ' $(seq 0 21)) > /tmp/baslangic_limani_bg.b64
          test "$(wc -c < /tmp/baslangic_limani_bg.b64 | tr -d ' ')" = "108416"
          base64 --decode /tmp/baslangic_limani_bg.b64 > /tmp/baslangic_limani_bg.jpg
          test "$(wc -c < /tmp/baslangic_limani_bg.jpg | tr -d ' ')" = "81310"
          echo "ea0034e2b3a7713f36bd36d2757815748e2988e831c91f213ad0c7a2eb050d45  /tmp/baslangic_limani_bg.jpg" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/baslangic_limani_bg.jpg')
          data = p.read_bytes()
          assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9'
          i = 2
          width = height = None
          sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          while i < len(data):
              if data[i] != 0xFF:
                  i += 1
                  continue
              while i < len(data) and data[i] == 0xFF:
                  i += 1
              marker = data[i]
              i += 1
              if marker in {0xD8,0xD9}:
                  continue
              length = int.from_bytes(data[i:i+2], 'big')
              if marker in sof:
                  height = int.from_bytes(data[i+3:i+5], 'big')
                  width = int.from_bytes(data[i+5:i+7], 'big')
                  break
              i += length
          assert (width, height) == (1080, 2340), (width, height)
          print(f'JPEG_DIMENSIONS={width}x{height}')
          PY

      - name: Yalnız doğrulanmış asset'i uygula ve staging'i temizle
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/baslangic_limani_bg.jpg assets/word_hunt/baslangic_limani_bg.jpg
          git rm -r .tmp/kelime-avi-bg
          git rm .github/workflows/kelime-avi-bg-materialize.yml
          git add assets/word_hunt/baslangic_limani_bg.jpg
          test "$(git diff --cached --name-only | grep -Fx 'assets/word_hunt/baslangic_limani_bg.jpg' | wc -l)" = "1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(kelime-avi): apply approved Baslangic Limani background'
          git push origin HEAD:feat/kelime-avi-clean-release-integration-20260821
