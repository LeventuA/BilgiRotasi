          )
          PY

          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md
            docs/project-memory/BILGI_ROTASI_DURUM.md
            docs/project-memory/GOREV_HAVUZU.md
          )
          test "${changed[*]}" = "${expected[*]}"
          grep -Fq 'FİZİKSEL FCM DAVRANIŞI PASS' docs/project-memory/GOREV_HAVUZU.md
          grep -Fq 'run `31806178473`' docs/project-memory/BILGI_ROTASI_DURUM.md
          grep -Fq 'DAVRANIŞ PASS / LOGCAT AÇIK' docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md
          git diff -- docs/project-memory/BILGI_ROTASI_DURUM.md docs/project-memory/GOREV_HAVUZU.md docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md

      - name: Commit and push memory update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/project-memory/BILGI_ROTASI_DURUM.md
          git add -- docs/project-memory/GOREV_HAVUZU.md
          git add -- docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md
