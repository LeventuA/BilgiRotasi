name: Kelime Avi V6 found connector memory promote

on:
  push:
    branches:
      - qa/kelime-avi-v5-reference-android16-proof-20260831
    paths:
      - '.github/workflows/word-hunt-v6-found-connector-memory-promote.yml'

permissions:
  contents: write

jobs:
  update-product-memory:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PRODUCT_BRANCH: fix/kelime-avi-v6-found-path-connector-product-20260901
      PRODUCT_CODE_SHA: e9aa2290ee3ae2df163e7053ddfe72c7ae617914
    steps:
      - name: Checkout clean product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0

      - name: Verify exact product code head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_CODE_SHA"
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          test "$(git hash-object lib/word_hunt/word_hunt_screens.dart)" = 'ba63f1bdeda7c31a634285bbc8e4eaf3652b2078'

      - name: Update required project memory
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(base64.b64decode('
aSBnZXLDp2VrIGdhcCBiw7ZsZ2VsZXJpIHJhdyBBbmRyb2lk4oCZZGUgZ8O2cnNlbCBkZcSfaxZFaW0gZ8O2c3RlcmVjZWsuICoqUEFTUyDigJQgYFszNjMsIDM1MV1gLCBgWU9MX0NPTk5FQ1RPUl9HQVBfR0FURT1QQVNTYC**
9. Yeni raw connected `YOL / 1/9` found-state Levent tarafından görsel olarak kabul edilecek. **AÇIK**
10. `ERROR_STATE_VISUAL` ve `REFERENCE_FONT` belirsizlikleri çözülecek veya ayrıca açıkça ertelenecek. **DOĞRULANACAK**
11. B5 60s / B10 120s gerçek insan süre-zorluk playtesti tamamlanacak veya ayrıca açıkça ertelenecek. **AÇIK**
12. PR Ready/merge kararı ayrı verilecek; Levent’in açık merge onayı olmadan merge yapılmayacak. **AÇIK**
"""
assert old_done in text
text = text.replace(old_done, new_done, 1)
old_evidence = """- Productization run: `33443015882` — SUCCESS.
- Android 16 raw proof run: `33436607792` — SUCCESS.
- Android artifact: `9775000736`.
- YOL semantic visual gate: PASS; başarılı swipe süresi 1800 ms.
"""
new_evidence = """- Önceki V6 productization run: `33443015882` — SUCCESS.
- Connector static/test run: `33447265769` — SUCCESS / 138/138 PASS.
- Connector raw Android 16 run: `33447435566` — SUCCESS.
- Connector Android artifact: `9778806592`.
- Artifact digest: `sha256:be9afd06e5a3df5fc1224cfd8dbd60bd07efa6f02d488ba74ac574937a463909`.
- YOL semantic visual gate: PASS; başarılı swipe süresi 1800 ms.
- YOL connector gap gate: PASS; changed pixels `[363, 351]`.
"""
assert old_evidence in text
text = text.replace(old_evidence, new_evidence, 1)
p.write_text(text, encoding="utf-8")

# KARARLAR
p = Path("docs/project-memory/KARARLAR.md")
text = p.read_text(encoding="utf-8")
decision = """
---

## 10. 1 Eylül 2026 — Gameplay found-state continuous path kararı

- Levent'in raw gameplay geri bildirimi bağlayıcıdır: mevcut gerçek gameplay ekranında yerleşim, ölçek, panel/plaque sunumu, grid hücre görünümü ve diğer unsurlar korunur; açık kalan görsel fark yalnız **bulunan kelimenin ardışık harf/hücrelerinin birbirine bağlanmasıdır**.
- Found kelime, üç ayrı bağımsız glow kutusu gibi değil; tek sürükleme hareketini anlatan **kesintisiz/continuous görsel iz** olarak okunmalıdır.
- Bu bağlantı mevcut `_foundPaths` runtime verisinden türetilir; yeni gameplay state/engine sözleşmesi yaratılmaz.
- Bağlantı katmanı hücrelerin arkasında kalır; harf okunaklılığı, cell asset'i, hitbox, `_harborGridSpacing`, 8×8 geometri ve mevcut V6 kompozisyonu değiştirilmez.
- Yatay, dikey ve çapraz canonical found path'lerde aynı yaklaşım kullanılır.
- İç `Kelime Avı V5 Gameplay QA` seçim menüsü yalnız test aracıdır; ürün ekranı değildir ve kullanıcı görsel kabul kanıtı olarak gösterilmez.
- Final connector görsel kabulü yalnız **raw Android runtime screenshot** üzerinden verilir; image-edit/mockup kanıt değildir.
"""
if "## 10. 1 Eylül 2026 — Gameplay found-state continuous path kararı" not in text:
    text = text.rstrip() + "\n\n" + decision.strip() + "\n"
p.write_text(text, encoding="utf-8")

# ACIK_SORULAR
