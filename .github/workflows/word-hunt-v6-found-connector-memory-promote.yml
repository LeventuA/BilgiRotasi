    "- `USER_VISUAL_ACCEPTANCE_FOUND` — Raw Android 16 B10 `YOL / 1/9` found-state görüntüsü Levent görsel kabulü: **AÇIK**.\n",
    "- `GAMEPLAY_COMPOSITION_EXCEPT_FOUND_CONNECTOR` — Levent mevcut gameplay ekranında connector dışındaki unsurlar için “herşey okey” dedi: **PASS / KAPALI**.\n"
    "- `USER_VISUAL_ACCEPTANCE_FOUND_CONNECTOR` — Yeni raw Android 16 B10 `YOL / 1/9` continuous connector found-state görsel kabulü: **AÇIK**.\n",
    1
)
if "- `PR_163_READY_DECISION`" not in text:
    text = text.replace(
        "- `PR_162_READY_DECISION` — V6 visual child PR #162 Ready kararı: **AÇIK**.\n",
        "- `PR_162_READY_DECISION` — V6 visual child PR #162 Ready kararı: **AÇIK**.\n"
        "- `PR_163_READY_DECISION` — V6 found-path connector child PR #163 Ready kararı: **AÇIK**.\n",
        1
    )
text = text.replace(
    "PR #161 veya PR #162, Levent’in ayrı ve açık merge onayı olmadan merge edilmeyecek.",
    "PR #161, #162 veya #163, Levent’in ayrı ve açık merge onayı olmadan merge edilmeyecek.",
    1
)
p.write_text(text, encoding="utf-8")

# GENEL_PROJE_OZETI
p = Path("docs/project-memory/GENEL_PROJE_OZETI.md")
text = p.read_text(encoding="utf-8")
text = re.sub(
    r"^\*\*Son güncelleme:\*\*.*$",
    "**Son güncelleme:** 1 Eylül 2026 — Kelime Avı V6 found-state connector teknik PASS. Mevcut gameplay kompozisyonu Levent tarafından connector dışında kabul edildi; Y-O-L hücreleri raw Android'de continuous altın köprüyle birleşiyor. Run `33447435566`, artifact `9778806592`; Draft PR #163 OPEN/DRAFT. Kalan kapı yalnız yeni connected found-state kullanıcı görsel kabulü + önceki açık playtest/doğrulamalar; merge yok.",
    text,
