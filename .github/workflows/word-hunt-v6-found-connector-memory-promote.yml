          git add BILGI_ROTASI_DURUM.md GOREV_HAVUZU.md ACIK_SORULAR_VE_DOGRULAMALAR.md docs/project-memory/KARARLAR.md docs/project-memory/GENEL_PROJE_OZETI.md
