name: AdMob production release (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Production için PRODUCTION, kapalı test için CLOSED_TEST yazın
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admob-production-release
  cancel-in-progress: false

jobs:
  production-release:
    if: inputs.confirmation == 'PRODUCTION'
    name: Production APK ve AAB doğrulaması
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_ADMOB_ENVIRONMENT: production

    steps:
      - name: Production onayını doğrula
        shell: bash
        env:
          PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$PRODUCTION_CONFIRMATION" = "PRODUCTION"

      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Sürümü pubspec.yaml dosyasından oku
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"
          test "$VERSION_NAME" != "$VERSION"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=${VERSION_NAME}-${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: Dart production reklam kimliklerini doğrula
        run: >-
          flutter test
          --dart-define=ADMOB_ENVIRONMENT=production
          --dart-define=FIREBASE_ENVIRONMENT=production
          test/admob_id_profile_test.dart

      - name: Dart production Firebase profilini doğrula
        run: >-
          flutter test
          --dart-define=FIREBASE_ENVIRONMENT=production
          --dart-define=EXPECT_FIREBASE_PRODUCTION=true
          test/firebase_production_profile_test.dart

      - name: Kalıcı Android imzasını hazırla
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/bilgi_rotasi_upload.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bilgi_rotasi_upload.jks
          EOF

          chmod 600 \
            android/app/bilgi_rotasi_upload.jks \
            android/key.properties
          test -s android/app/bilgi_rotasi_upload.jks
          test -s android/key.properties

      - name: Production APK üret
        run: >-
          flutter build apk --release
          --dart-define=ADMOB_ENVIRONMENT=production
          --dart-define=FIREBASE_ENVIRONMENT=production

      - name: Google Play production AAB üret
        run: >-
          flutter build appbundle --release
          --dart-define=ADMOB_ENVIRONMENT=production
          --dart-define=FIREBASE_ENVIRONMENT=production

      - name: Bundletool kur
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"
          test -s "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" version

      - name: Production paketlerini ve manifestleri doğrula
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist reports
          SOURCE_APK="build/app/outputs/flutter-apk/app-release.apk"
          SOURCE_AAB="build/app/outputs/bundle/release/app-release.aab"
          APK="dist/BilgiRotasi-${VERSION_LABEL}-production.apk"
          AAB="dist/BilgiRotasi-${VERSION_LABEL}-production.aab"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          test -f "$SOURCE_APK"
          test -f "$SOURCE_AAB"
          cp "$SOURCE_APK" "$APK"
          cp "$SOURCE_AAB" "$AAB"

          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 \
            | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner \
            | sort -V | tail -n 1)"
          test -x "$AAPT2"
          test -x "$APKSIGNER"

          "$AAPT2" dump badging "$APK" \
            | tee reports/ADMOB_PRODUCTION_APK_BADGING.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" \
            | tee reports/ADMOB_PRODUCTION_APK_MANIFEST.txt
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
            --bundle="$AAB" \
            > reports/ADMOB_PRODUCTION_AAB_MANIFEST.xml

          grep -Fq "package: name='com.leventua.bilgirotasi'" \
            reports/ADMOB_PRODUCTION_APK_BADGING.txt
          grep -Fq "versionCode='$VERSION_CODE'" \
            reports/ADMOB_PRODUCTION_APK_BADGING.txt
          grep -Fq "versionName='$VERSION_NAME'" \
            reports/ADMOB_PRODUCTION_APK_BADGING.txt

          grep -Fq 'package="com.leventua.bilgirotasi"' \
            reports/ADMOB_PRODUCTION_AAB_MANIFEST.xml
          grep -Fq "android:versionCode=\"$VERSION_CODE\"" \
            reports/ADMOB_PRODUCTION_AAB_MANIFEST.xml
          grep -Fq "android:versionName=\"$VERSION_NAME\"" \
            reports/ADMOB_PRODUCTION_AAB_MANIFEST.xml

          grep -Fq "com.google.android.gms.ads.APPLICATION_ID" \
            reports/ADMOB_PRODUCTION_APK_MANIFEST.txt
          grep -Fq "ca-app-pub-7452194004008791~7046504043" \
            reports/ADMOB_PRODUCTION_APK_MANIFEST.txt
          ! grep -Fq "ca-app-pub-3940256099942544~3347511713" \
            reports/ADMOB_PRODUCTION_APK_MANIFEST.txt
          grep -Fq "ca-app-pub-7452194004008791~7046504043" \
            reports/ADMOB_PRODUCTION_AAB_MANIFEST.xml
          ! grep -Fq "ca-app-pub-3940256099942544~3347511713" \
            reports/ADMOB_PRODUCTION_AAB_MANIFEST.xml

          APK_CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$APK_CERT_OUTPUT" \
            | tee reports/ADMOB_PRODUCTION_APK_CERTIFICATE.txt
          APK_SHA1="$(
            printf '%s\n' "$APK_CERT_OUTPUT" \
              | awk -F': ' \
                '/certificate SHA-1 digest/ {print $NF; exit}' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]:'
          )"

          jarsigner -verify "$AAB"
          AAB_CERT_OUTPUT="$(keytool -printcert -jarfile "$AAB")"
          printf '%s\n' "$AAB_CERT_OUTPUT" \
            | tee reports/ADMOB_PRODUCTION_AAB_CERTIFICATE.txt
          AAB_SHA1="$(
            printf '%s\n' "$AAB_CERT_OUTPUT" \
              | awk -F': ' '/SHA1:/ {print $2; exit}' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]:'
          )"

          EXPECTED_SHA1="000EE43F410ABC6B4F634C4F716D76EB19084115"
          test "$APK_SHA1" = "$EXPECTED_SHA1"
          test "$AAB_SHA1" = "$EXPECTED_SHA1"

          sha256sum "$APK" \
            | tee reports/ADMOB_PRODUCTION_APK_SHA256.txt
          sha256sum "$AAB" \
            | tee reports/ADMOB_PRODUCTION_AAB_SHA256.txt

      - name: Production APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-Production-APK-${{ env.VERSION_LABEL }}
          path: |
            dist/BilgiRotasi-${{ env.VERSION_LABEL }}-production.apk
            reports/ADMOB_PRODUCTION_APK_BADGING.txt
            reports/ADMOB_PRODUCTION_APK_MANIFEST.txt
            reports/ADMOB_PRODUCTION_APK_CERTIFICATE.txt
            reports/ADMOB_PRODUCTION_APK_SHA256.txt
          if-no-files-found: error
          retention-days: 3

      - name: Production AAB artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-Production-AAB-${{ env.VERSION_LABEL }}
          path: |
            dist/BilgiRotasi-${{ env.VERSION_LABEL }}-production.aab
            reports/ADMOB_PRODUCTION_AAB_MANIFEST.xml
            reports/ADMOB_PRODUCTION_AAB_CERTIFICATE.txt
            reports/ADMOB_PRODUCTION_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Geçici imza dosyalarını temizle
        if: always()
        shell: bash
        run: |
          rm -f \
            android/key.properties \
            android/app/bilgi_rotasi_upload.jks

  closed-test-release:
    if: inputs.confirmation == 'CLOSED_TEST'
    uses: ./.github/workflows/closed-test-release-core.yml
    with:
      confirmation: ${{ inputs.confirmation }}
    secrets: inherit
