name: Gokyuzu Master Art V2 implement

on:
  push:
    branches:
      - ci/gokyuzu-master-art-v2-implementation-20260905

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kelime-avi-gokyuzu-master-art-v2-20260905
          fetch-depth: 0

      - name: Verify exact approved-art head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7783ac9076cc793e839ee7250991527b5a6f63ec"
          test "$(git rev-parse HEAD^)" = "3557a7e4f2f2917d61ba61866c6d4c8561994667"
          test "$(wc -c < assets/word_hunt/gokyuzu_adalari_master_art_v2.webp)" -eq 222508
          test "$(sha256sum assets/word_hunt/gokyuzu_adalari_master_art_v2.webp | cut -d' ' -f1)" = "8a34b03f9c24400d7ebb80c2396d457fc0335b7b11cf77278990cf72fd5e21ea"
          grep -qx 'version: 1.68.19+109' pubspec.yaml

      - name: Write MASTER ART production screen and tests
        shell: bash
        run: |
          set -euo pipefail
          cat > lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'word_hunt_models.dart';
          import 'word_hunt_progress.dart';

          /// Levent'in 3 Eylül 2026'da onayladığı Gökyüzü Adaları V2 rota
          /// görselini tek görünür MASTER ART tabanı olarak kullanan production
          /// rota ekranı. Ada, landmark, rota, başlık paneli, plaque ve alt köşe
          /// kontrolleri Flutter ile ikinci kez çizilmez.
          abstract final class WordHuntGokyuzuMasterArtAssets {
            static const String masterArt =
                'assets/word_hunt/gokyuzu_adalari_master_art_v2.webp';
          }

          abstract final class WordHuntGokyuzuMasterArtLayout {
            static const Size sourceSize = Size(1085, 1536);

            static const List<Offset> levelCenters = <Offset>[
              Offset(170, 350),
              Offset(500, 410),
              Offset(810, 545),
              Offset(215, 695),
              Offset(550, 800),
              Offset(835, 885),
              Offset(200, 980),
              Offset(515, 1090),
              Offset(230, 1275),
              Offset(810, 1300),
            ];

            static const List<double> levelHitboxDiameters = <double>[
              132,
              132,
              132,
              140,
              140,
              142,
              142,
              150,
              150,
              170,
            ];

            static const Offset compassCenter = Offset(100, 1405);
            static const Offset bookCenter = Offset(960, 1405);
            static const double bottomControlHitboxDiameter = 175;

            static const Offset backCenter = Offset(74, 48);
            static const Offset infoCenter = Offset(1010, 48);
            static const double topControlHitboxDiameter = 112;

            static const Rect progressCounterRect = Rect.fromLTWH(292, 100, 128, 48);
            static const Rect gateCounterRect = Rect.fromLTWH(650, 100, 158, 48);
          }

          class WordHuntGokyuzuMasterArtScreen extends StatelessWidget {
            const WordHuntGokyuzuMasterArtScreen({
              super.key,
              required this.route,
              this.progress = const WordHuntProgressSnapshot(),
              this.onBack,
              this.onInfo,
              this.onCompass,
              this.onBook,
              this.onLevelTap,
            });

            static const String routeId = 'gokyuzu-adalari';

            final WordHuntRouteDefinition route;
            final WordHuntProgressSnapshot progress;
            final VoidCallback? onBack;
            final VoidCallback? onInfo;
            final VoidCallback? onCompass;
            final VoidCallback? onBook;
            final ValueChanged<int>? onLevelTap;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                key: const Key('word_hunt_gokyuzu_master_art_route'),
                backgroundColor: const Color(0xFF083A78),
                body: ClipRect(
                  child: Stack(
                    fit: StackFit.expand,
                    children: <Widget>[
                      // 9:16 cihazlarda onaylı 1085x1536 görsel kırpılmasın diye
                      // aynı sanatın koyulaştırılmış cover kopyası yalnız dış dolgu
                      // görevi görür. Asıl MASTER ART üstte contain olarak eksiksizdir.
                      IgnorePointer(
                        child: Opacity(
                          opacity: .34,
                          child: Image.asset(
                            WordHuntGokyuzuMasterArtAssets.masterArt,
                            fit: BoxFit.cover,
                            alignment: Alignment.center,
                            filterQuality: FilterQuality.low,
                            color: const Color(0x6611254B),
                            colorBlendMode: BlendMode.darken,
                          ),
                        ),
                      ),
                      Center(
                        child: FittedBox(
                          fit: BoxFit.contain,
                          child: SizedBox.fromSize(
                            key: const Key('word_hunt_gokyuzu_master_art_source_scene'),
                            size: WordHuntGokyuzuMasterArtLayout.sourceSize,
                            child: Stack(
                              fit: StackFit.expand,
                              children: <Widget>[
                                IgnorePointer(
                                  child: Image.asset(
                                    WordHuntGokyuzuMasterArtAssets.masterArt,
                                    key: const Key('word_hunt_gokyuzu_master_art_image'),
                                    width: WordHuntGokyuzuMasterArtLayout.sourceSize.width,
                                    height: WordHuntGokyuzuMasterArtLayout.sourceSize.height,
                                    fit: BoxFit.fill,
                                    filterQuality: FilterQuality.high,
                                  ),
                                ),
                                _GokyuzuRuntimeOverlay(route: route, progress: progress),
                                for (
                                  var index = 0;
                                  index < route.levels.length &&
                                      index < WordHuntGokyuzuMasterArtLayout.levelCenters.length;
                                  index++
                                )
                                  _TransparentHitbox(
                                    key: Key('word_hunt_gokyuzu_master_art_level_${index + 1}'),
                                    center: WordHuntGokyuzuMasterArtLayout.levelCenters[index],
                                    diameter: WordHuntGokyuzuMasterArtLayout
                                        .levelHitboxDiameters[index],
                                    semanticLabel: 'Bölüm ${index + 1}',
                                    onTap: WordHuntRouteProgressEngine.isLevelUnlocked(
                                              route,
                                              progress,
                                              index + 1,
                                            ) &&
                                            onLevelTap != null
                                        ? () => onLevelTap!(index + 1)
                                        : null,
                                  ),
                                _TransparentHitbox(
                                  key: const Key('word_hunt_gokyuzu_master_art_compass'),
                                  center: WordHuntGokyuzuMasterArtLayout.compassCenter,
                                  diameter: WordHuntGokyuzuMasterArtLayout
                                      .bottomControlHitboxDiameter,
                                  semanticLabel: 'Pusula',
                                  onTap: onCompass,
                                ),
                                _TransparentHitbox(
                                  key: const Key('word_hunt_gokyuzu_master_art_book'),
                                  center: WordHuntGokyuzuMasterArtLayout.bookCenter,
                                  diameter: WordHuntGokyuzuMasterArtLayout
                                      .bottomControlHitboxDiameter,
                                  semanticLabel: 'Bilgi Kitabı',
                                  onTap: onBook,
                                ),
                                _TransparentHitbox(
                                  key: const Key('word_hunt_gokyuzu_master_art_back'),
                                  center: WordHuntGokyuzuMasterArtLayout.backCenter,
                                  diameter: WordHuntGokyuzuMasterArtLayout
                                      .topControlHitboxDiameter,
                                  semanticLabel: 'Geri',
                                  onTap: onBack,
                                ),
                                _TransparentHitbox(
                                  key: const Key('word_hunt_gokyuzu_master_art_info'),
                                  center: WordHuntGokyuzuMasterArtLayout.infoCenter,
                                  diameter: WordHuntGokyuzuMasterArtLayout
                                      .topControlHitboxDiameter,
                                  semanticLabel: 'Bilgi',
                                  onTap: onInfo,
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class _GokyuzuRuntimeOverlay extends StatelessWidget {
            const _GokyuzuRuntimeOverlay({required this.route, required this.progress});

            final WordHuntRouteDefinition route;
            final WordHuntProgressSnapshot progress;

            @override
            Widget build(BuildContext context) {
              final totalStars = WordHuntRouteProgressEngine.totalStars(route, progress);
              return IgnorePointer(
                child: Stack(
                  fit: StackFit.expand,
                  children: <Widget>[
                    if (totalStars != 0)
                      _CounterPatch(
                        key: const Key('word_hunt_gokyuzu_master_art_progress'),
                        rect: WordHuntGokyuzuMasterArtLayout.progressCounterRect,
                        text: '$totalStars / ${route.maximumStars}',
                      ),
                    if (route.unlockStarsRequired != 18)
                      _CounterPatch(
                        key: const Key('word_hunt_gokyuzu_master_art_gate'),
                        rect: WordHuntGokyuzuMasterArtLayout.gateCounterRect,
                        text: 'Kapı: ${route.unlockStarsRequired}',
                      ),
                    for (
                      var index = 0;
                      index < route.levels.length &&
                          index < WordHuntGokyuzuMasterArtLayout.levelCenters.length;
                      index++
                    )
                      if (!WordHuntRouteProgressEngine.isLevelUnlocked(
                        route,
                        progress,
                        index + 1,
                      ))
                        _LockBadge(
                          key: Key(
                            'word_hunt_gokyuzu_master_art_level_${index + 1}_locked',
                          ),
                          center: WordHuntGokyuzuMasterArtLayout.levelCenters[index],
                        ),
                  ],
                ),
              );
            }
          }

          class _CounterPatch extends StatelessWidget {
            const _CounterPatch({super.key, required this.rect, required this.text});

            final Rect rect;
            final String text;

            @override
            Widget build(BuildContext context) {
              return Positioned.fromRect(
                rect: rect,
                child: DecoratedBox(
                  decoration: BoxDecoration(
                    color: const Color(0xEC09284C),
                    borderRadius: BorderRadius.circular(10),
                    border: Border.all(color: const Color(0xFFFFC52F), width: 2),
                    boxShadow: const <BoxShadow>[
                      BoxShadow(color: Color(0x88000000), blurRadius: 5),
                    ],
                  ),
                  child: Center(
                    child: Text(
                      text,
                      style: const TextStyle(
                        color: Colors.white,
                        fontFamily: 'serif',
                        fontSize: 24,
                        fontWeight: FontWeight.w700,
                        shadows: <Shadow>[
                          Shadow(color: Colors.black, blurRadius: 3),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class _LockBadge extends StatelessWidget {
            const _LockBadge({super.key, required this.center});

            final Offset center;

            @override
            Widget build(BuildContext context) {
              const diameter = 72.0;
              return Positioned(
                left: center.dx - diameter / 2,
                top: center.dy - diameter / 2,
                width: diameter,
                height: diameter,
                child: DecoratedBox(
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    color: const Color(0xE8092443),
                    border: Border.all(color: const Color(0xFFFFC52F), width: 3),
                    boxShadow: const <BoxShadow>[
                      BoxShadow(color: Color(0x99000000), blurRadius: 8),
                    ],
                  ),
                  child: const Icon(
                    Icons.lock_rounded,
                    color: Color(0xFFF7F4E9),
                    size: 32,
                  ),
                ),
              );
            }
          }

          class _TransparentHitbox extends StatelessWidget {
            const _TransparentHitbox({
              super.key,
              required this.center,
              required this.diameter,
              required this.semanticLabel,
              this.onTap,
            });

            final Offset center;
            final double diameter;
            final String semanticLabel;
            final VoidCallback? onTap;

            @override
            Widget build(BuildContext context) {
              return Positioned(
                left: center.dx - diameter / 2,
                top: center.dy - diameter / 2,
                width: diameter,
                height: diameter,
                child: Semantics(
                  button: true,
                  enabled: onTap != null,
                  label: semanticLabel,
                  child: GestureDetector(
                    behavior: HitTestBehavior.translucent,
                    onTap: onTap,
                    child: const SizedBox.expand(),
                  ),
                ),
              );
            }
          }
          DART

          python3 - <<'PY'
          from pathlib import Path

          entry = Path('lib/word_hunt/word_hunt_production_entry_screen.dart')
          text = entry.read_text()
          import_anchor = "import 'word_hunt_models.dart';\n"
          import_line = "import 'word_hunt_gokyuzu_master_art_screen.dart';\n"
          if import_line not in text:
              text = text.replace(import_anchor, import_line + import_anchor, 1)
          old = """    return WordHuntReferenceRouteScreen(\n      key: const Key('word_hunt_production_entry_route'),\n      route: widget.route,\n      progress: _progress,\n      onBack: () => Navigator.of(context).maybePop(),\n      onInfo: _showInfo,\n      onCompass: _showCompassHint,\n      onBook: _showBook,\n      onLevelTap: _openLevel,\n    );\n"""
          new = """    if (widget.route.id == WordHuntGokyuzuMasterArtScreen.routeId) {\n      return WordHuntGokyuzuMasterArtScreen(\n        key: const Key('word_hunt_production_entry_gokyuzu_route'),\n        route: widget.route,\n        progress: _progress,\n        onBack: () => Navigator.of(context).maybePop(),\n        onInfo: _showInfo,\n        onCompass: _showCompassHint,\n        onBook: _showBook,\n        onLevelTap: _openLevel,\n      );\n    }\n\n    return WordHuntReferenceRouteScreen(\n      key: const Key('word_hunt_production_entry_route'),\n      route: widget.route,\n      progress: _progress,\n      onBack: () => Navigator.of(context).maybePop(),\n      onInfo: _showInfo,\n      onCompass: _showCompassHint,\n      onBook: _showBook,\n      onLevelTap: _openLevel,\n    );\n"""
          if old not in text:
              raise SystemExit('production entry anchor not found')
          text = text.replace(old, new, 1)
          entry.write_text(text)

          progress = Path('lib/word_hunt/word_hunt_progress.dart')
          text = progress.read_text()
          old = """    if (route.id == 'baslangic-limani' && levelIndex == 9) {\n      final levelBeforeBonus = route.levels[levelIndex - 3];\n      return isLevelCompleted(levelBeforeBonus, progress);\n    }\n"""
          new = """    if ((route.id == 'baslangic-limani' ||\n            route.id == WordHuntGokyuzuMasterArtScreen.routeId) &&\n        levelIndex == 9) {\n      final levelBeforeBonus = route.levels[levelIndex - 3];\n      return isLevelCompleted(levelBeforeBonus, progress);\n    }\n"""
          # Avoid cross-file dependency in progress engine: use route literal instead.
          new = new.replace("route.id == WordHuntGokyuzuMasterArtScreen.routeId", "route.id == 'gokyuzu-adalari'")
          if old not in text:
              raise SystemExit('progress anchor not found')
          text = text.replace(old, new, 1)
          progress.write_text(text)
          PY

          cat > test/word_hunt_gokyuzu_master_art_screen_test.dart <<'DART'
          import 'package:bilgi_rotasi/word_hunt/word_hunt_gokyuzu_master_art_screen.dart';
          import 'package:bilgi_rotasi/word_hunt/word_hunt_models.dart';
          import 'package:bilgi_rotasi/word_hunt/word_hunt_progress.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            final route = _route();

            testWidgets('approved MASTER ART and transparent controls render', (tester) async {
              var tapped = 0;
              await tester.pumpWidget(
                MaterialApp(
                  home: WordHuntGokyuzuMasterArtScreen(
                    route: route,
                    onLevelTap: (index) => tapped = index,
                  ),
                ),
              );
              await tester.pump();

              expect(find.byKey(const Key('word_hunt_gokyuzu_master_art_image')), findsOneWidget);
              expect(find.byKey(const Key('word_hunt_gokyuzu_master_art_compass')), findsOneWidget);
              expect(find.byKey(const Key('word_hunt_gokyuzu_master_art_book')), findsOneWidget);
              expect(find.byKey(const Key('word_hunt_gokyuzu_master_art_back')), findsOneWidget);
              expect(find.byKey(const Key('word_hunt_gokyuzu_master_art_info')), findsOneWidget);
              for (var index = 1; index <= 10; index++) {
                expect(
                  find.byKey(Key('word_hunt_gokyuzu_master_art_level_$index')),
                  findsOneWidget,
                );
              }

              await tester.tap(find.byKey(const Key('word_hunt_gokyuzu_master_art_level_1')));
              await tester.pump();
              expect(tapped, 1);

              tapped = 0;
              await tester.tap(find.byKey(const Key('word_hunt_gokyuzu_master_art_level_2')));
              await tester.pump();
              expect(tapped, 0);
              expect(
                find.byKey(const Key('word_hunt_gokyuzu_master_art_level_2_locked')),
                findsOneWidget,
              );
            });

            testWidgets('completed previous level unlocks the next hitbox', (tester) async {
              var tapped = 0;
              final progress = const WordHuntProgressSnapshot(
                bestStarsByLevelId: <String, int>{'gokyuzu-1': 2},
              );
              await tester.pumpWidget(
                MaterialApp(
                  home: WordHuntGokyuzuMasterArtScreen(
                    route: route,
                    progress: progress,
                    onLevelTap: (index) => tapped = index,
                  ),
                ),
              );
              await tester.pump();

              await tester.tap(find.byKey(const Key('word_hunt_gokyuzu_master_art_level_2')));
              await tester.pump();
              expect(tapped, 2);
              expect(
                find.byKey(const Key('word_hunt_gokyuzu_master_art_level_2_locked')),
                findsNothing,
              );
            });

            test('level 7 opens bonus 8 and normal 9; 10 waits for 9', () {
              final after7 = const WordHuntProgressSnapshot(
                bestStarsByLevelId: <String, int>{
                  'gokyuzu-1': 1,
                  'gokyuzu-2': 1,
                  'gokyuzu-3': 1,
                  'gokyuzu-4': 1,
                  'gokyuzu-5': 1,
                  'gokyuzu-6': 1,
                  'gokyuzu-7': 1,
                },
              );
              expect(WordHuntRouteProgressEngine.isLevelUnlocked(route, after7, 8), isTrue);
              expect(WordHuntRouteProgressEngine.isLevelUnlocked(route, after7, 9), isTrue);
              expect(WordHuntRouteProgressEngine.isLevelUnlocked(route, after7, 10), isFalse);

              final after9 = after7.recordLevelResult(levelId: 'gokyuzu-9', stars: 1);
              expect(WordHuntRouteProgressEngine.isLevelUnlocked(route, after9, 10), isTrue);
            });
          }

          WordHuntRouteDefinition _route() {
            return WordHuntRouteDefinition(
              id: 'gokyuzu-adalari',
              title: 'Gökyüzü Adaları',
              theme: 'gokyuzu',
              unlockStarsRequired: 18,
              routeRewardId: 'badge-gokyuzu-kasifi',
              levels: List<WordHuntLevelDefinition>.generate(10, (zeroBased) {
                final index = zeroBased + 1;
                return WordHuntLevelDefinition(
                  id: 'gokyuzu-$index',
                  routeId: 'gokyuzu-adalari',
                  index: index,
                  type: index == 8
                      ? WordHuntLevelType.bonus
                      : index == 10
                          ? WordHuntLevelType.routeFinal
                          : WordHuntLevelType.normal,
                  grid: const <String>['ABC', 'DEF', 'GHI'],
                  targetWords: const <String>['ABC'],
                  starRules: const WordHuntStarRules(),
                );
              }),
            );
          }
          DART

      - name: Flutter 3.44.6 setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format, analyze and focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart \
            lib/word_hunt/word_hunt_production_entry_screen.dart \
            lib/word_hunt/word_hunt_progress.dart \
            test/word_hunt_gokyuzu_master_art_screen_test.dart
          git diff --check
          flutter pub get
          dart analyze \
            lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart \
            lib/word_hunt/word_hunt_production_entry_screen.dart \
            lib/word_hunt/word_hunt_progress.dart \
            test/word_hunt_gokyuzu_master_art_screen_test.dart
          flutter test \
            test/word_hunt_gokyuzu_master_art_screen_test.dart \
            test/word_hunt_progress_test.dart \
            test/word_hunt_pixel_proof_screen_test.dart \
            test/word_hunt_reference_route_screen_test.dart \
            test/word_hunt_production_flow_test.dart \
            --reporter expanded
          test "$(git diff --name-only 7783ac9076cc793e839ee7250991527b5a6f63ec -- | grep -v '^$' | wc -l)" -eq 4
          test -z "$(git diff --name-only 7783ac9076cc793e839ee7250991527b5a6f63ec -- assets/questions.json android/ || true)"
          grep -qx 'version: 1.68.19+109' pubspec.yaml

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart \
            lib/word_hunt/word_hunt_production_entry_screen.dart \
            lib/word_hunt/word_hunt_progress.dart \
            test/word_hunt_gokyuzu_master_art_screen_test.dart
          git commit -m 'feat(kelime-avi): use approved gokyuzu master art route'
          git push origin HEAD:feat/kelime-avi-gokyuzu-master-art-v2-20260905
