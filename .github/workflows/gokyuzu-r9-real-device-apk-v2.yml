name: Gokyuzu R9 real-device APK v2

on:
  push:
    branches:
      - qa/gokyuzu-r9-real-device-apk-20260906

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-22.04
    env:
      PRODUCT_SHA: 4ac12cc75fdbc575abcaaf1fdb3dc5950a7ca261
      CANONICAL_SHA: 3557a7e4f2f2917d61ba61866c6d4c8561994667
      CONTENT_SHA: 4ec33de7438fcbd15ed63b1ae2adda127da3be8c
      QA_PACKAGE: com.leventua.bilgirotasi.gokyuzur9qa
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Verify product and approved assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse origin/release/final-closed-test-aab-1.68.8)" = "$CANONICAL_SHA"
          test "$(git show "$CANONICAL_SHA:pubspec.yaml" | grep '^version:' | awk '{print $2}')" = '1.68.19+109'
          test -z "$(git diff --name-only "$CANONICAL_SHA" "$PRODUCT_SHA" -- assets/questions.json android/ || true)"
          for name in bright storm airship moon; do test -s "assets/word_hunt/gokyuzu_adalari/gameplay_bg_${name}.webp"; done
          test "$(find assets/word_hunt/gokyuzu_adalari -maxdepth 1 -name 'scene_level_*.webp' | wc -l)" -eq 0
          grep -q 'WordHuntGokyuzuGameplayBackgrounds.forLevel' lib/word_hunt/word_hunt_production_entry_screen.dart

      - name: Inject exact DRAFT content
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTENT_SHA"
          git show "$CONTENT_SHA:lib/word_hunt/word_hunt_gokyuzu_content.dart" > lib/word_hunt/word_hunt_gokyuzu_content.dart
          test "$(git hash-object lib/word_hunt/word_hunt_gokyuzu_content.dart)" = '4070a85e7fbac5fda0d3967815cea7c673322a61'

      - name: Create isolated R9 entrypoint and UI probe
        shell: bash
        run: |
          cat > lib/word_hunt/gokyuzu_r9_real_device_qa_main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'word_hunt_gokyuzu_content.dart';
          import 'word_hunt_production_entry_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            debugPrint('[GOKYUZU_R9_REAL_DEVICE_READY]');
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: WordHuntProductionEntryScreen(
                route: WordHuntGokyuzuContent.gokyuzuAdalari,
                infoCards: WordHuntGokyuzuContent.infoCards,
              ),
            ));
          }
          DART
          mkdir -p tool
          cat > tool/gokyuzu_r9_ui_probe.py <<'PY'
          import re, subprocess
          from pathlib import Path
          xml=Path('gokyuzu_r9_real_device/ROUTE_UI.xml').read_text(encoding='utf-8')
          for label in ['Geri','Bilgi','Pusula','Bilgi Kitabı']:
              m=re.search(rf'content-desc="{re.escape(label)}"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',xml)
              if not m: raise SystemExit(f'missing {label}')
              l,t,r,b=map(int,m.groups())
              if not (0<=l<r<=1080 and 0<=t<b<=1920): raise SystemExit(f'bad bounds {label}: {(l,t,r,b)}')
          m=re.search(r'content-desc="Bölüm 1"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',xml)
          if not m: raise SystemExit('Bölüm 1 missing')
          l,t,r,b=map(int,m.groups())
          subprocess.run(['adb','shell','input','tap',str((l+r)//2),str((t+b)//2)],check=True)
          PY

      - name: Isolate QA Android package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle.kts'); s=p.read_text()
          pat=r'(?m)^(\s*)debug \{\n\1\s+manifestPlaceholders\["admobAppId"\] = adMobTestAppId\n\1\}'
          rep='        debug {\n            applicationIdSuffix = ".gokyuzur9qa"\n            manifestPlaceholders["admobAppId"] = adMobTestAppId\n        }'
          s,n=re.subn(pat,rep,s,count=1)
          if n!=1: raise SystemExit('debug buildType anchor missing')
          p.write_text(s)
          g=Path('android/app/google-services.json'); x=g.read_text(); old='com.leventua.bilgirotasi'
          if old not in x: raise SystemExit('google-services package anchor missing')
          g.write_text(x.replace(old,'com.leventua.bilgirotasi.gokyuzur9qa'))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Analyze and regression
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          git checkout -- pubspec.lock 2>/dev/null || true
          dart format lib/word_hunt/gokyuzu_r9_real_device_qa_main.dart
          dart analyze lib/word_hunt/word_hunt_gokyuzu_gameplay_backgrounds.dart
          dart analyze lib/word_hunt/word_hunt_production_entry_screen.dart
          dart analyze lib/word_hunt/word_hunt_gokyuzu_content.dart
          dart analyze lib/word_hunt/gokyuzu_r9_real_device_qa_main.dart
          flutter test test/word_hunt_gokyuzu_master_art_screen_test.dart test/word_hunt_gokyuzu_device_regression_test.dart test/word_hunt_progress_test.dart test/word_hunt_pixel_proof_screen_test.dart test/word_hunt_reference_route_screen_test.dart test/word_hunt_production_flow_test.dart --reporter expanded

      - name: Build R9 APK and verify packaged assets
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug -t lib/word_hunt/gokyuzu_r9_real_device_qa_main.dart --dart-define=ADMOB_ENVIRONMENT=test
          src='build/app/outputs/flutter-apk/app-debug.apk'; test -s "$src"
          mkdir -p gokyuzu_r9_real_device
          cp "$src" gokyuzu_r9_real_device/BilgiRotasi-Gokyuzu-R9-RealDevice-Test.apk
          for name in bright storm airship moon; do
            unzip -p "$src" "assets/flutter_assets/assets/word_hunt/gokyuzu_adalari/gameplay_bg_${name}.webp" > "gokyuzu_r9_real_device/gameplay_bg_${name}.packaged.webp"
            cmp -s "assets/word_hunt/gokyuzu_adalari/gameplay_bg_${name}.webp" "gokyuzu_r9_real_device/gameplay_bg_${name}.packaged.webp"
          done
          sha256sum gokyuzu_r9_real_device/BilgiRotasi-Gokyuzu-R9-RealDevice-Test.apk | tee gokyuzu_r9_real_device/APK_SHA256.txt
          printf '%s\n' "$PRODUCT_SHA" > gokyuzu_r9_real_device/PRODUCT_SHA.txt
          printf '%s\n' "$CONTENT_SHA" > gokyuzu_r9_real_device/CONTENT_SHA.txt
          printf '%s\n' "$QA_PACKAGE" > gokyuzu_r9_real_device/QA_PACKAGE.txt

      - name: Prepare Android 16 KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Android16 route and gameplay runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 1080x1920
            adb install -r gokyuzu_r9_real_device/BilgiRotasi-Gokyuzu-R9-RealDevice-Test.apk
            adb logcat -c
            adb shell am force-stop "$QA_PACKAGE"
            adb shell monkey -p "$QA_PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 10
            adb shell uiautomator dump /sdcard/route.xml >/dev/null
            adb pull /sdcard/route.xml gokyuzu_r9_real_device/ROUTE_UI.xml >/dev/null
            adb exec-out screencap -p > gokyuzu_r9_real_device/ROUTE_ANDROID16_RAW.png
            grep -q 'Bölüm 1' gokyuzu_r9_real_device/ROUTE_UI.xml
            grep -q 'Pusula' gokyuzu_r9_real_device/ROUTE_UI.xml
            grep -q 'Bilgi Kitabı' gokyuzu_r9_real_device/ROUTE_UI.xml
            python3 tool/gokyuzu_r9_ui_probe.py
            sleep 4
            adb shell uiautomator dump /sdcard/game.xml >/dev/null
            adb pull /sdcard/game.xml gokyuzu_r9_real_device/GAMEPLAY_UI.xml >/dev/null
            adb exec-out screencap -p > gokyuzu_r9_real_device/GAMEPLAY_ANDROID16_RAW.png
            adb shell dumpsys activity activities > gokyuzu_r9_real_device/GAMEPLAY_ACTIVITY.txt
            adb logcat -d > gokyuzu_r9_real_device/LOGCAT.txt
            grep -q 'GOKYUZU_R9_REAL_DEVICE_READY' gokyuzu_r9_real_device/LOGCAT.txt
            grep -q 'Gökyüzü Adaları' gokyuzu_r9_real_device/GAMEPLAY_UI.xml
            ! grep -q 'Başlangıç Limanı' gokyuzu_r9_real_device/GAMEPLAY_UI.xml
            grep -Eq "mResumedActivity.*${QA_PACKAGE}|topResumedActivity=.*${QA_PACKAGE}|mCurrentFocus=.*${QA_PACKAGE}" gokyuzu_r9_real_device/GAMEPLAY_ACTIVITY.txt
            ! grep -Eq "FATAL EXCEPTION|ANR in ${QA_PACKAGE}|am_crash.*${QA_PACKAGE}|am_proc_died.*${QA_PACKAGE}|A RenderFlex overflowed|FlutterError" gokyuzu_r9_real_device/LOGCAT.txt
            sha256sum gokyuzu_r9_real_device/ROUTE_ANDROID16_RAW.png > gokyuzu_r9_real_device/ROUTE_SCREENSHOT_SHA256.txt
            sha256sum gokyuzu_r9_real_device/GAMEPLAY_ANDROID16_RAW.png > gokyuzu_r9_real_device/GAMEPLAY_SCREENSHOT_SHA256.txt

      - name: Upload R9 acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-Gokyuzu-R9-RealDevice-Test
          path: gokyuzu_r9_real_device/
          if-no-files-found: error
          retention-days: 14
