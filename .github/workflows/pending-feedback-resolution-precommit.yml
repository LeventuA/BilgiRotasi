name: Pending question feedback resolution precommit

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pending-feedback-resolution-20260821
  cancel-in-progress: false

jobs:
  resolve-and-test:
    if: github.event.pull_request.head.ref == 'fix/all-pending-question-feedback-20260821'
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out exact work branch
        uses: actions/checkout@v4
        with:
          ref: fix/all-pending-question-feedback-20260821
          fetch-depth: 0

      - name: Lock approval marker, release base and source version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'Target version after PASS: 1.68.18+108' \
            reports/PENDING_FEEDBACK_RESOLUTION_ARMED.txt
          git fetch origin release/final-closed-test-aab-1.68.8
          EXPECTED_BASE='9331802b9a2b12d1f4ec6715da96dc7d0f60b24b'
          RELEASE_HEAD="$(git rev-parse origin/release/final-closed-test-aab-1.68.8)"
          MERGE_BASE="$(git merge-base HEAD origin/release/final-closed-test-aab-1.68.8)"
          test "$RELEASE_HEAD" = "$EXPECTED_BASE"
          test "$MERGE_BASE" = "$EXPECTED_BASE"
          grep -qx 'version: 1.68.17+107' pubspec.yaml
          test -z "$(git diff --name-only origin/release/final-closed-test-aab-1.68.8...HEAD -- assets/questions.json lib/app_build_info.dart pubspec.yaml)"
          echo 'APPROVAL_MARKER_GATE=PASS'
          echo 'BASE_GATE=PASS'
          echo 'SOURCE_VERSION_GATE=PASS'

      - name: Apply fail-closed feedback resolution in workspace
        run: python3 tools/apply_pending_question_feedback_20260821.py

      - name: Validate question bank and exact resolution scope
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_questions.py
          python3 tools/rc1_quality_gate.py --report reports/RC1_QUALITY_GATE_PENDING_FEEDBACK.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('reports/pending_question_feedback_resolution_manifest_20260821.json').read_text(encoding='utf-8'))
          report = Path('reports/pending_question_feedback_resolution_20260821.md').read_text(encoding='utf-8')
          assert manifest['counts'] == {
              'contentFixes': 53,
              'difficultyFixes': 27,
              'categoryFixes': 1,
              'noChange': 41,
              'uniqueQuestions': 122,
              'sheetEvents': 128,
          }
          assert 'Hedef sürüm: `1.68.18+108`' in report
          assert 'İçerik/şık düzeltmesi: **53**' in report
          assert 'Zorluk düzeltmesi: **27**' in report
          assert 'Kategori düzeltmesi: **1**' in report
          assert 'Değişiklik gerektirmeyen: **41**' in report
          print('RESOLUTION_REPORT_GATE=PASS')
          PY
          read ADDED DELETED _ < <(git diff --numstat -- assets/questions.json)
          TOTAL=$((ADDED + DELETED))
          echo "QUESTION_DIFF_LINES=$TOTAL"
          test "$TOTAL" -gt 0
          test "$TOTAL" -lt 2000
          ACTUAL_SCOPE="$(git status --porcelain=v1 | cut -c4- | sort | tr '\n' ' ')"
          echo "ACTUAL_SCOPE=$ACTUAL_SCOPE"
          test "$ACTUAL_SCOPE" = \
            'assets/questions.json lib/app_build_info.dart pubspec.yaml reports/RC1_QUALITY_GATE_PENDING_FEEDBACK.md reports/pending_question_feedback_resolution_20260821.md '
          git diff --check
          echo 'DIFF_SCOPE_GATE=PASS'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Analyze and run complete Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --concurrency=1 --reporter expanded
          git diff --check

      - name: Remove temporary execution-only tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pending-feedback-live-audit.yml \
            .github/workflows/pending-feedback-resolution-precommit.yml \
            tools/audit_pending_question_feedback_20260821.py \
            tools/apply_pending_question_feedback_20260821.py \
            reports/PENDING_FEEDBACK_RESOLUTION_ARMED.txt
          git diff --check

      - name: Commit tested product resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            assets/questions.json \
            lib/app_build_info.dart \
            pubspec.yaml \
            reports/RC1_QUALITY_GATE_PENDING_FEEDBACK.md \
            reports/pending_question_feedback_resolution_20260821.md \
            .github/workflows/pending-feedback-live-audit.yml \
            .github/workflows/pending-feedback-resolution-precommit.yml \
            tools/audit_pending_question_feedback_20260821.py \
            tools/apply_pending_question_feedback_20260821.py \
            reports/PENDING_FEEDBACK_RESOLUTION_ARMED.txt
          git diff --cached --check
          git commit -m 'fix: resolve all pending question feedback'
          git push origin HEAD:fix/all-pending-question-feedback-20260821
