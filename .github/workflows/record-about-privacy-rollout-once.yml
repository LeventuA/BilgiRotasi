name: Record about privacy rollout once

on:
  push:
    branches:
      - docs/record-about-privacy-rollout-20260813

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/record-about-privacy-rollout-20260813
          fetch-depth: 0

      - name: Insert verified project-memory sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          status_path = Path('docs/project-memory/BILGI_ROTASI_DURUM.md')
          task_path = Path('docs/project-memory/GOREV_HAVUZU.md')
          status_payload = Path('docs/project-memory/.about-privacy-status-section.tmp').read_text(encoding='utf-8')
          task_payload = Path('docs/project-memory/.about-privacy-task-section.tmp').read_text(encoding='utf-8')
          status = status_path.read_text(encoding='utf-8')
          status_marker = '## 0C. Hakkında & Gizlilik / herkese açık destek iletişimi — 13 Ağustos 2026'
          if status_marker not in status:
              anchor = '## 0B. BR-P1-008 final artifact kabulü — 13 Ağustos 2026'
              if anchor not in status:
                  raise SystemExit('BILGI_ROTASI_DURUM anchor bulunamadı')
              status_path.write_text(status.replace(anchor, status_payload + anchor, 1), encoding='utf-8')
          tasks = task_path.read_text(encoding='utf-8')
          task_marker = '### BR-P1-013 - Hakkında & Gizlilik bağlantıları ve public destek iletişimini düzelt'
          if task_marker not in tasks:
              anchor = '## P2 - Görsel ve pazarlama'
              if anchor not in tasks:
                  raise SystemExit('GOREV_HAVUZU anchor bulunamadı')
              task_path.write_text(tasks.replace(anchor, task_payload + anchor, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/project-memory/BILGI_ROTASI_DURUM.md docs/project-memory/GOREV_HAVUZU.md

      - name: Commit project memory and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZMilaStudio'
          git config user.email 'levent.ua@gmail.com'
          git rm .github/workflows/record-about-privacy-rollout-once.yml
          git rm docs/project-memory/.about-privacy-status-section.tmp
          git rm docs/project-memory/.about-privacy-task-section.tmp
          git add docs/project-memory/BILGI_ROTASI_DURUM.md docs/project-memory/GOREV_HAVUZU.md
          git diff --cached --check
          git commit -m 'docs: record about privacy rollout'
          git push origin HEAD:docs/record-about-privacy-rollout-20260813
