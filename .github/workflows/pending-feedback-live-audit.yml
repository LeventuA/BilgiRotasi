name: Pending question feedback live audit

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8

permissions:
  contents: write
  pull-requests: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'fix/all-pending-question-feedback-20260821'
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact work branch
        uses: actions/checkout@v4
        with:
          ref: fix/all-pending-question-feedback-20260821
          fetch-depth: 0

      - name: Verify canonical release base and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/final-closed-test-aab-1.68.8
          EXPECTED_BASE='9331802b9a2b12d1f4ec6715da96dc7d0f60b24b'
          ACTUAL_BASE="$(git merge-base HEAD origin/release/final-closed-test-aab-1.68.8)"
          test "$ACTUAL_BASE" = "$EXPECTED_BASE"
          grep -qx 'version: 1.68.17+107' pubspec.yaml
          echo "BASE_GATE=PASS"
          echo "VERSION_GATE=PASS"

      - name: Export all pending-feedback question records
        run: python3 tools/audit_pending_question_feedback_20260821.py

      - name: Validate audit output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/pending_question_feedback_live_audit_20260821.json').read_text(encoding='utf-8'))
          assert report['targetCount'] == 122, report['targetCount']
          assert len(report['targets']) == 122, len(report['targets'])
          assert len({item['id'] for item in report['targets']}) == 122
          print('AUDIT_TARGET_GATE=PASS')
          PY
          git diff --exit-code -- assets/questions.json

      - name: Upload immutable audit report
        uses: actions/upload-artifact@v4
        with:
          name: pending-question-feedback-live-audit-20260821
          path: reports/pending_question_feedback_live_audit_20260821.json
          if-no-files-found: error

      - name: Commit immutable audit report to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/pending_question_feedback_live_audit_20260821.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record pending feedback live audit'
          git push origin HEAD:fix/all-pending-question-feedback-20260821
