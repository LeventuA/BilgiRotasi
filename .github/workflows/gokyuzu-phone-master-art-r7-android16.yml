name: Gokyuzu Phone Master Art R7 Android16

on:
  push:
    branches:
      - qa/gokyuzu-phone-master-art-r7-android16-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android16-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PRODUCT_SHA: f35082c44e637cb7e6e3815c7d54d38a58b776df
      PRODUCT_PARENT_SHA: 560d76bd828e0b4d813218f1000b895da9d0c7fa
      CANONICAL_SHA: 3557a7e4f2f2917d61ba61866c6d4c8561994667
      CONTENT_SHA: 4ec33de7438fcbd15ed63b1ae2adda127da3be8c
      MASTER_ART_SHA256: 913ee19df9fcb1eba2ac6ca3a500979c960d31dd369e204d2f79064be9664b1d
      MASTER_ART_SIZE: '510998'
      QA_WORKFLOW: .github/workflows/gokyuzu-phone-master-art-r7-android16.yml

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact product chain and protected scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          test "$(git rev-parse "$PRODUCT_SHA^")" = "$PRODUCT_PARENT_SHA"
          test "$(git rev-parse origin/release/final-closed-test-aab-1.68.8)" = "$CANONICAL_SHA"
          test "$(grep '^version:' pubspec.yaml | awk '{print $2}')" = '1.68.19+109'
          test -z "$(git diff --name-only "$CANONICAL_SHA" "$PRODUCT_SHA" -- assets/questions.json android/ pubspec.yaml || true)"
          mapfile -t qa_paths < <(git diff --name-only "$PRODUCT_SHA" HEAD)
          test "${#qa_paths[@]}" -eq 1
          test "${qa_paths[0]}" = "$QA_WORKFLOW"
          test "$(wc -c < assets/word_hunt/gokyuzu_adalari_master_art_v2.webp)" = "$MASTER_ART_SIZE"
          test "$(sha256sum assets/word_hunt/gokyuzu_adalari_master_art_v2.webp | cut -d' ' -f1)" = "$MASTER_ART_SHA256"

      - name: Inject exact DRAFT content only into QA workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTENT_SHA"
          git show "$CONTENT_SHA:lib/word_hunt/word_hunt_gokyuzu_content.dart" > lib/word_hunt/word_hunt_gokyuzu_content.dart
          test "$(git hash-object lib/word_hunt/word_hunt_gokyuzu_content.dart)" = '4070a85e7fbac5fda0d3967815cea7c673322a61'

      - name: Create isolated QA entrypoint
        shell: bash
        run: |
          cat > lib/word_hunt/gokyuzu_phone_master_art_r7_qa_main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'word_hunt_gokyuzu_content.dart';
          import 'word_hunt_production_entry_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            debugPrint('[GOKYUZU_PHONE_MASTER_ART_R7_READY]');
            runApp(
              const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: WordHuntProductionEntryScreen(
                  route: WordHuntGokyuzuContent.gokyuzuAdalari,
                  infoCards: WordHuntGokyuzuContent.infoCards,
                ),
              ),
            );
          }
          DART

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Analyze and focused regression
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          git checkout -- pubspec.lock 2>/dev/null || true
          dart format lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart lib/word_hunt/gokyuzu_phone_master_art_r7_qa_main.dart
          git diff --check
          dart analyze lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart lib/word_hunt/word_hunt_production_entry_screen.dart lib/word_hunt/word_hunt_progress.dart lib/word_hunt/word_hunt_gokyuzu_content.dart lib/word_hunt/gokyuzu_phone_master_art_r7_qa_main.dart
          flutter test test/word_hunt_gokyuzu_master_art_screen_test.dart test/word_hunt_progress_test.dart test/word_hunt_pixel_proof_screen_test.dart test/word_hunt_reference_route_screen_test.dart test/word_hunt_production_flow_test.dart --reporter expanded

      - name: Build isolated debug APK and verify packaged MASTER ART
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug -t lib/word_hunt/gokyuzu_phone_master_art_r7_qa_main.dart --dart-define=ADMOB_ENVIRONMENT=test
          apk='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$apk"
          mkdir -p gokyuzu_r7_reports
          unzip -p "$apk" assets/flutter_assets/assets/word_hunt/gokyuzu_adalari_master_art_v2.webp > gokyuzu_r7_reports/gokyuzu_adalari_master_art_v2.packaged.webp
          cmp -s assets/word_hunt/gokyuzu_adalari_master_art_v2.webp gokyuzu_r7_reports/gokyuzu_adalari_master_art_v2.packaged.webp
          sha256sum "$apk" | tee gokyuzu_r7_reports/APK_SHA256.txt
          printf '%s\n' "$PRODUCT_SHA" > gokyuzu_r7_reports/PRODUCT_SHA.txt
          printf '%s\n' "$CONTENT_SHA" > gokyuzu_r7_reports/CONTENT_SHA.txt
          printf '%s\n' "$MASTER_ART_SHA256" > gokyuzu_r7_reports/MASTER_ART_SHA256.txt

      - name: Prepare Android 16 KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Capture raw Android 16 R7 proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            mkdir -p gokyuzu_r7_reports
            adb shell wm size 1080x1920
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.leventua.bilgirotasi
            adb shell monkey -p com.leventua.bilgirotasi -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 10
            adb shell dumpsys activity activities > gokyuzu_r7_reports/ACTIVITY.txt
            adb shell uiautomator dump /sdcard/gokyuzu_ui.xml >/dev/null
            adb pull /sdcard/gokyuzu_ui.xml gokyuzu_r7_reports/UI.xml >/dev/null
            adb exec-out screencap -p > gokyuzu_r7_reports/GOKYUZU_PHONE_MASTER_ART_R7_ANDROID16_RAW.png
            adb logcat -d > gokyuzu_r7_reports/LOGCAT.txt
            test -s gokyuzu_r7_reports/GOKYUZU_PHONE_MASTER_ART_R7_ANDROID16_RAW.png
            grep -q 'GOKYUZU_PHONE_MASTER_ART_R7_READY' gokyuzu_r7_reports/LOGCAT.txt
            grep -Eq 'mResumedActivity.*com\.leventua\.bilgirotasi|topResumedActivity=.*com\.leventua\.bilgirotasi|mCurrentFocus=.*com\.leventua\.bilgirotasi' gokyuzu_r7_reports/ACTIVITY.txt
            grep -q 'Bölüm 1' gokyuzu_r7_reports/UI.xml
            grep -q 'Pusula' gokyuzu_r7_reports/UI.xml
            grep -q 'Bilgi Kitabı' gokyuzu_r7_reports/UI.xml
            ! grep -Eq 'FATAL EXCEPTION|ANR in com\.leventua\.bilgirotasi|am_crash.*com\.leventua\.bilgirotasi|am_proc_died.*com\.leventua\.bilgirotasi|A RenderFlex overflowed|FlutterError' gokyuzu_r7_reports/LOGCAT.txt
            python3 -c "import struct; p='gokyuzu_r7_reports/GOKYUZU_PHONE_MASTER_ART_R7_ANDROID16_RAW.png'; b=open(p,'rb').read(24); assert b[:8] == b'\x89PNG\r\n\x1a\n'; w,h=struct.unpack('>II',b[16:24]); print('RAW_SCREENSHOT=%dx%d' % (w,h)); assert (w,h)==(1080,1920)"
            sha256sum gokyuzu_r7_reports/GOKYUZU_PHONE_MASTER_ART_R7_ANDROID16_RAW.png | tee gokyuzu_r7_reports/SCREENSHOT_SHA256.txt

      - name: Upload exact Android16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gokyuzu-Phone-MasterArt-R7-Android16
          path: gokyuzu_r7_reports/
          if-no-files-found: warn
          retention-days: 14
