name: Kelime Avi V6 human timing QA APK

on:
  workflow_dispatch:
  push:
    branches:
      - qa/kelime-avi-v6-human-timing-apk-20260901
    paths:
      - .github/workflows/word-hunt-v6-human-playtest-apk.yml
      - tools/word_hunt_v6_human_playtest_main.dart

permissions:
  contents: read

jobs:
  build-and-runtime:
    name: B5 B10 human playtest side-by-side APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TARGET_PRODUCT_SHA: 4ddeff9e1f76167037756c430f6b61d6c0dd284c
      TARGET_SCREEN_BLOB: fd4f830adf6d3c6c7ea6b4eaf2777fb7cedda9d1
      QA_PACKAGE: com.leventua.bilgirotasi.wordhuntqa
      REPORT_DIR: reports/word_hunt_v6_human_timing

    steps:
      - name: Checkout QA commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Verify accepted V6 and run static gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          git merge-base --is-ancestor "$TARGET_PRODUCT_SHA" HEAD
          test "$(git hash-object lib/word_hunt/word_hunt_screens.dart)" = "$TARGET_SCREEN_BLOB"
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          test -z "$(git diff --name-only "$TARGET_PRODUCT_SHA"...HEAD -- lib assets android pubspec.yaml)"
          flutter pub get
          dart format --output=none --set-exit-if-changed tools/word_hunt_v6_human_playtest_main.dart
          dart analyze lib/word_hunt tools/word_hunt_v6_human_playtest_main.dart
          flutter test test/word_hunt_*_test.dart --reporter expanded 2>&1 | tee "$REPORT_DIR/STATIC_TESTS.txt"
          git diff --check
          printf '%s\n' \
            "TARGET_PRODUCT_SHA=$TARGET_PRODUCT_SHA" \
            "TARGET_SCREEN_BLOB=$TARGET_SCREEN_BLOB" \
            "VERSION=1.68.19+109" \
            "PRODUCT_SCOPE_UNCHANGED=PASS" \
            "STATIC_GATES=PASS" \
            | tee "$REPORT_DIR/STATIC_GATE_SUMMARY.txt"

      - name: Build distinct-package playtest APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build.gradle.kts /tmp/build.gradle.kts.original
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.original
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          plugin = '    id("com.google.gms.google-services")\n'
          if text.count(plugin) != 1:
              raise SystemExit('google-services plugin count mismatch')
          text = text.replace(plugin, '')
          old_id = '        applicationId = "com.leventua.bilgirotasi"'
          new_id = '        applicationId = "com.leventua.bilgirotasi.wordhuntqa"'
          if text.count(old_id) != 1:
              raise SystemExit('applicationId count mismatch')
          gradle.write_text(text.replace(old_id, new_id), encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          mtext = manifest.read_text(encoding='utf-8')
          old_label = 'android:label="Bilgi Rotası"'
          new_label = 'android:label="Kelime Avı V6 QA"'
          if mtext.count(old_label) != 1:
              raise SystemExit('application label count mismatch')
          manifest.write_text(mtext.replace(old_label, new_label), encoding='utf-8')
          PY
          flutter build apk --debug -t tools/word_hunt_v6_human_playtest_main.dart --dart-define=ADMOB_ENVIRONMENT=test
          mkdir -p "$REPORT_DIR"
          cp build/app/outputs/flutter-apk/app-debug.apk "$REPORT_DIR/KelimeAvi-V6-B5-B10-Playtest.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt" dump badging "$REPORT_DIR/KelimeAvi-V6-B5-B10-Playtest.apk" | tee "$REPORT_DIR/APK_BADGING.txt"
          grep -q "package: name='$QA_PACKAGE'" "$REPORT_DIR/APK_BADGING.txt"
          grep -q "application-label:'Kelime Avı V6 QA'" "$REPORT_DIR/APK_BADGING.txt"
          sha256sum "$REPORT_DIR/KelimeAvi-V6-B5-B10-Playtest.apk" | tee "$REPORT_DIR/APK_SHA256.txt"
          cp /tmp/build.gradle.kts.original android/app/build.gradle.kts
          cp /tmp/AndroidManifest.xml.original android/app/src/main/AndroidManifest.xml
          test -z "$(git status --porcelain -- android)"
          printf '%s\n' \
            "SIDE_BY_SIDE_APPLICATION_ID=$QA_PACKAGE" \
            "PRODUCTION_APPLICATION_ID=com.leventua.bilgirotasi" \
            "APPLICATION_ID_DISTINCT=PASS" \
            "APK_BUILD=PASS" \
            | tee "$REPORT_DIR/APK_GATE_SUMMARY.txt"
          (cd android && ./gradlew --stop)

      - name: Prepare Android emulator KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Android 16 install launch and render gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            APK="$REPORT_DIR/KelimeAvi-V6-B5-B10-Playtest.apk"
            adb install -r "$APK"
            adb shell pm path "$QA_PACKAGE" | tee "$REPORT_DIR/ANDROID_PACKAGE_PATH.txt"
            adb logcat -c
            adb shell monkey -p "$QA_PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
            for i in $(seq 1 40); do
              if adb logcat -d | grep -Fq '[WORD_HUNT_V6_HUMAN_QA_SELECTOR_READY]'; then break; fi
              sleep 1
            done
            adb logcat -d > "$REPORT_DIR/01_SELECTOR_LOGCAT.txt"
            grep -Fq '[WORD_HUNT_V6_HUMAN_QA_SELECTOR_GEOMETRY] buttons=2' "$REPORT_DIR/01_SELECTOR_LOGCAT.txt"
            b5_line="$(grep -F '[WORD_HUNT_V6_HUMAN_QA_BUTTON] level=5 ' "$REPORT_DIR/01_SELECTOR_LOGCAT.txt" | tail -1)"
            b5_x="$(printf '%s\n' "$b5_line" | sed -E 's/.* x=([0-9]+) y=.*/\1/')"
            b5_y="$(printf '%s\n' "$b5_line" | sed -E 's/.* y=([0-9]+).*/\1/')"
            adb shell input tap "$b5_x" "$b5_y"
            for i in $(seq 1 40); do
              if adb logcat -d | grep -Fq '[WORD_HUNT_V6_HUMAN_QA_READY] level=5 cells=64'; then break; fi
              sleep 1
            done
            adb logcat -d > "$REPORT_DIR/02_B5_LOGCAT.txt"
            grep -Fq '[WORD_HUNT_V6_HUMAN_QA_OPEN] level=5 targetSeconds=60' "$REPORT_DIR/02_B5_LOGCAT.txt"
            grep -Fq '[WORD_HUNT_V6_HUMAN_QA_READY] level=5 cells=64' "$REPORT_DIR/02_B5_LOGCAT.txt"
            adb exec-out screencap -p > "$REPORT_DIR/02_B5_INITIAL.png"

            adb shell am force-stop "$QA_PACKAGE"
            adb logcat -c
            adb shell monkey -p "$QA_PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
            for i in $(seq 1 40); do
              if adb logcat -d | grep -Fq '[WORD_HUNT_V6_HUMAN_QA_SELECTOR_READY]'; then break; fi
              sleep 1
            done
            adb logcat -d > "$REPORT_DIR/03_SELECTOR_LOGCAT.txt"
            b10_line="$(grep -F '[WORD_HUNT_V6_HUMAN_QA_BUTTON] level=10 ' "$REPORT_DIR/03_SELECTOR_LOGCAT.txt" | tail -1)"
            b10_x="$(printf '%s\n' "$b10_line" | sed -E 's/.* x=([0-9]+) y=.*/\1/')"
            b10_y="$(printf '%s\n' "$b10_line" | sed -E 's/.* y=([0-9]+).*/\1/')"
            adb shell input tap "$b10_x" "$b10_y"
            for i in $(seq 1 40); do
              if adb logcat -d | grep -Fq '[WORD_HUNT_V6_HUMAN_QA_READY] level=10 cells=64'; then break; fi
              sleep 1
            done
            adb logcat -d > "$REPORT_DIR/04_B10_LOGCAT.txt"
            grep -Fq '[WORD_HUNT_V6_HUMAN_QA_OPEN] level=10 targetSeconds=120' "$REPORT_DIR/04_B10_LOGCAT.txt"
            grep -Fq '[WORD_HUNT_V6_HUMAN_QA_READY] level=10 cells=64' "$REPORT_DIR/04_B10_LOGCAT.txt"
            adb exec-out screencap -p > "$REPORT_DIR/04_B10_INITIAL.png"
            adb shell wm size | tee "$REPORT_DIR/ANDROID_WM_SIZE.txt"
            adb shell wm density | tee "$REPORT_DIR/ANDROID_WM_DENSITY.txt"
            cat "$REPORT_DIR/01_SELECTOR_LOGCAT.txt" "$REPORT_DIR/02_B5_LOGCAT.txt" "$REPORT_DIR/03_SELECTOR_LOGCAT.txt" "$REPORT_DIR/04_B10_LOGCAT.txt" > "$REPORT_DIR/ANDROID_COMBINED_LOGCAT.txt"
            if grep -E "FATAL EXCEPTION|ANR in ${QA_PACKAGE}|am_crash.*${QA_PACKAGE}|Process: ${QA_PACKAGE}" "$REPORT_DIR/ANDROID_COMBINED_LOGCAT.txt"; then exit 1; fi
            printf '%s\n' \
              'ANDROID_API=36' \
              "QA_PACKAGE=$QA_PACKAGE" \
              'APK_INSTALL=PASS' \
              'APP_LAUNCH=PASS' \
              'B5_64_CELL_RENDER=PASS' \
              'B10_64_CELL_RENDER=PASS' \
              'B5_TARGET_SECONDS=60' \
              'B10_TARGET_SECONDS=120' \
              'PROCESS_FAILURE_SCAN=PASS' \
              'HUMAN_TIMING_RESULT=PENDING_USER_PLAYTEST' \
              | tee "$REPORT_DIR/ANDROID_RUNTIME_SUMMARY.txt"

      - name: Upload human playtest APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Avi-V6-B5-B10-Human-Playtest
          path: reports/word_hunt_v6_human_timing
          if-no-files-found: warn
          retention-days: 7
