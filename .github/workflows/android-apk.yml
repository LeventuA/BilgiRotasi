name: RC1 kalite kapısı ve APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Kalite + APK
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: RC1 soru ve asset kalite kapısı
        run: |
          python3 tools/rc1_quality_gate.py \
            --report reports/RC1_AUTOMATED_REPORT.md

      - name: Yeni RC1 dosyalarını biçimlendir
        run: |
          dart format \
            lib/app_build_info.dart \
            test/rc1_quality_gate_test.dart

      - name: Flutter statik analiz
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter testleri
        run: flutter test

      - name: Temiz Android projesi oluştur
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .flutter_build

          flutter create \
            --platforms=android \
            --org com.leventua \
            --project-name bilgirotasi \
            .flutter_build

          rm -rf .flutter_build/lib
          cp -R lib .flutter_build/lib

          rm -rf .flutter_build/assets
          cp -R assets .flutter_build/assets

          cp pubspec.yaml .flutter_build/pubspec.yaml

          if [ -f pubspec.lock ]; then
            cp pubspec.lock .flutter_build/pubspec.lock
          fi

          if [ -f analysis_options.yaml ]; then
            cp analysis_options.yaml \
              .flutter_build/analysis_options.yaml
          fi

          test -f .flutter_build/lib/main.dart
          test -f .flutter_build/lib/app_build_info.dart
          test -f .flutter_build/assets/questions.json
          test -f .flutter_build/assets/sounds/correct.mp3

      - name: Android simge ve açılış ekranını hazırla
        working-directory: .flutter_build
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="Bilgi Rotası"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Android uygulama etiketi bulunamadı.")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Kalıcı Android imzasını hazırla
        working-directory: .flutter_build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/bilgi_rotasi_upload.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bilgi_rotasi_upload.jks
          EOF

          chmod 600 \
            android/app/bilgi_rotasi_upload.jks \
            android/key.properties

          python3 - <<'PY'
          import re
          from pathlib import Path

          package_id = "com.leventua.bilgirotasi"
          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle.kts bulunamadı."
              )

          text = path.read_text(encoding="utf-8")

          imports = (
              "import java.io.FileInputStream\n"
              "import java.util.Properties\n\n"
          )
          if "import java.util.Properties" not in text:
              text = imports + text

          android_anchor = "\nandroid {\n"
          properties_block = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile =
              rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }
          """.strip() + "\n"

          if "val keystoreProperties = Properties()" not in text:
              if text.count(android_anchor) != 1:
                  raise SystemExit(
                      "Gradle android bloğu bulunamadı."
                  )
              text = text.replace(
                  android_anchor,
                  "\n" + properties_block + android_anchor,
                  1,
              )

          default_anchor = "    defaultConfig {\n"
          signing_block = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String
                      keyPassword =
                          keystoreProperties["keyPassword"] as String
                      storeFile =
                          keystoreProperties["storeFile"]
                              ?.let { file(it) }
                      storePassword =
                          keystoreProperties["storePassword"] as String
                  }
              }

          """.replace("          ", "", 1)

          if 'create("release")' not in text:
              if text.count(default_anchor) != 1:
                  raise SystemExit(
                      "Gradle defaultConfig bloğu bulunamadı."
                  )
              text = text.replace(
                  default_anchor,
                  signing_block + default_anchor,
                  1,
              )

          text, namespace_count = re.subn(
              r'namespace\s*=\s*"[^"]+"',
              f'namespace = "{package_id}"',
              text,
              count=1,
          )
          text, app_id_count = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              f'applicationId = "{package_id}"',
              text,
              count=1,
          )

          if namespace_count != 1 or app_id_count != 1:
              raise SystemExit(
                  "Paket kimliği Gradle dosyasına yazılamadı."
              )

          debug_line = (
              'signingConfig = '
              'signingConfigs.getByName("debug")'
          )
          release_line = (
              'signingConfig = '
              'signingConfigs.getByName("release")'
          )

          if release_line not in text:
              if text.count(debug_line) != 1:
                  raise SystemExit(
                      "Release imza satırı bulunamadı."
                  )
              text = text.replace(
                  debug_line,
                  release_line,
                  1,
              )

          required = [
              f'namespace = "{package_id}"',
              f'applicationId = "{package_id}"',
              'create("release")',
              release_line,
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(
                  "Gradle imza kurulumu eksik: "
                  + ", ".join(missing)
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Release APK oluştur
        working-directory: .flutter_build
        run: flutter build apk --release

      - name: Paket kimliğini ve kalıcı imzayı doğrula
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          SOURCE_APK=".flutter_build/build/app/outputs/flutter-apk/app-release.apk"
          APK="dist/BilgiRotasi-1.46.0-60-signed.apk"
          test -f "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK"

          sha256sum "$APK" | tee reports/RC1_APK_SHA256.txt

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools"               -type f               -name apksigner               | sort -V               | tail -n 1
          )"
          test -n "$APKSIGNER"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"

          ACTUAL_SHA1="$(
            printf '%s\n' "$CERT_OUTPUT"               | awk -F': '                 '/certificate SHA-1 digest/ {print $2; exit}'               | tr '[:lower:]' '[:upper:]'               | tr -d '[:space:]:'
          )"
          EXPECTED_SHA1="000EE43F410ABC6B4F634C4F716D76EB19084115"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "İmza SHA-1 uyuşmuyor."
            echo "Beklenen: $EXPECTED_SHA1"
            echo "Bulunan : $ACTUAL_SHA1"
            exit 1
          fi

          grep -Fq             'applicationId = "com.leventua.bilgirotasi"'             .flutter_build/android/app/build.gradle.kts

          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -n "$APKANALYZER" ]; then
            ACTUAL_PACKAGE="$(
              "$APKANALYZER" manifest application-id "$APK"
            )"
            test "$ACTUAL_PACKAGE" = "com.leventua.bilgirotasi"
          fi

          {
            echo "# Bilgi Rotası RC1 Yapı Bilgisi"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Sürüm: 1.46.0+60"
            echo "- Kanal: RC1"
            echo "- Paket adı: com.leventua.bilgirotasi"
            echo "- Sertifika SHA-1: 00:0E:E4:3F:41:0A:BC:6B:4F:63:4C:4F:71:6D:76:EB:19:08:41:15"
            echo "- İmza: Kalıcı upload anahtarı"
            echo "- Workflow: ${GITHUB_RUN_ID}"
          } > reports/RC1_BUILD_INFO.md

      - name: RC1 APK ve raporları yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-Signed-RC1-1.46.0-60
          path: |
            dist/BilgiRotasi-1.46.0-60-signed.apk
            reports/RC1_AUTOMATED_REPORT.md
            reports/RC1_APK_SHA256.txt
            reports/RC1_BUILD_INFO.md
            reports/RC1_MANUAL_TEST_CHECKLIST.md
            release/RELEASE_IDENTITY.md
            release/SIGNED_BUILD_PIPELINE.md
          if-no-files-found: error
          retention-days: 30
