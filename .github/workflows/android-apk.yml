name: RC2 kalite kapısı, APK ve AAB

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Kapalı test build'i için CLOSED_TEST yazın
        required: true
        type: string
  push:
    branches:
      - release/final-closed-test-aab-1.68.8
    paths:
      - .github/closed-test-trigger-1.68.14

permissions:
  contents: read

jobs:
  closed-test-release:
    uses: ./.github/workflows/closed-test-release-core.yml
    with:
      confirmation: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'CLOSED_TEST' }}
    secrets: inherit
