name: Kelime Avi asset-first QA gate

on:
  pull_request:
    branches:
      - feat/kelime-avi-baslangic-limani-asset-first-20260824
    paths:
      - 'assets/word_hunt/baslangic_limani/**'
      - 'lib/word_hunt/**'
      - 'test/word_hunt_*.dart'
      - 'test/home_hub_prototype_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/kelime-avi-asset-first-qa.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact QA head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Rebuild final medallion with transparency preserved
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y webp imagemagick

          base='assets/word_hunt/baslangic_limani/node_normal.webp'
          final='assets/word_hunt/baslangic_limani/node_final.webp'

          dwebp "$base" -o /tmp/node_master.png
          convert /tmp/node_master.png \
            -modulate 112,155,58 \
            -resize 414x414 \
            -alpha on \
            -sharpen 0x1 \
            /tmp/node_final.png
          cwebp -quiet -lossless -z 9 /tmp/node_final.png -o "$final"

          webpinfo "$final" | tee /tmp/node_final_webpinfo.txt
          grep -q 'Width: 414' /tmp/node_final_webpinfo.txt
          grep -q 'Height: 414' /tmp/node_final_webpinfo.txt
          grep -q 'Alpha: 1' /tmp/node_final_webpinfo.txt
          dwebp "$final" -o /dev/null

      - name: Scope guard before test
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'assets/word_hunt/baslangic_limani/node_final.webp'
          git diff --check

      - name: Analyze candidate
        run: dart analyze lib/word_hunt

      - name: Focused Kelime Avi suite
        shell: bash
        run: |
          set -o pipefail
          flutter test \
            test/home_hub_prototype_test.dart \
            test/word_hunt_models_test.dart \
            test/word_hunt_path_test.dart \
            test/word_hunt_progress_codec_test.dart \
            test/word_hunt_progress_test.dart \
            test/word_hunt_production_assets_test.dart \
            test/word_hunt_route_stop_test.dart \
            test/word_hunt_reference_route_screen_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_route_map_v2_view_test.dart \
            test/word_hunt_route_map_view_test.dart \
            test/word_hunt_scoring_test.dart \
            test/word_hunt_starter_content_test.dart \
            --reporter expanded 2>&1 | tee /tmp/kelime-avi-focused.log

      - name: Persist focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kelime-avi-focused-log-${{ github.run_id }}
          path: /tmp/kelime-avi-focused.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit only after transparency and tests pass
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/word_hunt/baslangic_limani/node_final.webp
          git commit -m 'fix(kelime-avi): preserve final medallion transparency'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Exact committed head verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^
          dart analyze lib/word_hunt
          flutter test \
            test/word_hunt_production_assets_test.dart \
            test/word_hunt_route_stop_test.dart \
            test/word_hunt_reference_route_screen_test.dart \
            --reporter expanded

      - name: Push tested commit to QA branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${HEAD_BRANCH}"
          echo "TESTED_COMMIT=${{ steps.commit.outputs.sha }}"
