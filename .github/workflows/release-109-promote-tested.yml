name: Promote Release 109 project checkpoint

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push docs-only checkpoint to exact +109 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/1.68.19-109-admob-fix-20260821
          CURRENT="$(git rev-parse origin/release/1.68.19-109-admob-fix-20260821)"
          test "$CURRENT" = "1999a049018b5d23eeda59b0b9d2e0e435cf0a64"
          git checkout --detach "$CURRENT"
          python3 - <<'PY'
          from pathlib import Path

          def prepend(path_str, heading, body):
              p = Path(path_str)
              text = p.read_text()
              if heading in text:
                  return
              first = text.find('\n')
              if first < 0:
                  raise SystemExit(f'no title: {path_str}')
              block = heading + '\n\n' + body.strip() + '\n\n---\n\n'
              p.write_text(text[:first+1] + '\n' + block + text[first+1:].lstrip('\n'))

          prepend(
            'docs/project-memory/BILGI_ROTASI_DURUM.md',
            '## 0M. 1.68.19+109 birleşik soru + AdMob/UMP yayın adayı — 21 Ağustos 2026',
            r'''
- Kanonik taban `release/final-closed-test-aab-1.68.8` / `fea206036366c604a54159be3bbe39e22fe24a2d` / `1.68.18+108`.
- `+108`, PR #79 soru geri bildirimi sürümüdür: 128 olay / 122 benzersiz soru incelendi; 53 içerik/şık, 27 zorluk ve 1 kategori olmak üzere 81 gerçek soru düzeltmesi release'tedir.
- +109 adayı exact +108 tabanından türetildi; `assets/questions.json` değiştirilmedi ve +108 soru bankası aynen korunur.
- Fiziksel production tanısında UMP `CONSENT_INFO_UPDATE_FAILED` ortak reklam blokajı doğrulandı. Minimal düzeltme consent-info güncellemesi hata verirse UMP `canRequestAds()` ile cached consent'i kontrol eder; consent form/privacy-status hataları fail-closed kalır ve FormError code/message tanısı korunur.
- Fiziksel production kabul: banner PASS, rewarded PASS, AdMob Verify URL PASS ve kaydedildi, `rewardedSsvCallback` selective redeploy PASS, açık cutover onayıyla `server_config/rewarded.ssvEnabled=true` readback PASS, ardından reklam -> SSV claim -> +10 XP PASS.
- Test-before-commit run `32481091014`, job `96767404086`: focused AdMob/privacy **42/42 PASS**, tüm Flutter **301/301 PASS**, analyze non-fatal PASS, `git diff --check` PASS, soru bankası sıfır fark. Candidate artifact ID `9446124898`, digest `sha256:3c9e11123a9203ba1efce156044e72a3cab2a3b8f116f04ab08cb1d26df60c17`.
- Temiz ürün branch'i `release/1.68.19-109-admob-fix-20260821`; ürün commit `1999a049018b5d23eeda59b0b9d2e0e435cf0a64` — `fix: ship 1.68.19+109 with AdMob UMP recovery`; Draft PR #88.
- `KARARLAR.md` değişmedi; reklam sözleşmesi aynı: kullanıcı isteğiyle +10 XP, tamamlanan oyun başına en fazla bir ödül, aktif soru/canlı maç ekranında reklam yok.
- **Merge / Play upload YOK.** PR #88 final exact-head CI ve fiziksel no-double kabulü açık; Levent ayrıca açık merge onayı vermeden merge yapılmaz.
''')

          prepend(
            'docs/project-memory/GOREV_HAVUZU.md',
            '## 0L - 21 Ağustos 2026 / 1.68.19+109 birleşik yayın adayı',
            r'''
- **Durum:** +108 SORU DÜZELTMELERİ KORUNDU / UMP-ADMOB FİZİKSEL PASS / SSV CUTOVER +10 XP PASS / +109 TEST-BEFORE-COMMIT PASS / DRAFT PR #88 / MERGE VE PLAY YÜKLEME YOK.
- Taban: `fea206036366c604a54159be3bbe39e22fe24a2d` / `1.68.18+108`.
- Aday: `release/1.68.19-109-admob-fix-20260821` / `1999a049018b5d23eeda59b0b9d2e0e435cf0a64` / `1.68.19+109` / Draft PR #88.
- +108'deki 81 gerçek soru düzeltmesi korunur; `assets/questions.json` +109 adayında değişmez.
- Pre-commit run `32481091014`: focused 42/42, all Flutter 301/301, analyze non-fatal, diff check PASS; artifact ID `9446124898`.
- Fiziksel production: banner PASS, rewarded PASS, AdMob Verify URL PASS, SSV cutover/readback PASS, reklam sonrası +10 XP PASS.

**Bitti ölçütü:**
- [x] +108 exact release SHA/sürüm doğrulandı.
- [x] +108 soru bankası +109 adayında sıfır fark.
- [x] UMP/AdMob fiziksel banner + rewarded PASS.
- [x] SSV redeploy + Verify URL + açık cutover sonrası gerçek +10 XP PASS.
- [x] +109 test-before-commit focused 42/42, tüm Flutter 301/301, analyze/diff PASS.
- [x] Exact test artifactından tek temiz +109 ürün commit'i ve Draft PR #88 oluşturuldu.
- [ ] PR #88 final exact-head AdMob/Android 16 CI + artifact PASS.
- [ ] Aynı `gameId` fiziksel no-double PASS.
- [ ] Levent açık merge onayı; expected-head merge.
- [ ] Merge sonrası exact release SHA'dan production `1.68.19+109` AAB ve package/version/signing/AdMob-Firebase profil doğrulaması.
- [ ] Levent onayıyla doğrulanan +109 AAB Play Console'a yüklenir.
''')

          prepend(
            'docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md',
            '## 1.68.19+109 birleşik yayın adayı — AÇIK',
            r'''
- Draft PR #88 exact +108 `fea206036366c604a54159be3bbe39e22fe24a2d` tabanında +108 soru düzeltmelerini koruyup fiziksel doğrulanmış UMP/AdMob düzeltmesini taşır.
- SSV production cutover açıktır ve fiziksel reklam sonrası +10 XP PASS olmuştur.
- **DOĞRULANACAK:** aynı tamamlanan oyun/gameId için ikinci +10 XP verilmemesi (fiziksel no-double).
- **DOĞRULANACAK:** PR #88 final docs-head exact-head CI, Android 16 ve artifact.
- **DOĞRULANACAK:** merge sonrası exact release SHA'dan production `1.68.19+109` AAB; package/version/signing ve gerçek AdMob + Firebase production profili.
- **DOĞRULANACAK:** +109 Play Console upload/review/public rollout. Açık kullanıcı onayı olmadan merge/upload yapılmaz.
''')

          checkpoint = Path('docs/project-memory/checkpoints/RELEASE_109_ADMOB_20260821.md')
          checkpoint.parent.mkdir(parents=True, exist_ok=True)
          checkpoint.write_text(r'''# Bilgi Rotası 1.68.19+109 AdMob/UMP birleşik yayın checkpointi

- Tarih: 21 Ağustos 2026
- Base: `fea206036366c604a54159be3bbe39e22fe24a2d` / `1.68.18+108`
- Product branch: `release/1.68.19-109-admob-fix-20260821`
- Product commit: `1999a049018b5d23eeda59b0b9d2e0e435cf0a64`
- Draft PR: #88
- Commit adı: `fix: ship 1.68.19+109 with AdMob UMP recovery`
- Pre-commit run/job: `32481091014` / `96767404086`
- Focused AdMob/privacy: 42/42 PASS
- Full Flutter: 301/301 PASS
- Analyze: non-fatal PASS
- `git diff --check`: PASS
- +109 `assets/questions.json`: +108 ile sıfır fark
- Candidate artifact: ID `9446124898`, digest `sha256:3c9e11123a9203ba1efce156044e72a3cab2a3b8f116f04ab08cb1d26df60c17`
- Fiziksel production: banner PASS, rewarded PASS, Verify URL PASS, SSV cutover/readback PASS, +10 XP PASS.
- Açık: no-double, PR #88 final exact-head CI, explicit merge, merge sonrası production AAB, Play upload.
''')
          PY

          git diff --check
          git diff --exit-code 1999a049018b5d23eeda59b0b9d2e0e435cf0a64 -- assets/questions.json lib/ad_monetization.dart lib/app_build_info.dart pubspec.yaml test/ad_monetization_diagnostics_test.dart test/admob_ump_fallback_test.dart
          test "$(git diff --name-only | grep -v '^docs/project-memory/' | wc -l)" -eq 0
          git add docs/project-memory/BILGI_ROTASI_DURUM.md docs/project-memory/GOREV_HAVUZU.md docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md docs/project-memory/checkpoints/RELEASE_109_ADMOB_20260821.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record 1.68.19+109 release checkpoint'
          git push origin HEAD:refs/heads/release/1.68.19-109-admob-fix-20260821
