name: Kelime Avı Android 16 görsel kanıtı

on:
  pull_request:
    branches:
      - qa/kelime-avi-visual-proof-base-1968-20260824
    paths:
      - 'lib/word_hunt/**'
      - 'test/home_hub_prototype_test.dart'
      - 'test/word_hunt_*.dart'
      - 'assets/word_hunt/**'
      - 'pubspec.yaml'
      - '.github/workflows/word-hunt-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-proof:
    name: Başlangıç Limanı gerçek Android 16 ekranı
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PROOF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Exact feature HEAD'i indir
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_SHA }}

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Bağımlılıkları kur ve Kelime Avı focused suite'ini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze lib/word_hunt
          flutter test \
            test/home_hub_prototype_test.dart \
            test/word_hunt_models_test.dart \
            test/word_hunt_path_test.dart \
            test/word_hunt_progress_codec_test.dart \
            test/word_hunt_progress_test.dart \
            test/word_hunt_route_stop_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_route_map_v2_view_test.dart \
            test/word_hunt_route_map_view_test.dart \
            test/word_hunt_scoring_test.dart \
            test/word_hunt_starter_content_test.dart \
            --reporter expanded
          git diff --check

      - name: İzole görsel kanıt APK'sını üret ve asset'i doğrula
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            -t lib/word_hunt/word_hunt_visual_proof_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p reports
          git rev-parse HEAD | tee reports/WORD_HUNT_VISUAL_PROOF_HEAD_SHA.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk \
            | tee reports/WORD_HUNT_VISUAL_PROOF_APK_SHA256.txt
          unzip -l build/app/outputs/flutter-apk/app-debug.apk \
            | tee reports/WORD_HUNT_VISUAL_PROOF_APK_ASSET_LIST.txt
          asset_entry='assets/flutter_assets/assets/word_hunt/baslangic_limani_bg.jpg'
          grep -Fq "$asset_entry" reports/WORD_HUNT_VISUAL_PROOF_APK_ASSET_LIST.txt
          unzip -p build/app/outputs/flutter-apk/app-debug.apk "$asset_entry" \
            > reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET.jpg
          test -s reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET.jpg
          cmp -s \
            assets/word_hunt/baslangic_limani_bg.jpg \
            reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET.jpg
          printf 'MATCH\n' | tee reports/WORD_HUNT_VISUAL_PROOF_ASSET_COMPARE.txt
          wc -c < assets/word_hunt/baslangic_limani_bg.jpg \
            | tr -d ' ' \
            | tee reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_BYTES.txt
          wc -c < reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET.jpg \
            | tr -d ' ' \
            | tee reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_BYTES.txt
          sha256sum assets/word_hunt/baslangic_limani_bg.jpg \
            | tee reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_SHA256.txt
          sha256sum reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET.jpg \
            | tee reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_SHA256.txt

      - name: KVM erişimini hazırla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Android 16 emülatörde gerçek ekranı çek
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            mkdir -p reports
            if adb shell pm path com.leventua.bilgirotasi 2>/dev/null | grep -q '^package:'; then adb uninstall com.leventua.bilgirotasi; fi
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.leventua.bilgirotasi
            adb shell monkey -p com.leventua.bilgirotasi -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 8
            adb shell dumpsys activity activities > reports/WORD_HUNT_VISUAL_PROOF_ACTIVITY.txt
            adb exec-out screencap -p > reports/WORD_HUNT_ROUTE_MAP_ANDROID16_TOP.png
            adb logcat -d > reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt
            grep -E 'WORD_HUNT_ASSET_(LOADED|ERROR)' reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt > reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt || true
            test -s reports/WORD_HUNT_ROUTE_MAP_ANDROID16_TOP.png
            grep -Fq 'com.leventua.bilgirotasi/.MainActivity' reports/WORD_HUNT_VISUAL_PROOF_ACTIVITY.txt
            if grep -E 'FATAL EXCEPTION|ANR in com\.leventua\.bilgirotasi|am_crash.*com\.leventua\.bilgirotasi|am_proc_died.*com\.leventua\.bilgirotasi' reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt; then
              echo 'Bilgi Rotası visual-proof process failure detected.' >&2
              exit 1
            fi
            if grep -Fq '[WORD_HUNT_ASSET_ERROR]' reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt; then
              cat reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt >&2
              exit 1
            fi
            grep -Fq '[WORD_HUNT_ASSET_LOADED]' reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt
            adb shell input swipe 540 1550 540 520 400 || true
            sleep 2
            adb exec-out screencap -p > reports/WORD_HUNT_ROUTE_MAP_ANDROID16_BOTTOM.png
            test -s reports/WORD_HUNT_ROUTE_MAP_ANDROID16_BOTTOM.png

      - name: Görsel kanıt artifact'ini yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-VisualProof-${{ env.PROOF_SHA }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
