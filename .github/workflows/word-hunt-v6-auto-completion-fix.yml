      - name: Full Word Hunt suite
        shell: bash
        run: flutter test test/word_hunt_*_test.dart

      - name: Commit exact tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/word_hunt/word_hunt_screens.dart \
            test/word_hunt_level_production_test.dart \
            test/word_hunt_auto_completion_regression_test.dart
