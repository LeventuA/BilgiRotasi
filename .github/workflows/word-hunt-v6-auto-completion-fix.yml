name: Word Hunt V6 auto completion fix

on:
  push:
    branches:
      - fix/kelime-avi-v6-auto-completion-dialog-20260902
    paths:
      - .github/workflows/word-hunt-v6-auto-completion-fix.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply narrow product fix and update legacy contract test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

