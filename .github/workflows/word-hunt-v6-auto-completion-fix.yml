          # Formatting in the source has 4-space method indentation, not the
          # wrapped indentation above. Use the stable local marker instead.
          marker = """    final result = WordHuntPathEngine.evaluate(
              level: widget.level,
              path: selectedPath,
              foundTargetWords: _foundTargets,
