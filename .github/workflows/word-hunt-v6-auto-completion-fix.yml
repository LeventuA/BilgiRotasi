    );

    setState(() {
          """
          if result_anchor not in text:
              raise SystemExit('product result anchor not found')
          text = text.replace(
              result_anchor,
              result_anchor.replace('\n\n    setState(() {', '\n\n    var shouldAutoFinish = false;\n    setState(() {'),
              1,
          )

          freeze_anchor = """            _completionMistakes = _mistakes;
            _timer?.cancel();
          }
          """
          if text.count(freeze_anchor) != 1:
              raise SystemExit(f'completion freeze anchor count={text.count(freeze_anchor)}')
          text = text.replace(
              freeze_anchor,
              """            _completionMistakes = _mistakes;
            _timer?.cancel();
            shouldAutoFinish = true;
          }
          """,
              1,
          )

          end_anchor = """    });
  }

