name: TMP Kelime Avi approved background materialize

on:
  push:
    branches:
      - tmp/kelime-avi-bg-materialize-20260822
    paths:
      - .github/workflows/tmp-kelime-avi-bg-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download approved Canva asset at target dimensions
        env:
          ASSET_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:2340/quality:95/uri:ifs%3A%2F%2FM%2F2cbb76d4-2a1a-4674-966d-a96739128846/watermark:F/width:1080?csig=AAAAAAAAAAAAAAAAAAAAAF5a-ovkvqkqDaQ2_6byTBiN4qXKcpSFTFuC14OXZMk0&exp=1787374643&osig=AAAAAAAAAAAAAAAAAAAAAHjVa4eJEKqr4ZVhTkhqDSNXx1KyxTv9bAQ6ACOsAAbP&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p .tmp/materialized assets/word_hunt
          curl --fail --location --silent --show-error "$ASSET_URL" -o .tmp/materialized/bg.jpg
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          p = Path('.tmp/materialized/bg.jpg')
          b = p.read_bytes()
          if b[:2] != b'\xff\xd8':
              raise SystemExit('NOT_JPEG')
          i = 2
          w = h = None
          while i + 9 < len(b):
              if b[i] != 0xFF:
                  i += 1
                  continue
              marker = b[i+1]
              i += 2
              if marker in (0xD8, 0xD9):
                  continue
              if i + 2 > len(b):
                  break
              seglen = int.from_bytes(b[i:i+2], 'big')
              if marker in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF):
                  h = int.from_bytes(b[i+3:i+5], 'big')
                  w = int.from_bytes(b[i+5:i+7], 'big')
                  break
              i += seglen
          print(f'SIZE={len(b)}')
          print(f'DIMENSIONS={w}x{h}')
          print('SHA256=' + hashlib.sha256(b).hexdigest())
          if (w, h) != (1080, 2340):
              raise SystemExit(f'WRONG_DIMENSIONS:{w}x{h}')
          Path('assets/word_hunt/baslangic_limani_bg_approved_materialized.jpg').write_bytes(b)
          PY

      - name: Commit only verified binary to staging branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/word_hunt/baslangic_limani_bg_approved_materialized.jpg
          git diff --cached --quiet && exit 0
          git commit -m "chore: materialize approved Baslangic Limani background [skip ci]"
          git push origin HEAD:tmp/kelime-avi-bg-materialize-20260822
