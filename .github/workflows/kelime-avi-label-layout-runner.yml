name: Kelime Avı özel etiket yerleşim düzeltmesi

on:
  pull_request:
    branches:
      - ci/kelime-avi-label-layout-runner-20260822
    paths:
      - '.tmp/kelime-avi-label-layout.trigger'
      - 'lib/word_hunt/word_hunt_route_map_v2_screen.dart'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Head branch'i indir
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Etiket iç yerleşimini deterministik düzelt
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .tmp/kelime-avi-label-layout.trigger ]; then
            echo 'Trigger already consumed; nothing to patch.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/word_hunt/word_hunt_route_map_v2_screen.dart')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "left: labelOnLeft ? 0 : 6,": "left: labelOnLeft ? 0 : 4,",
              "right: labelOnLeft ? 6 : 0,": "right: labelOnLeft ? 4 : 0,",
              "padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),": "padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 6),",
              "Icon(icon, color: accent, size: 17),\n            const SizedBox(width: 5),": "Icon(icon, color: accent, size: 14),\n            const SizedBox(width: 4),",
              "fontSize: 10.0,": "fontSize: 9.4,",
              "letterSpacing: 0.5,": "letterSpacing: 0.2,",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          dart format lib/word_hunt/word_hunt_route_map_v2_screen.dart
          git diff --check
          git diff -- lib/word_hunt/word_hunt_route_map_v2_screen.dart

      - name: Kelime Avı testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .tmp/kelime-avi-label-layout.trigger ]; then
            exit 0
          fi
          flutter pub get
          dart analyze lib/word_hunt
          flutter test test/word_hunt_route_map_v2_reference_layout_test.dart --reporter expanded
          flutter test test/word_hunt_route_map_v2_view_test.dart --reporter expanded
          git diff --check

      - name: Test edilmiş patch'i commit et
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .tmp/kelime-avi-label-layout.trigger ]; then
            exit 0
          fi
          git rm .tmp/kelime-avi-label-layout.trigger
          git add lib/word_hunt/word_hunt_route_map_v2_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(kelime-avi): keep special stop labels word-safe'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
