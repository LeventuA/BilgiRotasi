name: Kelime Avi V6 auto completion Android 16

on:
  workflow_dispatch:
  push:
    branches:
      - qa/kelime-avi-v6-auto-completion-android16-20260902
    paths:
      - .github/workflows/word-hunt-v6-auto-completion-android16.yml
      - tools/qa/word_hunt_v6_auto_completion_android16.sh
      - tools/word_hunt_v6_auto_completion_qa_main.dart

permissions:
  contents: read

jobs:
  android-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      TARGET_PRODUCT_SHA: 70ff0a8613da66677a514440f48e1520c411a663
      TARGET_SCREEN_BLOB: f6f8f29bf499abe7bc28e78bcd51165826bf98c2
      QA_PACKAGE: com.leventua.bilgirotasi.wordhuntqa
      REPORT_DIR: reports/word_hunt_v6_auto_completion

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Verify exact clean product and QA harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          git merge-base --is-ancestor "$TARGET_PRODUCT_SHA" HEAD
          test "$(git hash-object lib/word_hunt/word_hunt_screens.dart)" = "$TARGET_SCREEN_BLOB"
          test -z "$(git diff --name-only "$TARGET_PRODUCT_SHA"...HEAD -- lib assets android pubspec.yaml)"
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          bash -n tools/qa/word_hunt_v6_auto_completion_android16.sh
          flutter pub get
          dart analyze lib/word_hunt tools/word_hunt_v6_auto_completion_qa_main.dart
          flutter test test/word_hunt_auto_completion_regression_test.dart test/word_hunt_level_production_test.dart
          printf '%s\n' \
            "TARGET_PRODUCT_SHA=$TARGET_PRODUCT_SHA" \
            "TARGET_SCREEN_BLOB=$TARGET_SCREEN_BLOB" \
            'PRODUCT_SCOPE_UNCHANGED=PASS' \
            'FOCUSED_REGRESSION_TESTS=PASS' \
            | tee "$REPORT_DIR/STATIC_GATE_SUMMARY.txt"

      - name: Build distinct-package QA APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build.gradle.kts /tmp/build.gradle.kts.original
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.original
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          plugin = '    id("com.google.gms.google-services")\n'
          if text.count(plugin) != 1:
              raise SystemExit('google-services plugin count mismatch')
          text = text.replace(plugin, '')
          old_id = '        applicationId = "com.leventua.bilgirotasi"'
          new_id = '        applicationId = "com.leventua.bilgirotasi.wordhuntqa"'
          if text.count(old_id) != 1:
              raise SystemExit('applicationId count mismatch')
          gradle.write_text(text.replace(old_id, new_id), encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          mtext = manifest.read_text(encoding='utf-8')
          old_label = 'android:label="Bilgi Rotası"'
          new_label = 'android:label="Kelime Avı V6 Auto QA"'
          if mtext.count(old_label) != 1:
              raise SystemExit('application label count mismatch')
          manifest.write_text(mtext.replace(old_label, new_label), encoding='utf-8')
          PY
          flutter build apk --debug -t tools/word_hunt_v6_auto_completion_qa_main.dart --dart-define=ADMOB_ENVIRONMENT=test
          cp build/app/outputs/flutter-apk/app-debug.apk "$REPORT_DIR/KelimeAvi-V6-Auto-Completion-QA.apk"
          sha256sum "$REPORT_DIR/KelimeAvi-V6-Auto-Completion-QA.apk" | tee "$REPORT_DIR/APK_SHA256.txt"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt" dump badging "$REPORT_DIR/KelimeAvi-V6-Auto-Completion-QA.apk" | tee "$REPORT_DIR/APK_BADGING.txt"
          grep -q "package: name='$QA_PACKAGE'" "$REPORT_DIR/APK_BADGING.txt"
          grep -q "application-label:'Kelime Avı V6 Auto QA'" "$REPORT_DIR/APK_BADGING.txt"
          cp /tmp/build.gradle.kts.original android/app/build.gradle.kts
          cp /tmp/AndroidManifest.xml.original android/app/src/main/AndroidManifest.xml
          test -z "$(git status --porcelain -- android)"
          (cd android && ./gradlew --stop)

      - name: Prepare KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Android 16 B5 B10 B5 automatic completion proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: bash tools/qa/word_hunt_v6_auto_completion_android16.sh

      - name: Upload raw Android proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Avi-V6-Auto-Completion-Android16-Proof
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 7
