name: Fresh closed test 1.68.18+108

on:
  push:
    branches:
      - ci/fresh-closed-test-1.68.18-108
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8
    paths:
      - .github/workflows/fresh-closed-test-1.68.18-108.yml

permissions:
  contents: read

jobs:
  verify-source:
    name: Exact release kaynak kilidi
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release SHA ve tek CI farkını doğrula
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="fea206036366c604a54159be3bbe39e22fe24a2d"
          git cat-file -e "$RELEASE_SHA^{commit}"
          CHANGED="$(git diff --name-only "$RELEASE_SHA" HEAD)"
          test "$CHANGED" = ".github/workflows/fresh-closed-test-1.68.18-108.yml"
          grep -Fxq 'version: 1.68.18+108' pubspec.yaml

  closed-test-release:
    name: İmzalı fresh AAB ve Android 16 doğrulaması
    needs: verify-source
    uses: ./.github/workflows/closed-test-release-core.yml
    with:
      confirmation: CLOSED_TEST
    secrets: inherit
