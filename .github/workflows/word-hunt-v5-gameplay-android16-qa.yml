name: Kelime Avı V6 B10 tight-grid raw preview

on:
  push:
    branches:
      - qa/kelime-avi-v5-reference-android16-proof-20260831
    paths:
      - '.github/workflows/word-hunt-v5-gameplay-android16-qa.yml'
      - 'tools/qa/word_hunt_v5_layout_preview_patch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b10-visual-preview:
    name: B10 tight-grid preview / raw Android 16
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QA_SHA: ca211433ce5dd65533195427601d29ec8f16bc0a
      PACKAGE_NAME: com.leventua.bilgirotasi
      REPORTS: reports/word_hunt_v5_gameplay

    steps:
      - name: Exact çalışma HEAD'ini indir
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SHA }}
          fetch-depth: 0

      - name: Preview patch aracını ayrı klasöre indir
        uses: actions/checkout@v4
        with:
          ref: qa/kelime-avi-v5-reference-android16-proof-20260831
          path: qa-tools

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Preview patch + static/test gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORTS"
          python3 qa-tools/tools/qa/word_hunt_v5_layout_preview_patch.py
          dart format lib/word_hunt/word_hunt_screens.dart
          grep -q '^const _harborGridSpacing = 1\.5;$' lib/word_hunt/word_hunt_screens.dart
          grep -q '^const _harborCellVisualScale = 1\.12;$' lib/word_hunt/word_hunt_screens.dart
          git diff --check
          git diff -- lib/word_hunt/word_hunt_screens.dart > "$REPORTS/PREVIEW.diff"
          test -s "$REPORTS/PREVIEW.diff"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'lib/word_hunt/word_hunt_screens.dart'
          test "$(git diff --name-only -- assets/word_hunt/v5_reference_assets | wc -l)" -eq 0
          test "$(git diff --name-only -- assets/questions.json lib/main.dart | wc -l)" -eq 0
          flutter pub get
          dart analyze lib/word_hunt
          flutter test test/word_hunt_*_test.dart

      - name: Preview APK üret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/debug "$REPORTS"
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          printf '%s\n' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <application>' \
            '    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' \
            '  </application>' \
            '</manifest>' \
            > android/app/src/debug/AndroidManifest.xml
          flutter build apk --debug \
            -t tools/word_hunt_v5_gameplay_qa_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          printf '%s\n' "$QA_SHA" > "$REPORTS/BASE_SHA.txt"
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > "$REPORTS/APK_SHA256.txt"
          (cd android && ./gradlew --stop)

      - name: Android emulator KVM erişimini hazırla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Raw Android 16 initial + gerçek YOL-found screenshot üret
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            set -eu
            mkdir -p "$REPORTS"
            adb shell wm size 1080x1920
            adb shell wm density 420
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '36'
            adb shell wm size | grep -Fq '1080x1920'
            adb shell wm density | grep -Fq '420'

            if adb shell pm path "$PACKAGE_NAME" 2>/dev/null | grep -q '^package:'; then
              adb uninstall "$PACKAGE_NAME" >/dev/null
            fi
            adb install build/app/outputs/flutter-apk/app-debug.apk >/dev/null
            adb shell settings put secure immersive_mode_confirmations confirmed

            capture_png() {
              local output="$1"
              adb exec-out screencap -p > "$output"
              test -s "$output"
              python3 - "$output" <<'PY'
            import sys
            from PIL import Image
            image = Image.open(sys.argv[1])
            if image.size != (1080, 1920):
                raise SystemExit(f'Unexpected PNG size: {image.size}')
            print(f'PASS PNG {sys.argv[1]} {image.size[0]}x{image.size[1]}')
            PY
            }

            launch_b10() {
              local suffix="$1"
              adb shell am force-stop "$PACKAGE_NAME"
              adb shell am start -n "$PACKAGE_NAME/.MainActivity" >/dev/null
              sleep 12
              capture_png "$REPORTS/00_SELECTOR_${suffix}.png"
              # Canonical 1080x1920 QA selector center from prior successful Android proof.
              adb shell input tap 540 1244
              sleep 6
            }

            semantic_gate() {
              local before="$1"
              local after="$2"
              python3 - "$before" "$after" <<'PY'
            import sys
            from PIL import Image, ImageChops

            before = Image.open(sys.argv[1]).convert('RGB')
            after = Image.open(sys.argv[2]).convert('RGB')
            coords = [(476, 1004), (604, 1004), (731, 1004)]

            def changed_pixels(box):
                diff = ImageChops.difference(before.crop(box), after.crop(box))
                return sum(1 for pixel in diff.getdata() if pixel != (0, 0, 0))

            cell_changes = [
                changed_pixels((x - 45, y - 45, x + 45, y + 45))
                for x, y in coords
            ]
            progress_change = changed_pixels((165, 210, 250, 255))
            print(f'YOL_CELL_CHANGED_PIXELS={cell_changes}')
            print(f'PROGRESS_PANEL_CHANGED_PIXELS={progress_change}')
            if any(value < 3000 for value in cell_changes):
                raise SystemExit(21)
            if progress_change < 100:
                raise SystemExit(22)
            print('YOL_SEMANTIC_VISUAL_GATE=PASS')
            PY
            }

            launch_b10 initial
            capture_png "$REPORTS/04_B10_INITIAL.png"

            passed=0
            for duration in 900 1800 3000; do
              capture_png "$REPORTS/08_B10_YOL_BEFORE_${duration}.png"
              adb shell input swipe 476 1004 731 1004 "$duration"
              sleep 2
              capture_png "$REPORTS/09_B10_YOL_AFTER_${duration}.png"
              if semantic_gate \
                "$REPORTS/08_B10_YOL_BEFORE_${duration}.png" \
                "$REPORTS/09_B10_YOL_AFTER_${duration}.png"; then
                cp "$REPORTS/08_B10_YOL_BEFORE_${duration}.png" "$REPORTS/08_B10_YOL_BEFORE.png"
                cp "$REPORTS/09_B10_YOL_AFTER_${duration}.png" "$REPORTS/09_B10_YOL_FOUND.png"
                printf '%s\n' "$duration" > "$REPORTS/YOL_PASS_DURATION_MS.txt"
                passed=1
                break
              fi
              launch_b10 "retry_${duration}"
            done

            test "$passed" -eq 1
            test -s "$REPORTS/04_B10_INITIAL.png"
            test -s "$REPORTS/09_B10_YOL_FOUND.png"
            sha256sum "$REPORTS/04_B10_INITIAL.png" "$REPORTS/09_B10_YOL_FOUND.png" \
              > "$REPORTS/SHA256SUMS.txt"
            printf '%s\n' \
              'ANDROID_API=36' \
              'RESOLUTION=1080x1920' \
              'DENSITY=420' \
              'STATIC_TESTS=138/138 PASS' \
              'YOL_SEMANTIC_VISUAL_GATE=PASS' \
              > "$REPORTS/QA_SUMMARY.txt"

      - name: Preview kanıtını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-V6-B10-tight-grid-semantic-${{ env.QA_SHA }}
          path: reports/word_hunt_v5_gameplay/**
          if-no-files-found: error
          retention-days: 21
