name: Kelime Avı V6 B10 tight-grid raw preview

on:
  push:
    branches:
      - qa/kelime-avi-v5-reference-android16-proof-20260831
    paths:
      - '.github/workflows/word-hunt-v5-gameplay-android16-qa.yml'
      - 'tools/qa/word_hunt_v5_layout_preview_patch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b10-visual-preview:
    name: B10 tight-grid preview / raw Android 16
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QA_SHA: ca211433ce5dd65533195427601d29ec8f16bc0a

    steps:
      - name: Exact çalışma HEAD'ini indir
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SHA }}
          fetch-depth: 0

      - name: Preview patch aracını ayrı klasöre indir
        uses: actions/checkout@v4
        with:
          ref: qa/kelime-avi-v5-reference-android16-proof-20260831
          path: qa-tools

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Preview patch + static/test gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/word_hunt_v5_gameplay
          python3 qa-tools/tools/qa/word_hunt_v5_layout_preview_patch.py
          dart format lib/word_hunt/word_hunt_screens.dart
          grep -q '^const _harborGridSpacing = 1\.5;$' lib/word_hunt/word_hunt_screens.dart
          grep -q '^const _harborCellVisualScale = 1\.12;$' lib/word_hunt/word_hunt_screens.dart
          git diff --check
          git diff -- lib/word_hunt/word_hunt_screens.dart > reports/word_hunt_v5_gameplay/PREVIEW.diff
          test -s reports/word_hunt_v5_gameplay/PREVIEW.diff
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'lib/word_hunt/word_hunt_screens.dart'
          test "$(git diff --name-only -- assets/word_hunt/v5_reference_assets | wc -l)" -eq 0
          test "$(git diff --name-only -- assets/questions.json lib/main.dart | wc -l)" -eq 0
          flutter pub get
          dart analyze lib/word_hunt
          flutter test test/word_hunt_*_test.dart

      - name: Preview APK üret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/debug reports/word_hunt_v5_gameplay
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          printf '%s\n' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <application>' \
            '    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' \
            '  </application>' \
            '</manifest>' \
            > android/app/src/debug/AndroidManifest.xml
          flutter build apk --debug \
            -t tools/word_hunt_v5_gameplay_qa_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          printf '%s\n' "$QA_SHA" > reports/word_hunt_v5_gameplay/BASE_SHA.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > reports/word_hunt_v5_gameplay/APK_SHA256.txt
          (cd android && ./gradlew --stop)

      - name: B10-only deterministik QA scriptini hazırla
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/word_hunt_v5_gameplay_android16.sh')
          text = path.read_text(encoding='utf-8')
          marker = "capture_initial 1 5 '01_B1_INITIAL.png'"
          start = text.index(marker)
          replacement = r'''capture_initial 10 9 '04_B10_INITIAL.png'

          open_level 'QA B10' '08_B10_YOL_BEFORE'
          capture_png "$REPORTS/08_B10_YOL_BEFORE.png"
          read -r yol_x1 yol_y1 < <(
            python3 "$UI" log-cell-center "$REPORTS/08_B10_YOL_BEFORE.logcat" 10 2 3
          )
          read -r yol_xm yol_ym < <(
            python3 "$UI" log-cell-center "$REPORTS/08_B10_YOL_BEFORE.logcat" 10 2 4
          )
          read -r yol_x2 yol_y2 < <(
            python3 "$UI" log-cell-center "$REPORTS/08_B10_YOL_BEFORE.logcat" 10 2 5
          )
          adb shell input motionevent DOWN "$yol_x1" "$yol_y1"
          sleep 0.12
          adb shell input motionevent MOVE "$yol_xm" "$yol_ym"
          sleep 0.12
          adb shell input motionevent MOVE "$yol_x2" "$yol_y2"
          sleep 0.12
          adb shell input motionevent UP "$yol_x2" "$yol_y2"
          sleep 1
          capture_png "$REPORTS/09_B10_YOL_FOUND.png"
          flutter_log > "$REPORTS/09_B10_YOL_FOUND.logcat" || true
          python3 "$UI" assert-grid-visual-change \
            "$REPORTS/08_B10_YOL_BEFORE.png" \
            "$REPORTS/09_B10_YOL_FOUND.png" \
            "$REPORTS/08_B10_YOL_BEFORE.logcat" 10

          python3 - "$REPORTS/08_B10_YOL_BEFORE.png" "$REPORTS/09_B10_YOL_FOUND.png" \
            "$yol_x1" "$yol_y1" "$yol_xm" "$yol_ym" "$yol_x2" "$yol_y2" <<'PY2'
          import sys
          from PIL import Image
          import numpy as np

          before = np.array(Image.open(sys.argv[1]).convert('RGB'))
          after = np.array(Image.open(sys.argv[2]).convert('RGB'))
          coords = [
              (int(sys.argv[3]), int(sys.argv[4])),
              (int(sys.argv[5]), int(sys.argv[6])),
              (int(sys.argv[7]), int(sys.argv[8])),
          ]

          def changed_pixels(box):
              x1, y1, x2, y2 = box
              return int(np.any(before[y1:y2, x1:x2] != after[y1:y2, x1:x2], axis=2).sum())

          cell_changes = []
          for x, y in coords:
              cell_changes.append(changed_pixels((x - 45, y - 45, x + 45, y + 45)))
          progress_change = changed_pixels((165, 210, 250, 255))

          print(f'YOL_CELL_CHANGED_PIXELS={cell_changes}')
          print(f'PROGRESS_PANEL_CHANGED_PIXELS={progress_change}')
          if any(value < 3000 for value in cell_changes):
              raise SystemExit('YOL semantic gate failed: all three Y-O-L cells did not change')
          if progress_change < 100:
              raise SystemExit('YOL semantic gate failed: progress panel did not change from 0/9')
          print('YOL_SEMANTIC_VISUAL_GATE=PASS')
          PY2
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          path.write_text(text[:start] + replacement, encoding='utf-8')
          PY
          bash -n tools/word_hunt_v5_gameplay_android16.sh

      - name: Android emulator KVM erişimini hazırla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Raw Android 16 initial + gerçek YOL-found screenshot üret
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            bash tools/word_hunt_v5_gameplay_android16.sh
            test -s reports/word_hunt_v5_gameplay/04_B10_INITIAL.png
            test -s reports/word_hunt_v5_gameplay/09_B10_YOL_FOUND.png
            sha256sum reports/word_hunt_v5_gameplay/04_B10_INITIAL.png reports/word_hunt_v5_gameplay/09_B10_YOL_FOUND.png > reports/word_hunt_v5_gameplay/SHA256SUMS.txt

      - name: Preview kanıtını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-V6-B10-tight-grid-semantic-${{ env.QA_SHA }}
          path: reports/word_hunt_v5_gameplay/**
          if-no-files-found: error
          retention-days: 21
