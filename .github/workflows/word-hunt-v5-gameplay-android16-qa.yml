name: Kelime Avı V5 B10 runtime-layout preview

on:
  push:
    branches:
      - qa/kelime-avi-v5-reference-android16-proof-20260831
    paths:
      - '.github/workflows/word-hunt-v5-gameplay-android16-qa.yml'
      - 'tools/qa/word_hunt_v5_layout_preview_patch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b10-visual-preview:
    name: B10 layout preview / raw Android 16
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QA_SHA: 9cfa12aeafd29d6197c91c79361648508adf400d

    steps:
      - name: Exact çalışma HEAD'ini indir
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SHA }}

      - name: Preview patch aracını ayrı klasöre indir
        uses: actions/checkout@v4
        with:
          ref: qa/kelime-avi-v5-reference-android16-proof-20260831
          path: qa-tools

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Preview patch + static/test gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/word_hunt_v5_gameplay
          python3 qa-tools/tools/qa/word_hunt_v5_layout_preview_patch.py
          dart format lib/word_hunt/word_hunt_screens.dart
          git diff --check
          git diff -- lib/word_hunt/word_hunt_screens.dart > reports/word_hunt_v5_gameplay/PREVIEW.diff
          test -s reports/word_hunt_v5_gameplay/PREVIEW.diff
          flutter pub get
          dart analyze lib/word_hunt
          flutter test test/word_hunt_*_test.dart

      - name: Preview APK üret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/debug reports/word_hunt_v5_gameplay
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          printf '%s\n' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <application>' \
            '    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' \
            '  </application>' \
            '</manifest>' \
            > android/app/src/debug/AndroidManifest.xml
          flutter build apk --debug \
            -t tools/word_hunt_v5_gameplay_qa_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          printf '%s\n' "$QA_SHA" > reports/word_hunt_v5_gameplay/BASE_SHA.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > reports/word_hunt_v5_gameplay/APK_SHA256.txt
          (cd android && ./gradlew --stop)

      - name: B10-only QA scriptini hazırla
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/word_hunt_v5_gameplay_android16.sh')
          text = path.read_text(encoding='utf-8')
          marker = "capture_initial 1 5 '01_B1_INITIAL.png'"
          start = text.index(marker)
          replacement = r'''capture_initial 10 9 '04_B10_INITIAL.png'

          open_level 'QA B10' '08_B10_YOL_BEFORE'
          capture_png "$REPORTS/08_B10_YOL_BEFORE.png"
          read -r yol_x1 yol_y1 < <(
            python3 "$UI" log-cell-center "$REPORTS/08_B10_YOL_BEFORE.logcat" 10 2 3
          )
          read -r yol_x2 yol_y2 < <(
            python3 "$UI" log-cell-center "$REPORTS/08_B10_YOL_BEFORE.logcat" 10 2 5
          )
          adb shell input swipe "$yol_x1" "$yol_y1" "$yol_x2" "$yol_y2" 900
          sleep 1
          capture_png "$REPORTS/09_B10_YOL_FOUND.png"
          flutter_log > "$REPORTS/09_B10_YOL_FOUND.logcat"
          python3 "$UI" assert-grid-visual-change \
            "$REPORTS/08_B10_YOL_BEFORE.png" \
            "$REPORTS/09_B10_YOL_FOUND.png" \
            "$REPORTS/08_B10_YOL_BEFORE.logcat" 10
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          path.write_text(text[:start] + replacement, encoding='utf-8')
          PY
          bash -n tools/word_hunt_v5_gameplay_android16.sh

      - name: Android emulator KVM erişimini hazırla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Raw Android 16 initial + YOL-found screenshot üret
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            bash tools/word_hunt_v5_gameplay_android16.sh
            test -s reports/word_hunt_v5_gameplay/04_B10_INITIAL.png
            test -s reports/word_hunt_v5_gameplay/09_B10_YOL_FOUND.png
            sha256sum reports/word_hunt_v5_gameplay/04_B10_INITIAL.png reports/word_hunt_v5_gameplay/09_B10_YOL_FOUND.png > reports/word_hunt_v5_gameplay/SHA256SUMS.txt

      - name: Preview kanıtını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-V5-B10-layout-preview-${{ env.QA_SHA }}
          path: reports/word_hunt_v5_gameplay/**
          if-no-files-found: error
          retention-days: 21
