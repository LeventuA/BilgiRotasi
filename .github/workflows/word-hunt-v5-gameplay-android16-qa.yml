name: Kelime Avı V6 B10 tight-grid raw preview

on:
  push:
    branches:
      - qa/kelime-avi-v5-reference-android16-proof-20260831
    paths:
      - '.github/workflows/word-hunt-v5-gameplay-android16-qa.yml'
      - 'tools/qa/word_hunt_v5_layout_preview_patch.py'
      - 'tools/qa/word_hunt_v6_tight_android16.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b10-visual-preview:
    name: B10 tight-grid preview / raw Android 16
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QA_SHA: ca211433ce5dd65533195427601d29ec8f16bc0a
      PACKAGE_NAME: com.leventua.bilgirotasi
      REPORTS: reports/word_hunt_v5_gameplay

    steps:
      - name: Exact çalışma HEAD'ini indir
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SHA }}
          fetch-depth: 0

      - name: Preview patch ve Android QA araçlarını ayrı klasöre indir
        uses: actions/checkout@v4
        with:
          ref: qa/kelime-avi-v5-reference-android16-proof-20260831
          path: qa-tools

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Preview patch + static/test gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORTS"
          python3 qa-tools/tools/qa/word_hunt_v5_layout_preview_patch.py
          dart format lib/word_hunt/word_hunt_screens.dart
          grep -q '^const _harborGridSpacing = 1\.5;$' lib/word_hunt/word_hunt_screens.dart
          grep -q '^const _harborCellVisualScale = 1\.12;$' lib/word_hunt/word_hunt_screens.dart
          git diff --check
          git diff -- lib/word_hunt/word_hunt_screens.dart > "$REPORTS/PREVIEW.diff"
          test -s "$REPORTS/PREVIEW.diff"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'lib/word_hunt/word_hunt_screens.dart'
          test "$(git diff --name-only -- assets/word_hunt/v5_reference_assets | wc -l)" -eq 0
          test "$(git diff --name-only -- assets/questions.json lib/main.dart | wc -l)" -eq 0
          flutter pub get
          dart analyze lib/word_hunt
          flutter test test/word_hunt_*_test.dart

      - name: Preview APK üret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/debug "$REPORTS"
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          printf '%s\n' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <application>' \
            '    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' \
            '  </application>' \
            '</manifest>' \
            > android/app/src/debug/AndroidManifest.xml
          flutter build apk --debug \
            -t tools/word_hunt_v5_gameplay_qa_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          printf '%s\n' "$QA_SHA" > "$REPORTS/BASE_SHA.txt"
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > "$REPORTS/APK_SHA256.txt"
          (cd android && ./gradlew --stop)

      - name: Android emulator KVM erişimini hazırla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Raw Android 16 initial + gerçek YOL-found screenshot üret
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: bash qa-tools/tools/qa/word_hunt_v6_tight_android16.sh

      - name: Preview kanıtını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-V6-B10-tight-grid-semantic-${{ env.QA_SHA }}
          path: reports/word_hunt_v5_gameplay/**
          if-no-files-found: error
          retention-days: 21
