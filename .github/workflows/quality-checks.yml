name: Bilgi Rotasi Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/final-closed-test-aab-1.68.8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-memory-sync-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/push-notifications-issue-37'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Depoyu exact PR branch ile al
        uses: actions/checkout@v4
        with:
          ref: feat/push-notifications-issue-37
          fetch-depth: 0

      - name: Kanonik proje hafizasini guncelle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RUNNER'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/project-memory-sync-once.yml').read_text(
              encoding='utf-8',
          )
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('one-shot memory script markers are not unique')
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'project-memory-sync-once', 'exec'))
          RUNNER

          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md
            docs/project-memory/BILGI_ROTASI_DURUM.md
            docs/project-memory/GOREV_HAVUZU.md
          )
          test "${changed[*]}" = "${expected[*]}"
          grep -Fq 'FİZİKSEL FCM DAVRANIŞI PASS' docs/project-memory/GOREV_HAVUZU.md
          grep -Fq 'run `31806178473`' docs/project-memory/BILGI_ROTASI_DURUM.md
          grep -Fq 'DAVRANIŞ PASS / LOGCAT AÇIK' docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md

      - name: Hafiza commit ve push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/project-memory/BILGI_ROTASI_DURUM.md
          git add -- docs/project-memory/GOREV_HAVUZU.md
          git add -- docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md
          git diff --cached --check
          git commit -m 'docs: record physical push acceptance'
          git push origin HEAD:feat/push-notifications-issue-37

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri indir
        run: flutter pub get

      - name: Soru bankasını doğrula
        run: python3 tools/validate_questions.py

      - name: Kod analizi
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Otomatik testler
        run: flutter test
