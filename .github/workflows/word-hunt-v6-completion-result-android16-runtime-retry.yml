name: Kelime Avi V6 completion result Android 16 runtime retry

on:
  push:
    branches:
      - qa/kelime-avi-v6-completion-result-runtime-20260902
    paths:
      - '.github/workflows/word-hunt-v6-completion-result-android16-runtime-retry.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android16-runtime-only:
    name: Reuse exact APK and verify B5/B10 popup
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PRODUCT_SHA: 1375e7305181a48318b24a112d644903dbbcafbc
      PRODUCT_SCREEN_BLOB: 26c37c5d129a24c5a9545f69682079f27334c1e0
      SOURCE_RUN_ID: '33616963665'
      SOURCE_ARTIFACT: BilgiRotasi-KelimeAvi-V6-Completion-Android16-8288dd98974a95ebbcefb738ed4d9c94533d4eed
      REPORT_DIR: reports/word_hunt_v6_completion_result
      QA_PACKAGE: com.leventua.bilgirotasi

    steps:
      - name: QA harness'i indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Urun kodunu exact dogrula
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          test "$(git hash-object lib/word_hunt/word_hunt_screens.dart)" = "$PRODUCT_SCREEN_BLOB"
          bash -n tools/qa/word_hunt_v6_completion_result_android16.sh

      - name: Onceki run'daki exact APK artifact'ini indir
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: reports/word_hunt_v6_completion_result
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Exact APK ve product SHA'yi dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REPORT_DIR/KelimeAvi-V6-Completion-QA.apk"
          test "$(tr -d '\r\n' < "$REPORT_DIR/PRODUCT_SHA.txt")" = "$PRODUCT_SHA"
          sha256sum "$REPORT_DIR/KelimeAvi-V6-Completion-QA.apk" | tee "$REPORT_DIR/REUSED_APK_SHA256.txt"
          rm -f "$REPORT_DIR"/*.png "$REPORT_DIR"/*LOGCAT.txt "$REPORT_DIR"/TIMEOUT_LOGCAT.txt

      - name: Android emulator KVM erisimini hazirla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Android 16 runtime-only B5/B10 popup dogrulamasi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            printf 'immersive_mode_confirmations=%s\n' "$(adb shell settings get secure immersive_mode_confirmations | tr -d '\r')" \
              | tee "$REPORT_DIR/ANDROID_IMMERSIVE_CONFIRMATION.txt"
            bash tools/qa/word_hunt_v6_completion_result_android16.sh
            find "$REPORT_DIR" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$REPORT_DIR/SHA256SUMS.txt"

      - name: Runtime kanitlarini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-V6-Completion-Android16-Runtime-${{ github.sha }}
          path: reports/word_hunt_v6_completion_result/**
          if-no-files-found: error
          retention-days: 21
