name: Release 109 project-memory checkpoint

on:
  pull_request:
    branches:
      - test/release-109-precommit-gate-20260821

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout trigger PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run docs-only checkpoint script
        shell: bash
        run: bash .github/scripts/record-release-109-merge-checkpoint.sh
