name: AdMob JNI zinciri düzeltme testi 1.68.5+95

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-admob-jni-fix-v95.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-recovery:
    name: AdMob JNI düzeltmesini ve hazır kurtarma APK'sını üret
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 50

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Sağlam 1.68.4+94 tabanını doğrula
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "version: 1.68.4+94" pubspec.yaml
          grep -Fq 'EXPECTED_VERSION = "1.68.4+94"' tools/rc1_quality_gate.py
          ! grep -Fq "google_mobile_ads" pubspec.yaml
          ! grep -Fq "com.google.android.gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml
          test ! -f lib/ad_monetization.dart
          mkdir -p dist reports

      - name: Kalıcı Android imzasını geçici yükle
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/bilgi_rotasi_upload.jks
          chmod 600 /tmp/bilgi_rotasi_upload.jks

          cat > /tmp/bilgi_rotasi_key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bilgi_rotasi_upload.jks
          EOF
          chmod 600 /tmp/bilgi_rotasi_key.properties

      - name: Düzeltilmiş AdMob çalışma ağacını hazırla
        shell: bash
        run: |
          set -euo pipefail
          FIX_DIR="/tmp/bilgi_rotasi_admob95"
          rm -rf "$FIX_DIR"
          git worktree add --detach "$FIX_DIR" HEAD

          cp /tmp/bilgi_rotasi_upload.jks "$FIX_DIR/android/app/bilgi_rotasi_upload.jks"
          cp /tmp/bilgi_rotasi_key.properties "$FIX_DIR/android/key.properties"

          printf '%s' '' | base64 --decode > /tmp/patch_admob95.py
          python3 /tmp/patch_admob95.py "$FIX_DIR"

      - name: AdMob bağımlılık zincirini kesin doğrula
        shell: bash
        run: |
          set -euo pipefail
          FIX_DIR="/tmp/bilgi_rotasi_admob95"

          (
            cd "$FIX_DIR"
            rm -f pubspec.lock
            flutter pub get
            flutter pub deps --style=compact | tee "$GITHUB_WORKSPACE/reports/ADMOB95_DEPENDENCIES.txt"
          )

          grep -Fq "google_mobile_ads 9.0.0" reports/ADMOB95_DEPENDENCIES.txt
          grep -Fq "path_provider_android 2.2.23" reports/ADMOB95_DEPENDENCIES.txt
          ! grep -Eq '(^|[[:space:]-])jni([[:space:]]|$)' reports/ADMOB95_DEPENDENCIES.txt
          ! grep -Eq '(^|[[:space:]-])jni_flutter([[:space:]]|$)' reports/ADMOB95_DEPENDENCIES.txt

          grep -Fq "MobileAds.instance.initialize()" "$FIX_DIR/lib/main.dart"
          grep -Fq "com.google.android.gms.ads.APPLICATION_ID" "$FIX_DIR/android/app/src/main/AndroidManifest.xml"
          ! grep -Fq 'tools:node="remove"' "$FIX_DIR/android/app/src/main/AndroidManifest.xml"

      - name: Düzeltilmiş AdMob sürümünü analiz et ve test et
        shell: bash
        run: |
          set -euo pipefail
          FIX_DIR="/tmp/bilgi_rotasi_admob95"

          (
            cd "$FIX_DIR"
            dart format lib/main.dart lib/app_build_info.dart
            python3 tools/rc1_quality_gate.py --report "$GITHUB_WORKSPACE/reports/ADMOB95_QUALITY.md"
            flutter analyze --no-fatal-warnings --no-fatal-infos
            flutter test --concurrency=1 --reporter expanded
            git diff --check
          )

      - name: Düzeltilmiş AdMob APK üret
        shell: bash
        run: |
          set -euo pipefail
          FIX_DIR="/tmp/bilgi_rotasi_admob95"

          (
            cd "$FIX_DIR"
            flutter build apk --release
          )

          cp "$FIX_DIR/build/app/outputs/flutter-apk/app-release.apk" \
            dist/BilgiRotasi-AdMob-JNI-Duzeltme-1.68.5-95.apk

      - name: Hazır reklamsız kurtarma 1.68.6+96 üret
        shell: bash
        run: |
          set -euo pipefail
          REC_DIR="/tmp/bilgi_rotasi_recovery96"
          rm -rf "$REC_DIR"
          git worktree add --detach "$REC_DIR" HEAD

          cp /tmp/bilgi_rotasi_upload.jks "$REC_DIR/android/app/bilgi_rotasi_upload.jks"
          cp /tmp/bilgi_rotasi_key.properties "$REC_DIR/android/key.properties"

          printf '%s' '' | base64 --decode > /tmp/patch_recovery96.py
          python3 /tmp/patch_recovery96.py "$REC_DIR"

          (
            cd "$REC_DIR"
            flutter pub get
            python3 tools/rc1_quality_gate.py --report "$GITHUB_WORKSPACE/reports/RECOVERY96_QUALITY.md"
            flutter build apk --release
          )

          cp "$REC_DIR/build/app/outputs/flutter-apk/app-release.apk" \
            dist/BilgiRotasi-Kurtarma-1.68.6-96.apk

      - name: APK'ların imza, sürüm ve manifestini doğrula
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${{ANDROID_HOME:-${{ANDROID_SDK_ROOT:-}}}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT2"

          EXPECTED_SHA1="000EE43F410ABC6B4F634C4F716D76EB19084115"

          verify_apk() {
            local apk="$1"
            local version_code="$2"
            local version_name="$3"
            local prefix="$4"

            local cert_output actual_sha1
            cert_output="$("$APKSIGNER" verify --print-certs "$apk")"
            actual_sha1="$(printf '%s\n' "$cert_output" | awk -F': ' '/certificate SHA-1 digest/ {print $NF; exit}' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]' | tr -d ':')"
            test "$actual_sha1" = "$EXPECTED_SHA1"

            "$AAPT2" dump badging "$apk" > "reports/${prefix}_BADGING.txt"
            grep -Fq "package: name='com.leventua.bilgirotasi'" "reports/${prefix}_BADGING.txt"
            grep -Fq "versionCode='${version_code}'" "reports/${prefix}_BADGING.txt"
            grep -Fq "versionName='${version_name}'" "reports/${prefix}_BADGING.txt"

            "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" > "reports/${prefix}_MANIFEST.txt"
          }

          verify_apk dist/BilgiRotasi-AdMob-JNI-Duzeltme-1.68.5-95.apk 95 1.68.5 ADMOB95
          grep -Fq "com.google.android.gms.ads.APPLICATION_ID" reports/ADMOB95_MANIFEST.txt
          grep -Fq "com.google.android.gms.ads.MobileAdsInitProvider" reports/ADMOB95_MANIFEST.txt

          unzip -l dist/BilgiRotasi-AdMob-JNI-Duzeltme-1.68.5-95.apk > reports/ADMOB95_APK_CONTENTS.txt
          ! grep -Ei "jni_flutter|libdartjni|libjni" reports/ADMOB95_APK_CONTENTS.txt

          verify_apk dist/BilgiRotasi-Kurtarma-1.68.6-96.apk 96 1.68.6 RECOVERY96
          ! grep -Fq "com.google.android.gms.ads.APPLICATION_ID" reports/RECOVERY96_MANIFEST.txt
          ! grep -Fq "com.google.android.gms.ads.MobileAdsInitProvider" reports/RECOVERY96_MANIFEST.txt

          sha256sum dist/*.apk | tee reports/ALL_APKS_SHA256.txt

      - name: Geçici dosyaları temizle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/bilgi_rotasi_upload.jks
          rm -f /tmp/bilgi_rotasi_key.properties
          rm -f /tmp/patch_admob95.py
          rm -f /tmp/patch_recovery96.py
          rm -f /tmp/bilgi_rotasi_admob95/android/key.properties
          rm -f /tmp/bilgi_rotasi_admob95/android/app/bilgi_rotasi_upload.jks
          rm -f /tmp/bilgi_rotasi_recovery96/android/key.properties
          rm -f /tmp/bilgi_rotasi_recovery96/android/app/bilgi_rotasi_upload.jks
          git worktree remove --force /tmp/bilgi_rotasi_admob95 >/dev/null 2>&1 || true
          git worktree remove --force /tmp/bilgi_rotasi_recovery96 >/dev/null 2>&1 || true
          rm -rf /tmp/bilgi_rotasi_admob95 /tmp/bilgi_rotasi_recovery96

      - name: Test ve hazır kurtarma paketlerini yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-AdMob-JNI-Duzeltme-ve-Kurtarma
          path: |
            dist/BilgiRotasi-AdMob-JNI-Duzeltme-1.68.5-95.apk
            dist/BilgiRotasi-Kurtarma-1.68.6-96.apk
            reports/ADMOB95_DEPENDENCIES.txt
            reports/ADMOB95_QUALITY.md
            reports/ADMOB95_BADGING.txt
            reports/ADMOB95_MANIFEST.txt
            reports/ADMOB95_APK_CONTENTS.txt
            reports/RECOVERY96_QUALITY.md
            reports/RECOVERY96_BADGING.txt
            reports/RECOVERY96_MANIFEST.txt
            reports/ALL_APKS_SHA256.txt
          if-no-files-found: error
          retention-days: 30
