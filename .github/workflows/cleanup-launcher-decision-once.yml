name: Cleanup launcher decision diff once

on:
  push:
    branches:
      - fix/text-launcher-icon-20260813

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/text-launcher-icon-20260813
          fetch-depth: 0

      - name: Restore canonical formatting and apply only launcher decision
        shell: bash
        run: |
          set -euo pipefail
          path='docs/project-memory/KARARLAR.md'
          git show 29a5a23d15485922d670f7e7b3f9b7cea2d0260f:"$path" > "$path"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/project-memory/KARARLAR.md')
          text = path.read_text(encoding='utf-8')
          old = '- Uygulama simgesinde yazı kullanılmayacak.\n'
          new = (
              '- Uygulama launcher simgesinin temel tasarımı **BİLGİ ROTASI yazılı pusula** olacaktır; yazı kaldırılmayacaktır.\n'
              '- Launcher simgesinde ana pusula ve `BİLGİ ROTASI` yazısı Android adaptive-icon güvenli alanında korunacaktır.\n'
              '- Splash ekranı launcher simgesinden ayrı varlıktır; launcher simgesi değişikliği splash\'ı kendiliğinden değiştirmez.\n'
          )
          if text.count(old) != 1:
              raise SystemExit('Beklenen eski ikon kararı tam bir kez bulunamadı')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- "$path"

      - name: Commit only cleaned decision diff and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZMilaStudio'
          git config user.email 'levent.ua@gmail.com'
          git rm .github/workflows/cleanup-launcher-decision-once.yml
          git add docs/project-memory/KARARLAR.md
          git diff --cached --check
          git commit -m 'docs: limit launcher decision diff'
          git push origin HEAD:fix/text-launcher-icon-20260813
