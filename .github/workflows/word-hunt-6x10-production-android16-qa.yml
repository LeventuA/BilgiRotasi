name: Kelime Avi 6x10 production Android 16 QA

on:
  push:
    branches:
      - qa/kelime-avi-6x10-production-android16-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qa:
    name: B1 B5 B8 B10 production runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout QA head
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Dependencies and focused static gates
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          git checkout -- analysis_options.yaml pubspec.lock || true
          dart format lib/word_hunt/word_hunt_android16_qa_main.dart
          dart analyze lib/word_hunt
          flutter test test/word_hunt_*_test.dart --reporter expanded
          git diff --check

      - name: Build QA-only debug APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            -t lib/word_hunt/word_hunt_android16_qa_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p reports
          git rev-parse HEAD | tee reports/QA_HEAD_SHA.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee reports/QA_APK_SHA256.txt

      - name: Prepare KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run production gameplay on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            set -euo pipefail
            mkdir -p reports
            if adb shell pm path com.leventua.bilgirotasi 2>/dev/null | grep -q '^package:'; then
              adb uninstall com.leventua.bilgirotasi
            fi
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.leventua.bilgirotasi
            adb shell monkey -p com.leventua.bilgirotasi -c android.intent.category.LAUNCHER 1 >/dev/null

            wait_marker() {
              marker="$1"
              for attempt in $(seq 1 90); do
                adb logcat -d > reports/QA_LOGCAT_LIVE.txt
                if grep -Fq "$marker" reports/QA_LOGCAT_LIVE.txt; then
                  return 0
                fi
                if grep -Fq '[WORD_HUNT_6X10_QA_FAIL]' reports/QA_LOGCAT_LIVE.txt; then
                  grep -F '[WORD_HUNT_6X10_QA_' reports/QA_LOGCAT_LIVE.txt >&2 || true
                  return 1
                fi
                sleep 1
              done
              echo "Marker timeout: $marker" >&2
              grep -F '[WORD_HUNT_6X10_QA_' reports/QA_LOGCAT_LIVE.txt >&2 || true
              return 1
            }

            for marker in \
              B1_OPEN B1_READY B1_RESULT \
              B5_OPEN B5_READY B5_RESULT \
              B8_OPEN B8_READY B8_RESULT \
              B10_OPEN B10_READY B10_RESULT; do
              full="[WORD_HUNT_6X10_QA_${marker}]"
              wait_marker "$full"
              adb exec-out screencap -p > "reports/ANDROID16_${marker}.png"
              test -s "reports/ANDROID16_${marker}.png"
            done

            wait_marker '[WORD_HUNT_6X10_QA_ALL_PASS]'
            adb shell dumpsys activity activities > reports/QA_ACTIVITY.txt
            adb logcat -d > reports/QA_LOGCAT.txt
            grep -F '[WORD_HUNT_6X10_QA_' reports/QA_LOGCAT.txt | tee reports/QA_MARKERS.txt
            grep -Fq '[WORD_HUNT_6X10_QA_B1_PASS]' reports/QA_MARKERS.txt
            grep -Fq '[WORD_HUNT_6X10_QA_B5_PASS]' reports/QA_MARKERS.txt
            grep -Fq '[WORD_HUNT_6X10_QA_B8_PASS]' reports/QA_MARKERS.txt
            grep -Fq '[WORD_HUNT_6X10_QA_B10_PASS]' reports/QA_MARKERS.txt
            grep -Fq '[WORD_HUNT_6X10_QA_ALL_PASS]' reports/QA_MARKERS.txt
            if grep -Fq '[WORD_HUNT_6X10_QA_FAIL]' reports/QA_MARKERS.txt; then
              exit 1
            fi
            if grep -E 'FATAL EXCEPTION|ANR in com\.leventua\.bilgirotasi|am_crash.*com\.leventua\.bilgirotasi' reports/QA_LOGCAT.txt; then
              echo 'Android runtime crash/ANR detected.' >&2
              exit 1
            fi

      - name: Upload QA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-6x10-Production-Android16-QA-${{ github.sha }}
          path: |
            reports/ANDROID16_*.png
            reports/QA_HEAD_SHA.txt
            reports/QA_APK_SHA256.txt
            reports/QA_ACTIVITY.txt
            reports/QA_LOGCAT.txt
            reports/QA_LOGCAT_LIVE.txt
            reports/QA_MARKERS.txt
          if-no-files-found: warn
          retention-days: 30
