name: Kelime Avi book asset tail repair QA

on:
  pull_request:
    branches:
      - qa/kelime-avi-book-tail-repair-base-1968-20260824
    paths:
      - 'test/word_hunt_book_tail_repair_trigger_test.dart'
      - '.github/workflows/word-hunt-book-tail-repair-qa.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  repair-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact QA head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify product parent and repair one missing tail byte
        shell: bash
        run: |
          set -euo pipefail
          asset='assets/word_hunt/baslangic_limani/book_button.webp'
          test -f "$asset"
          before=$(wc -c < "$asset")
          echo "BOOK_BYTES_BEFORE=$before"
          test "$before" -eq 11227
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/word_hunt/baslangic_limani/book_button.webp')
          data = p.read_bytes()
          if len(data) != 11227:
              raise SystemExit(f'unexpected book size: {len(data)}')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('book is not RIFF/WEBP')
          expected = int.from_bytes(data[4:8], 'little') + 8
          print(f'RIFF_EXPECTED_BYTES={expected}')
          if expected != 11228:
              raise SystemExit(f'unexpected RIFF expected size: {expected}')
          p.write_bytes(data + b'\x00')
          PY
          after=$(wc -c < "$asset")
          echo "BOOK_BYTES_AFTER=$after"
          test "$after" -eq 11228
          git diff --check

      - name: Decode repaired WebP with libwebp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y webp imagemagick
          asset='assets/word_hunt/baslangic_limani/book_button.webp'
          webpinfo "$asset" | tee /tmp/book-webpinfo.txt
          dwebp "$asset" -o /tmp/book.png
          identify /tmp/book.png | tee /tmp/book-identify.txt
          test -s /tmp/book.png

      - name: Decode all present Baslangic Limani WebP assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in assets/word_hunt/baslangic_limani/*.webp; do
            echo "VERIFY_ASSET=$asset"
            webpinfo "$asset" >/dev/null
            dwebp "$asset" -o /dev/null >/dev/null 2>&1
          done

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Analyze and focused Kelime Avi suite
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze lib/word_hunt
          flutter test \
            test/home_hub_prototype_test.dart \
            test/word_hunt_models_test.dart \
            test/word_hunt_path_test.dart \
            test/word_hunt_progress_codec_test.dart \
            test/word_hunt_progress_test.dart \
            test/word_hunt_production_assets_test.dart \
            test/word_hunt_route_stop_test.dart \
            test/word_hunt_reference_route_screen_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_route_map_v2_view_test.dart \
            test/word_hunt_route_map_view_test.dart \
            test/word_hunt_scoring_test.dart \
            test/word_hunt_starter_content_test.dart \
            --reporter expanded
          git diff --check

      - name: Commit only after repair passes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f test/word_hunt_book_tail_repair_trigger_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/word_hunt/baslangic_limani/book_button.webp test/word_hunt_book_tail_repair_trigger_test.dart
          git commit -m 'fix(kelime-avi): repair truncated book production asset'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Exact committed head verification
        shell: bash
        run: |
          set -euo pipefail
          asset='assets/word_hunt/baslangic_limani/book_button.webp'
          test "$(wc -c < "$asset")" -eq 11228
          webpinfo "$asset" >/dev/null
          dwebp "$asset" -o /dev/null >/dev/null 2>&1
          dart analyze lib/word_hunt
          flutter test \
            test/word_hunt_production_assets_test.dart \
            test/word_hunt_reference_route_screen_test.dart \
            --reporter expanded

      - name: Push tested repair to QA branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${HEAD_BRANCH}"
          echo "TESTED_COMMIT=${{ steps.commit.outputs.sha }}"
