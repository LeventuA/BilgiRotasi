name: Live Duel PR55 docs checkpoint

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.event.pull_request.head.ref == 'docs/live-duel-post-match-merge-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/live-duel-post-match-merge-20260818
          fetch-depth: 0

      - name: Update project memory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updates = {
              'docs/project-memory/BILGI_ROTASI_DURUM.md': '''## 0I. Canlı Düello maç sonu düzeltmesi / PR #55 — 18 Ağustos 2026

- Levent'in açık merge onayı sonrası PR #55 (`fix/live-duel-post-match-finalization-20260818`) Draft'tan çıkarıldı ve kanonik release dalına squash merge edildi.
- Merge commit'i / canlı release HEAD: `ac791563bd0f66563a44fdc84fd79479fbda65d4` — `fix: finalize Live Duel post-match flow (#55)`.
- Merge öncesi exact PR head `5f54cbb9b89d0670110a1dade631069e33d5273a`; AdMob PR doğrulaması run `32078088059` / #233: **SUCCESS**. Analyze+tüm Flutter testleri, release APK build, paket/manifest ve Android 16 final app gate PASS.
- Normal tamamlanan Canlı Düello sonucuna opt-in `SupportRewardCard` eklendi; kalıcı oyun kimliği `live_duel:<matchId>` kullanılır. Hükmen/forfeit tamamlanmada destek ödülü kartı gösterilmez.
- Bitmiş maçın stale `Yarım Kalan Düello` kartından yeniden açılması engellendi: resume navigation öncesi sunucudan yeniden doğrulama yapılır; lobby profil/resume yüklemesinde eski state temizlenir.
- İlk sonuç görünümündeki yanıltıcı `Bu maçın BR sonucu daha önce işlendi...` teknik metni kaldırıldı; backend BR idempotency davranışı değiştirilmedi.
- `assets/questions.json`, BR motoru, BoardMap/67 node/3B, production Firebase verisi ve production rewarded/SSV cutover değiştirilmedi. Sürüm `1.68.16+106`, `google_mobile_ads: 9.0.0` korunur.
- **Fiziksel kabul henüz yapılmadı.** Daha önce Play'e gönderilen `1.68.16+106` paketinin PR #55 merge'inden önce üretildiği için bu değişiklikleri içerdiği varsayılmayacak. Yeni Play dağıtım sürümü/versionCode kararı ve iki cihazlı maç sonu retest sonucu `DOĞRULANACAK`.
- `serverRewardXp` ↔ yerel XP uzlaştırması ve production rewarded SSV cutover ayrı açık iş olarak kalır; production rewarded bu merge ile etkinleştirilmedi.
- `KARARLAR.md` değişmedi; mevcut reklam kararı (tamamlanan oyun sonrası isteğe bağlı +10 XP, aynı oyun bir kez) uygulanmıştır.
''',
              'docs/project-memory/GOREV_HAVUZU.md': '''## 0H - 18 Ağustos 2026 PR #55 Canlı Düello maç sonu merge durumu

- **BR-P1-003 Durum:** PR #55 RELEASE'E MERGE EDİLDİ / OTOMATİK CI PASS / FİZİKSEL İKİ CİHAZ KABULÜ VE YENİ PLAY DAĞITIMI BEKLİYOR.
- Kanonik release `release/final-closed-test-aab-1.68.8`; merge commit / canlı HEAD `ac791563bd0f66563a44fdc84fd79479fbda65d4`; sürüm `1.68.16+106`.
- PR #55 final head `5f54cbb9b89d0670110a1dade631069e33d5273a`; AdMob PR doğrulaması #233 / run `32078088059`: **SUCCESS**. Analyze+tüm testler, release APK, paket/manifest ve Android 16 final app gate PASS.
- Normal tamamlanan Canlı Düello sonucuna `Bize destek olmak ister misiniz?` / +10 XP rewarded kartı bağlandı; gameId `live_duel:<matchId>`. Forfeit sonucu ödül hakkı üretmez.
- Stale bitmiş maç resume kartı server revalidation ile engellenir; lobby yüklemesinde eski profil/resume state temizlenir.
- `assets/questions.json`, BR motoru, BoardMap/67 node/3B ve production Firebase/AdMob cutover değişmedi.

**Bitti ölçütü:**

- [x] PR #55 minimum runtime/test diff'i ile hazırlandı.
- [x] Final PR head CI #233 tüm Flutter testleri + release APK + Android 16 final app gate ile PASS.
- [x] Levent açık merge onayı verdi.
- [x] PR #55 squash merge edildi; merge commit `ac791563bd0f66563a44fdc84fd79479fbda65d4`.
- [ ] PR #55 değişikliklerini gerçekten içeren yeni Play closed-test build/versionCode üretilip dağıtıma alınır; önceki `1.68.16+106` paket otomatik olarak yeterli sayılmaz.
- [ ] İki cihazda normal maç tamamlanır; sonuçta destek reklamı kartı görünür, stale `Yarım Kalan Düello` kartı geri gelmez ve BR/maç sayısı doğru yenilenir.
- [ ] Ayrı intentional leave/forfeit senaryosunda hükmen sonuç çalışır ve destek ödülü kartı gösterilmez.
- [ ] q1214/local soru bankası hatası yeni Play build'de tekrar etmez; ederse `assets/questions.json` kör yamalanmadan paketlenen bank/server catalog ayrımı yeniden kanıtlanır.
- [ ] Yalnız fiziksel kabul sonrası BR-P1-003 kapatılır.
''',
              'docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md': '''## PR #55 sonrası Canlı Düello fiziksel kabulü — AÇIK / DOĞRULANACAK

- PR #55 Levent'in açık onayıyla release'e squash merge edildi: `ac791563bd0f66563a44fdc84fd79479fbda65d4`.
- Otomatik final PR-head CI #233 / run `32078088059` **SUCCESS**; bu fiziksel Play kabulünün yerine geçmez.
- **DOĞRULANACAK:** PR #55'i içeren yeni Play closed-test build/versionCode. Daha önce yüklenen `1.68.16+106` AAB PR #55 merge'inden önce üretildi; bu nedenle maç sonu düzeltmesini içerdiği varsayılmaz.
- **DOĞRULANACAK:** iki cihazda normal maç sonunda opt-in destek reklamı kartının görünmesi; stale `Yarım Kalan Düello` kartının dönmemesi; BR/maç sayısının güncel görünmesi.
- **DOĞRULANACAK:** ayrı forfeit/leave senaryosunda destek ödülü kartının gösterilmemesi.
- **DOĞRULANACAK:** q1214/local soru bankası hatasının PR #55'i içeren yeni Play build'de tekrarlamaması.
- Production rewarded hâlâ kapalıdır. `serverRewardXp` ↔ yerel XP reconciliation ve gerçek AdMob SSV callback kabulü ayrı açık P0 işidir.
''',
          }

          for path_str, block in updates.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              heading = block.splitlines()[0]
              if heading in text:
                  continue
              split = text.find('\n\n')
              if split < 0:
                  raise SystemExit(f'header separator not found: {path_str}')
              insert_at = split + 2
              path.write_text(text[:insert_at] + block + '\n---\n\n' + text[insert_at:], encoding='utf-8')
          PY

          rm .github/workflows/docs-live-duel-55-checkpoint.yml
          git diff --check
          grep -F 'ac791563bd0f66563a44fdc84fd79479fbda65d4' docs/project-memory/BILGI_ROTASI_DURUM.md
          grep -F 'PR #55 RELEASE' docs/project-memory/GOREV_HAVUZU.md
          grep -F 'PR #55 sonrası Canlı Düello fiziksel kabulü' docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md

      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project-memory/BILGI_ROTASI_DURUM.md docs/project-memory/GOREV_HAVUZU.md docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md .github/workflows/docs-live-duel-55-checkpoint.yml
          git commit -m 'docs: record Live Duel post-match merge'
          git push origin HEAD:docs/live-duel-post-match-merge-20260818
