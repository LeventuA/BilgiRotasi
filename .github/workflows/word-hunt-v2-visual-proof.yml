name: Kelime Avi V2 Visual Proof

on:
  push:
    branches:
      - feat/word-hunt-visual-map-v2-20260820
    paths:
      - 'lib/word_hunt/**'
      - 'test/word_hunt_route_map_v2_test.dart'
      - 'assets/word_hunt/**'
      - 'pubspec.yaml'
      - 'lib/visual_proof_main.dart'
      - '.github/workflows/word-hunt-v2-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android16-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Focused analyze
        run: flutter analyze lib/word_hunt/word_hunt_route_map_v2_screen.dart lib/visual_proof_main.dart test/word_hunt_route_map_v2_test.dart

      - name: Focused route tests
        run: flutter test test/word_hunt_route_map_v2_test.dart test/word_hunt_route_map_view_test.dart

      - name: Build isolated visual-proof APK
        run: flutter build apk --debug -t lib/visual_proof_main.dart

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am force-stop com.leventua.bilgirotasi
            adb shell monkey -p com.leventua.bilgirotasi -c android.intent.category.LAUNCHER 1
            sleep 8
            mkdir -p visual-proof
            adb exec-out screencap -p > visual-proof/baslangic-limani-v2-top.png
            adb shell input swipe 540 1800 540 650 650
            sleep 2
            adb exec-out screencap -p > visual-proof/baslangic-limani-v2-mid.png
            adb shell input swipe 540 1800 540 650 650
            sleep 2
            adb exec-out screencap -p > visual-proof/baslangic-limani-v2-bottom.png
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|com.leventua.bilgirotasi' > visual-proof/activity.txt || true
            adb logcat -d | grep -Ei 'FATAL EXCEPTION|ANR in|Process: com.leventua.bilgirotasi|AndroidRuntime' > visual-proof/crash-scan.txt || true
            test -s visual-proof/baslangic-limani-v2-top.png
            test -s visual-proof/baslangic-limani-v2-mid.png
            test -s visual-proof/baslangic-limani-v2-bottom.png

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kelime-avi-v2-android16-visual-proof
          path: visual-proof/
          if-no-files-found: warn
          retention-days: 7
