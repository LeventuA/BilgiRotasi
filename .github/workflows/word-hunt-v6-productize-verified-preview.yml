name: Kelime Avi V6 productize verified preview

on:
  push:
    branches:
      - qa/kelime-avi-v5-reference-android16-proof-20260831
    paths:
      - '.github/workflows/word-hunt-v6-productize-verified-preview.yml'

permissions:
  contents: write

jobs:
  productize-tested-preview:
    runs-on: ubuntu-22.04
    env:
      PRODUCT_BRANCH: fix/kelime-avi-v6-visual-found-state-20260901
      PRODUCT_BASE_SHA: d70dc2739b5c9552189bd7fef11ce3f3af4cc238
      BASE_FILE_BLOB: e3fc4c50b8d5600c6b111a91313c6a47d7c98653
      VERIFIED_PREVIEW_BLOB_PREFIX: d415876

    steps:
      - name: Checkout clean product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0

      - name: Checkout exact QA tools
        uses: actions/checkout@v4
        with:
          ref: qa/kelime-avi-v5-reference-android16-proof-20260831
          path: qa-tools
          fetch-depth: 1

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Verify exact clean base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE_SHA"
          test "$(git hash-object lib/word_hunt/word_hunt_screens.dart)" = "$BASE_FILE_BLOB"
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          grep -q '^const _harborGridSpacing = 1\.5;$' lib/word_hunt/word_hunt_screens.dart
          test "$(git diff --name-only -- assets/questions.json lib/main.dart assets/word_hunt/v5_reference_assets | wc -l)" -eq 0

      - name: Apply exact Android-tested preview semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 qa-tools/tools/qa/word_hunt_v5_layout_preview_patch.py
          dart format lib/word_hunt/word_hunt_screens.dart
          FINAL_BLOB="$(git hash-object lib/word_hunt/word_hunt_screens.dart)"
          echo "FINAL_FILE_BLOB=$FINAL_BLOB"
          case "$FINAL_BLOB" in
            "$VERIFIED_PREVIEW_BLOB_PREFIX"*) ;;
            *) echo "Expected verified preview blob prefix $VERIFIED_PREVIEW_BLOB_PREFIX, got $FINAL_BLOB" >&2; exit 41 ;;
          esac

      - name: Static and focused test gate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze lib/word_hunt
          flutter test test/word_hunt_*_test.dart
          git diff --check
          grep -q '^const _harborGridSpacing = 1\.5;$' lib/word_hunt/word_hunt_screens.dart
          grep -q '^const _harborCellVisualScale = 1\.12;$' lib/word_hunt/word_hunt_screens.dart
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'lib/word_hunt/word_hunt_screens.dart'
          test "$(git diff --name-only -- assets/questions.json lib/main.dart assets/word_hunt/v5_reference_assets | wc -l)" -eq 0

      - name: Commit exact verified product candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/word_hunt/word_hunt_screens.dart
          git diff --cached --check
          git commit -m 'fix(kelime-avi): productize verified V6 cell visuals'
          git push origin HEAD:"$PRODUCT_BRANCH"
