name: TMP Kelime Avi clean viewport diff

on:
  push:
    branches:
      - fix/kelime-avi-6x10-fit-viewport-20260828

permissions:
  contents: write

jobs:
  clean-test-android16:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact fix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Restore canonical product files and apply narrow fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/kelime-avi-content-pass-v1-20260828
          git restore --source=origin/feat/kelime-avi-content-pass-v1-20260828 -- \
            lib/word_hunt/word_hunt_screens.dart \
            test/word_hunt_level_production_test.dart
          python3 tools/tmp_word_hunt_fit_cleanup.py
          git diff --check
          echo 'Narrow diff stat:'
          git diff --stat -- \
            lib/word_hunt/word_hunt_screens.dart \
            test/word_hunt_level_production_test.dart
          echo 'Narrow diff numstat:'
          git diff --numstat -- \
            lib/word_hunt/word_hunt_screens.dart \
            test/word_hunt_level_production_test.dart

      - name: Focused analysis and tests
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze lib/word_hunt
          flutter test \
            test/word_hunt_starter_content_test.dart \
            test/word_hunt_level_one_engine_test.dart \
            test/word_hunt_level_production_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_production_flow_test.dart \
            --reporter expanded
          git diff --check

      - name: Create temporary Android16 B10 QA entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cat > lib/word_hunt/word_hunt_fit_qa_main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          import 'word_hunt_screens.dart';
          import 'word_hunt_starter_content.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations(<DeviceOrientation>[
              DeviceOrientation.portraitUp,
            ]);
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);

            final level = WordHuntStarterContent.baslangicLimani.levels[9];
            debugPrint(
              '[WORD_HUNT_FIT_QA_CONFIG] level=10 rows=${level.rowCount} '
              'cols=${level.columnCount} targets=${level.targetWords.length} '
              'bonus=${level.bonusWords.length}',
            );

            runApp(
              MaterialApp(
                debugShowCheckedModeBanner: false,
                home: WordHuntLevelProductionScreen(
                  level: level,
                  infoCards: WordHuntStarterContent.infoCards,
                ),
              ),
            );

            WidgetsBinding.instance.addPostFrameCallback((_) {
              debugPrint('[WORD_HUNT_FIT_QA_READY] level=10');
            });
          }
          DART
          flutter build apk --debug \
            -t lib/word_hunt/word_hunt_fit_qa_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Prepare Android emulator KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Capture clean fitted B10 on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            set -eu
            mkdir -p reports
            if adb shell pm path com.leventua.bilgirotasi 2>/dev/null | grep -q '^package:'; then adb uninstall com.leventua.bilgirotasi; fi
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.leventua.bilgirotasi
            adb shell monkey -p com.leventua.bilgirotasi -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 8
            adb exec-out screencap -p > reports/B10_FIT_CLEAN_ANDROID16.png
            adb shell uiautomator dump /sdcard/b10_fit_clean.xml >/dev/null 2>&1 || true
            adb pull /sdcard/b10_fit_clean.xml reports/B10_FIT_CLEAN_UI.xml >/dev/null 2>&1 || true
            adb shell wm size > reports/WM_SIZE.txt
            adb shell wm density > reports/WM_DENSITY.txt
            adb logcat -d > reports/LOGCAT.txt
            test -s reports/B10_FIT_CLEAN_ANDROID16.png
            test "$(wc -c < reports/B10_FIT_CLEAN_ANDROID16.png)" -gt 50000
            grep -Fq '[WORD_HUNT_FIT_QA_CONFIG] level=10 rows=10 cols=6 targets=9 bonus=1' reports/LOGCAT.txt
            grep -Fq '[WORD_HUNT_FIT_QA_READY] level=10' reports/LOGCAT.txt
            grep -Fq '0/9' reports/B10_FIT_CLEAN_UI.xml
            if grep -E 'FATAL EXCEPTION|ANR in com\.leventua\.bilgirotasi|am_crash.*com\.leventua\.bilgirotasi' reports/LOGCAT.txt; then echo 'Kelime Avi clean viewport QA process failure detected.' >&2; exit 1; fi

      - name: Upload clean fitted Android16 proof
        uses: actions/upload-artifact@v4
        with:
          name: KelimeAvi-B10-6x10-clean-fit-Android16-${{ github.sha }}
          path: |
            reports/B10_FIT_CLEAN_ANDROID16.png
            reports/B10_FIT_CLEAN_UI.xml
            reports/WM_SIZE.txt
            reports/WM_DENSITY.txt
            reports/LOGCAT.txt
          retention-days: 7

      - name: Commit clean verified viewport fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f lib/word_hunt/word_hunt_fit_qa_main.dart
          git rm .github/workflows/tmp-word-hunt-fit-cleanup.yml tools/tmp_word_hunt_fit_cleanup.py
          git add lib/word_hunt/word_hunt_screens.dart test/word_hunt_level_production_test.dart
          git diff --cached --check
          echo 'Final staged diff:'
          git diff --cached --stat
          git config user.name 'ZMilaStudio'
          git config user.email 'levent.ua@gmail.com'
          git commit -m 'chore(kelime-avi): narrow viewport fix diff'
          git push origin HEAD:fix/kelime-avi-6x10-fit-viewport-20260828
