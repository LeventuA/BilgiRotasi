name: Gokyuzu R7 visual pass docs checkpoint
on:
  push:
    branches:
      - ci/gokyuzu-r7-docs-checkpoint-20260905
permissions:
  contents: write
jobs:
  update-docs:
    runs-on: ubuntu-22.04
    env:
      DOCS_BRANCH: docs/kelime-avi-v8-final-checkpoint-20260903
      DOCS_START: c9cfb9d9175276ad079b8291977dcf32b34ebbab
      CANONICAL_SHA: 3557a7e4f2f2917d61ba61866c6d4c8561994667
      PRODUCT_SHA: f35082c44e637cb7e6e3815c7d54d38a58b776df
    steps:
      - name: Checkout exact docs branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_BRANCH }}
          fetch-depth: 0
      - name: Verify live refs and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DOCS_START"
          test "$(git rev-parse origin/release/final-closed-test-aab-1.68.8)" = "$CANONICAL_SHA"
          test "$(git rev-parse origin/feat/kelime-avi-gokyuzu-master-art-v2-20260905)" = "$PRODUCT_SHA"
          test "$(git show "$CANONICAL_SHA:pubspec.yaml" | grep '^version:' | awk '{print $2}')" = '1.68.19+109'
      - name: Record R7 visual PASS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          blocks = {
            'BILGI_ROTASI_DURUM.md': '''<!-- GOKYUZU_R7_VISUAL_PASS_START -->
## Kelime Avı V9 — Gökyüzü R7 human visual PASS checkpoint — 6 Eylül 2026
- Canonical release ve sürüm yeniden doğrulandı: `release/final-closed-test-aab-1.68.8` @ `3557a7e4f2f2917d61ba61866c6d4c8561994667`; sürüm `1.68.19+109`.
- PR #175 **OPEN / DRAFT / mergeable=true**; exact ürün HEAD `f35082c44e637cb7e6e3815c7d54d38a58b776df`. Ready/merge/Play yok.
- Android16 teknik kapı PASS: run `33972011069`, job `101322071661`; screenshot SHA256 `79edc57a575d2bdf59407260fe272993e69400a23d520687ac71680d58228637`; artifact `9971319096`.
- Levent exact raw R7 Android ekranı için açıkça **PASS** verdi.
- `GOKYUZU_R7_HUMAN_VISUAL = PASS`.
- Sonraki açık kapı: `GOKYUZU_R7_REAL_DEVICE_APK = AÇIK / FİZİKSEL CİHAZ KABULÜ BEKLİYOR`.
- PR #175 Ready/merge yalnız ayrıca açık Levent onayıyla yapılır. Play yükleme/yayınlama ayrıca açık onay gerektirir.
<!-- GOKYUZU_R7_VISUAL_PASS_END -->

''',
            'GOREV_HAVUZU.md': '''<!-- GOKYUZU_R7_VISUAL_PASS_START -->
## AKTİF — Gökyüzü R7 gerçek cihaz APK acceptance
**Görev:** Görsel PASS almış exact ürün HEAD `f35082c44e637cb7e6e3815c7d54d38a58b776df` için gerçek cihaz APK fiziksel kabulünü tamamlamak.

**Mevcut kanıt:** Levent exact raw Android ekranını **PASS** etti. Android16 teknik kanıtı PASS: run `33972011069` / job `101322071661`; analyzer temiz; focused + Başlangıç Limanı regression **39/39 PASS**; screenshot SHA256 `79edc57a575d2bdf59407260fe272993e69400a23d520687ac71680d58228637`.

**Bitti ölçütü:**
1. Aynı exact ürün build'i gerçek cihazda APK olarak kurulur ve fiziksel olarak kabul edilir.
2. PR #175 Ready/merge yalnız ayrıca açık Levent onayıyla yapılır.
3. Play yükleme/yayınlama ayrıca açık onay gerektirir.

**Durum:** `AÇIK / FİZİKSEL CİHAZ KABULÜ BEKLİYOR`.
<!-- GOKYUZU_R7_VISUAL_PASS_END -->

''',
            'docs/project-memory/GENEL_PROJE_OZETI.md': '''<!-- GOKYUZU_R7_VISUAL_PASS_START -->
## 6 Eylül 2026 — Gökyüzü Adaları R7 görsel kabul PASS
- Current ürün PR #175 / `f35082c44e637cb7e6e3815c7d54d38a58b776df` için Levent exact raw Android16 ekranını açıkça **PASS** etti.
- `GOKYUZU_R7_ANDROID16_TECHNICAL = PASS` ve `GOKYUZU_R7_HUMAN_VISUAL = PASS`.
- Current açık kapı gerçek cihaz APK fiziksel kabulüdür. Ready/merge ve Play ayrıca açık onay gerektirir.
<!-- GOKYUZU_R7_VISUAL_PASS_END -->

''',
            'docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md': '''<!-- GOKYUZU_R7_VISUAL_PASS_START -->
## GOKYUZU_R7_HUMAN_VISUAL — KAPANDI
- Current ürün: PR #175 / `f35082c44e637cb7e6e3815c7d54d38a58b776df`.
- Levent current R7 raw Android görünümünü açıkça **PASS** etti.

## GOKYUZU_R7_REAL_DEVICE_APK — AÇIK
- **DOĞRULANACAK:** Aynı exact ürün build'i gerçek cihaz APK olarak fiziksel kabul alıyor mu?
- **AÇIK:** PR #175 Ready/merge; ayrıca açık Levent onayı gerekir.
- **AÇIK:** Play yükleme/yayınlama; ayrıca açık Levent onayı gerekir.
<!-- GOKYUZU_R7_VISUAL_PASS_END -->

''',
          }
          marker = '<!-- GOKYUZU_R7_VISUAL_PASS_START -->'
          for name, block in blocks.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  p.write_text(block + text, encoding='utf-8')
          PY
      - name: Validate docs-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t paths < <(git diff --name-only)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 4
          printf '%s\n' "${paths[@]}" | grep -qx 'BILGI_ROTASI_DURUM.md'
          printf '%s\n' "${paths[@]}" | grep -qx 'GOREV_HAVUZU.md'
          printf '%s\n' "${paths[@]}" | grep -qx 'docs/project-memory/GENEL_PROJE_OZETI.md'
          printf '%s\n' "${paths[@]}" | grep -qx 'docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md'
          test -z "$(git diff --name-only -- assets/questions.json android/ pubspec.yaml lib/ test/ docs/project-memory/KARARLAR.md || true)"
      - name: Commit and push docs checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BILGI_ROTASI_DURUM.md GOREV_HAVUZU.md docs/project-memory/GENEL_PROJE_OZETI.md docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md
          git commit -m 'docs(kelime-avi): record gokyuzu r7 visual pass'
          git push origin HEAD:"$DOCS_BRANCH"
