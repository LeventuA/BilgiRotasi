name: Perspektif Tahta APK

on:
  push:
    branches:
      - experiment/perspective-board-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ayrı test uygulamasını hazırla
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import copy
          import json
          import re

          package_name = "com.leventua.bilgirotasi.perspective"

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)debug[ \t]*\{[ \t]*\n'
              r'(?P<body>[ \t]*)manifestPlaceholders\["admobAppId"\]'
              r'[ \t]*=[ \t]*adMobTestAppId[ \t]*\n'
              r'(?P=indent)\}'
          )

          match = pattern.search(text)
          if match is None:
              raise SystemExit("Debug yapılandırması bulunamadı.")

          indent = match.group("indent")
          body = match.group("body")

          new_block = (
              f'{indent}debug {{\n'
              f'{body}applicationIdSuffix = ".perspective"\n'
              f'{body}versionNameSuffix = "-perspective"\n'
              f'{body}manifestPlaceholders["admobAppId"] = adMobTestAppId\n'
              f'{indent}}}'
          )

          text = (
              text[:match.start()]
              + new_block
              + text[match.end():]
          )
          gradle.write_text(text, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text(encoding="utf-8")

          old_label = 'android:label="Bilgi Rotası"'
          new_label = 'android:label="Bilgi Rotası Perspektif Testi"'

          if old_label not in manifest_text:
              raise SystemExit("Uygulama etiketi bulunamadı.")

          manifest.write_text(
              manifest_text.replace(old_label, new_label, 1),
              encoding="utf-8",
          )

          services = Path("android/app/google-services.json")
          data = json.loads(services.read_text(encoding="utf-8"))

          original = next(
              client
              for client in data["client"]
              if client["client_info"]["android_client_info"][
                  "package_name"
              ] == "com.leventua.bilgirotasi"
          )

          data["client"] = [
              client
              for client in data["client"]
              if client["client_info"]["android_client_info"][
                  "package_name"
              ] != package_name
          ]

          test_client = copy.deepcopy(original)
          test_client["client_info"]["android_client_info"][
              "package_name"
          ] = package_name

          test_client["oauth_client"] = [
              item
              for item in test_client.get("oauth_client", [])
              if item.get("client_type") == 3
          ]

          data["client"].append(test_client)

          services.write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          properties = Path("android/gradle.properties")
          existing = (
              properties.read_text(encoding="utf-8")
              if properties.exists()
              else ""
          )

          blocked = (
              "org.gradle.jvmargs=",
              "org.gradle.daemon=",
              "org.gradle.parallel=",
              "org.gradle.workers.max=",
              "kotlin.compiler.execution.strategy=",
          )

          lines = [
              line
              for line in existing.splitlines()
              if not line.strip().startswith(blocked)
          ]

          lines.extend([
              "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8",
              "org.gradle.daemon=false",
              "org.gradle.parallel=false",
              "org.gradle.workers.max=1",
              "kotlin.compiler.execution.strategy=in-process",
          ])

          properties.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: ARM64 test APK oluştur
        run: |
          flutter build apk \
            --debug \
            --no-pub \
            --target-platform android-arm64

          cp build/app/outputs/flutter-apk/app-debug.apk \
            BilgiRotasi-Perspektif-Testi.apk

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-Perspektif-Testi
          path: BilgiRotasi-Perspektif-Testi.apk
          retention-days: 7
