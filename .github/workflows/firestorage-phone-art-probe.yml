name: Firestorage phone art probe
on:
  push:
    branches:
      - ci/firestorage-phone-art-probe-20260905
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe public share JavaScript
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai'
          page='/ja/f/IWUhJbA1rdRk'
          curl -L --fail --silent --show-error "$base$page" -o /tmp/page.html
          chunk=$(grep -o '/_next/static/chunks/app/(files)/ja/f/page-[^" ]*\.js' /tmp/page.html | head -n1)
          echo "CHUNK=$chunk"
          test -n "$chunk"
          curl -L --fail --silent --show-error "$base$chunk" -o /tmp/chunk.js
          echo '=== CHUNK SIZE ==='
          wc -c /tmp/chunk.js
          echo '=== API CANDIDATES ==='
          python3 - <<'PY'
          import re
          s=open('/tmp/chunk.js',encoding='utf-8').read()
          pats=[r'.{0,180}/api/.{0,260}',r'.{0,180}download.{0,260}',r'.{0,180}share.{0,260}',r'.{0,180}public.{0,260}']
          seen=set()
          for p in pats:
              for m in re.findall(p,s,re.I):
                  x=m.replace('\\n',' ')
                  if x not in seen:
                      seen.add(x); print(x[:700])
                  if len(seen)>=100: raise SystemExit
          PY
