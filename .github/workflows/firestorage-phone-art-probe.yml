name: Firestorage phone art probe
on:
  push:
    branches:
      - ci/firestorage-phone-art-probe-20260905
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe firestorage client chunks
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai'
          curl -LfsS "$base/ja/f/IWUhJbA1rdRk" -o /tmp/page.html
          echo '=== SCRIPT CHUNKS ==='
          grep -o 'src="[^"]*\.js"' /tmp/page.html | sed 's/^src="//;s/"$//' | tee /tmp/chunks.txt
          while read -r chunk; do
            name=$(basename "$chunk")
            curl -LfsS "$base$chunk" -o "/tmp/$name"
            echo "=== $chunk $(wc -c < "/tmp/$name") bytes ==="
            python3 - "$name" <<'PY'
          import re,sys
          s=open('/tmp/'+sys.argv[1],encoding='utf-8').read()
          for p in [r'.{0,180}/api/.{0,280}',r'.{0,180}download.{0,280}',r'.{0,180}share.{0,280}',r'.{0,180}token.{0,280}',r'.{0,180}presign.{0,280}']:
              for m in re.findall(p,s,re.I): print(m[:800])
          PY
          done < /tmp/chunks.txt
