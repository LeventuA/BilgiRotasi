name: Kelime Avi asset-first normal locked apply

on:
  push:
    branches:
      - feat/kelime-avi-baslangic-limani-asset-first-20260824
    paths:
      - ".github/workflows/kelime-avi-asset-first-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout asset-first branch
        uses: actions/checkout@v4
        with:
          ref: feat/kelime-avi-baslangic-limani-asset-first-20260824
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply deterministic asset-first patch
        run: |
          python3 tools/kelime_avi_asset_first_apply.py
          rm -f .github/workflows/kelime-avi-asset-first-apply.yml
          rm -f tools/kelime_avi_asset_first_apply.py
          dart format lib/word_hunt/word_hunt_route_stop.dart test/word_hunt_route_stop_test.dart

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Focused Kelime Avi tests
        run: |
          flutter test \
            test/word_hunt_production_assets_test.dart \
            test/word_hunt_route_stop_test.dart \
            test/word_hunt_reference_route_screen_test.dart

      - name: Analyze Kelime Avi source
        run: dart analyze lib/word_hunt

      - name: Diff check
        run: git diff --check

      - name: Scope guard
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/kelime-avi-asset-first-apply.yml",
              "tools/kelime_avi_asset_first_apply.py",
              "lib/word_hunt/word_hunt_route_stop.dart",
              "test/word_hunt_route_stop_test.dart",
              "docs/project-memory/BILGI_ROTASI_DURUM.md",
              "docs/project-memory/GOREV_HAVUZU.md",
              "docs/project-memory/KARARLAR.md",
              "docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md",
              "docs/project-memory/GENEL_PROJE_OZETI.md",
          }
          changed = set()
          for line in subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines():
              changed.add(line[3:])
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit("Unexpected files in apply scope: " + ", ".join(unexpected))
          print("Scope PASS")
          for path in sorted(changed):
              print("-", path)
          PY

      - name: Commit tested asset-backed render
        run: |
          git add -A
          git diff --cached --check
          git commit -m "feat(kelime-avi): render normal harbor stops from production assets"
          git push origin HEAD:feat/kelime-avi-baslangic-limani-asset-first-20260824
