name: Gokyuzu R7 Real Device APK

on:
  push:
    branches:
      - qa/gokyuzu-real-device-apk-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PRODUCT_SHA: f35082c44e637cb7e6e3815c7d54d38a58b776df
      CANONICAL_SHA: 3557a7e4f2f2917d61ba61866c6d4c8561994667
      CONTENT_SHA: 4ec33de7438fcbd15ed63b1ae2adda127da3be8c
      MASTER_ART_SHA256: 913ee19df9fcb1eba2ac6ca3a500979c960d31dd369e204d2f79064be9664b1d
      QA_PACKAGE: com.leventua.bilgirotasi.gokyuzur7qa
      QA_WORKFLOW: .github/workflows/gokyuzu-r7-real-device-apk.yml

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact product base and protected scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          test "$(git rev-parse origin/release/final-closed-test-aab-1.68.8)" = "$CANONICAL_SHA"
          test "$(git show "$CANONICAL_SHA:pubspec.yaml" | grep '^version:' | awk '{print $2}')" = '1.68.19+109'
          test -z "$(git diff --name-only "$CANONICAL_SHA" "$PRODUCT_SHA" -- assets/questions.json android/ pubspec.yaml || true)"
          mapfile -t qa_paths < <(git diff --name-only "$PRODUCT_SHA" HEAD)
          test "${#qa_paths[@]}" -eq 1
          test "${qa_paths[0]}" = "$QA_WORKFLOW"
          test "$(sha256sum assets/word_hunt/gokyuzu_adalari_master_art_v2.webp | cut -d' ' -f1)" = "$MASTER_ART_SHA256"

      - name: Inject exact DRAFT content into QA workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTENT_SHA"
          git show "$CONTENT_SHA:lib/word_hunt/word_hunt_gokyuzu_content.dart" > lib/word_hunt/word_hunt_gokyuzu_content.dart
          test "$(git hash-object lib/word_hunt/word_hunt_gokyuzu_content.dart)" = '4070a85e7fbac5fda0d3967815cea7c673322a61'

      - name: Create isolated QA entrypoint
        shell: bash
        run: |
          cat > lib/word_hunt/gokyuzu_r7_real_device_qa_main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'word_hunt_gokyuzu_content.dart';
          import 'word_hunt_production_entry_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            debugPrint('[GOKYUZU_R7_REAL_DEVICE_READY]');
            runApp(
              const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: WordHuntProductionEntryScreen(
                  route: WordHuntGokyuzuContent.gokyuzuAdalari,
                  infoCards: WordHuntGokyuzuContent.infoCards,
                ),
              ),
            );
          }
          DART

      - name: Make QA APK install alongside Play app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          pattern = r'(?m)^(\s*)debug \{\n\1\s+manifestPlaceholders\["admobAppId"\] = adMobTestAppId\n\1\}'
          replacement = (
              '        debug {\n'
              '            applicationIdSuffix = ".gokyuzur7qa"\n'
              '            manifestPlaceholders["admobAppId"] = adMobTestAppId\n'
              '        }'
          )
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('debug buildType anchor not found')
          gradle.write_text(text, encoding='utf-8')

          google = Path('android/app/google-services.json')
          gtext = google.read_text(encoding='utf-8')
          old = 'com.leventua.bilgirotasi'
          new = 'com.leventua.bilgirotasi.gokyuzur7qa'
          if old not in gtext:
              raise SystemExit('google-services package anchor not found')
          google.write_text(gtext.replace(old, new), encoding='utf-8')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Analyze and focused regression
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          git checkout -- pubspec.lock 2>/dev/null || true
          dart format lib/word_hunt/gokyuzu_r7_real_device_qa_main.dart
          git diff --check
          dart analyze lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart lib/word_hunt/word_hunt_production_entry_screen.dart lib/word_hunt/word_hunt_progress.dart lib/word_hunt/word_hunt_gokyuzu_content.dart lib/word_hunt/gokyuzu_r7_real_device_qa_main.dart
          flutter test test/word_hunt_gokyuzu_master_art_screen_test.dart test/word_hunt_progress_test.dart test/word_hunt_pixel_proof_screen_test.dart test/word_hunt_reference_route_screen_test.dart test/word_hunt_production_flow_test.dart --reporter expanded

      - name: Build side-by-side real-device APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug -t lib/word_hunt/gokyuzu_r7_real_device_qa_main.dart --dart-define=ADMOB_ENVIRONMENT=test
          src='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$src"
          mkdir -p gokyuzu_r7_real_device
          cp "$src" gokyuzu_r7_real_device/BilgiRotasi-Gokyuzu-R7-RealDevice-Test.apk
          unzip -p "$src" assets/flutter_assets/assets/word_hunt/gokyuzu_adalari_master_art_v2.webp > gokyuzu_r7_real_device/gokyuzu_adalari_master_art_v2.packaged.webp
          cmp -s assets/word_hunt/gokyuzu_adalari_master_art_v2.webp gokyuzu_r7_real_device/gokyuzu_adalari_master_art_v2.packaged.webp
          sha256sum gokyuzu_r7_real_device/BilgiRotasi-Gokyuzu-R7-RealDevice-Test.apk | tee gokyuzu_r7_real_device/APK_SHA256.txt
          printf '%s\n' "$PRODUCT_SHA" > gokyuzu_r7_real_device/PRODUCT_SHA.txt
          printf '%s\n' "$CONTENT_SHA" > gokyuzu_r7_real_device/CONTENT_SHA.txt
          printf '%s\n' "$MASTER_ART_SHA256" > gokyuzu_r7_real_device/MASTER_ART_SHA256.txt
          printf '%s\n' "$QA_PACKAGE" > gokyuzu_r7_real_device/QA_PACKAGE.txt

      - name: Prepare Android 16 KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Verify exact APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            set -e
            mkdir -p gokyuzu_r7_real_device
            apk='gokyuzu_r7_real_device/BilgiRotasi-Gokyuzu-R7-RealDevice-Test.apk'
            adb shell wm size 1080x1920
            adb install -r "$apk"
            adb logcat -c
            adb shell am force-stop "$QA_PACKAGE"
            adb shell monkey -p "$QA_PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 10
            adb shell dumpsys activity activities > gokyuzu_r7_real_device/ACTIVITY.txt
            adb shell uiautomator dump /sdcard/gokyuzu_r7_real_device_ui.xml >/dev/null
            adb pull /sdcard/gokyuzu_r7_real_device_ui.xml gokyuzu_r7_real_device/UI.xml >/dev/null
            adb exec-out screencap -p > gokyuzu_r7_real_device/ANDROID16_RAW.png
            adb logcat -d > gokyuzu_r7_real_device/LOGCAT.txt
            grep -q 'GOKYUZU_R7_REAL_DEVICE_READY' gokyuzu_r7_real_device/LOGCAT.txt
            grep -Eq "mResumedActivity.*${QA_PACKAGE}|topResumedActivity=.*${QA_PACKAGE}|mCurrentFocus=.*${QA_PACKAGE}" gokyuzu_r7_real_device/ACTIVITY.txt
            grep -q 'Bölüm 1' gokyuzu_r7_real_device/UI.xml
            grep -q 'Pusula' gokyuzu_r7_real_device/UI.xml
            grep -q 'Bilgi Kitabı' gokyuzu_r7_real_device/UI.xml
            ! grep -Eq "FATAL EXCEPTION|ANR in ${QA_PACKAGE}|am_crash.*${QA_PACKAGE}|am_proc_died.*${QA_PACKAGE}|A RenderFlex overflowed|FlutterError" gokyuzu_r7_real_device/LOGCAT.txt
            sha256sum gokyuzu_r7_real_device/ANDROID16_RAW.png | tee gokyuzu_r7_real_device/SCREENSHOT_SHA256.txt

      - name: Upload physical-device acceptance package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-Gokyuzu-R7-RealDevice-Test
          path: gokyuzu_r7_real_device/
          if-no-files-found: error
          retention-days: 14
