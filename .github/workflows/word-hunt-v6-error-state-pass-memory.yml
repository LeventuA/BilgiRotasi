name: Kelime Avi V6 error-state PASS memory

on:
  push:
    branches:
      - qa/kelime-avi-v6-error-state-red-productize-20260901
    paths:
      - '.github/workflows/word-hunt-v6-error-state-pass-memory.yml'
      - 'tools/qa/record_v6_error_state_pass_memory.py'

permissions:
  contents: write

jobs:
  record-pass:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PRODUCT_BRANCH: fix/kelime-avi-v6-error-state-red-clean-20260901
      PRODUCT_SHA: 0d845fc75bbe7b92c3d778ccfbcbde2761fa56de

    steps:
      - name: Checkout exact accepted product checkpoint
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Checkout PASS memory QA helper
        uses: actions/checkout@v4
        with:
          ref: qa/kelime-avi-v6-error-state-red-productize-20260901
          path: qa-tools

      - name: Update and validate project memory
        shell: bash
        run: |
          set -euo pipefail
          python3 qa-tools/tools/qa/record_v6_error_state_pass_memory.py
          grep -q 'ERROR_STATE_VISUAL = PASS / CLOSED' docs/project-memory/BILGI_ROTASI_DURUM.md
          grep -q '## 0B. Kelime Avı V6 error-state görsel kararı' docs/project-memory/KARARLAR.md
          grep -q '\[x\] `ERROR_STATE_VISUAL` raw Android 16' docs/project-memory/GOREV_HAVUZU.md
          grep -q 'ERROR_STATE_VISUAL` raw Android 16 + kullanıcı kabulü' docs/project-memory/GENEL_PROJE_OZETI.md
          grep -q 'KAPANDI — `ERROR_STATE_VISUAL`' docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          git diff --check

      - name: Commit PASS checkpoint to product branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md docs/project-memory/BILGI_ROTASI_DURUM.md docs/project-memory/GENEL_PROJE_OZETI.md docs/project-memory/GOREV_HAVUZU.md docs/project-memory/KARARLAR.md | sort)"
          test "$changed" = "$expected"
          git diff --check
          git config user.name 'ZMilaStudio'
          git config user.email 'levent.ua@gmail.com'
          git add docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md docs/project-memory/BILGI_ROTASI_DURUM.md docs/project-memory/GENEL_PROJE_OZETI.md docs/project-memory/GOREV_HAVUZU.md docs/project-memory/KARARLAR.md
          git commit -m 'docs(kelime-avi): record V6 error-state visual pass'
          git push origin HEAD:refs/heads/$PRODUCT_BRANCH
          echo "DOCS_COMMIT=$(git rev-parse HEAD)"
