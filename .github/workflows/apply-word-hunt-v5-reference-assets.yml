name: Kelime Avi V5 approved reference asset integration

on:
  push:
    branches:
      - feat/kelime-avi-v5-reference-assets-integration-20260831
    paths:
      - .github/workflows/apply-word-hunt-v5-reference-assets.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/kelime-avi-v5-reference-assets-integration-20260831
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify exact approved asset hashes
        run: |
          cat > /tmp/v5-assets.sha256 <<'EOF'
          0482adfa9ce8b2eb3b3637a7ef9976984650368a43f539f999842437a69d4368  assets/word_hunt/v5_reference_assets/harbor_background_1080x1920.png
          052ac36a48cd0bac06bfbd6221e28c77bd32a4b1e9f08ded0e7fabefbf56c529  assets/word_hunt/v5_reference_assets/cell_idle.png
          57d620263cae231c4b8983cc8fab7732db7733a78fae9e620abaaec7dc8aac87  assets/word_hunt/v5_reference_assets/cell_selected_found.png
          0f5fd5aac1f94fa644a3f19c4147e2747fd639b0041a12e94df8198201fc95f4  assets/word_hunt/v5_reference_assets/status_panel_empty.png
          90d15d496a1a22fdee1014ffc2921ef8569863570b3c61141417cf9fb941c04a  assets/word_hunt/v5_reference_assets/word_plaque_empty.png
          e3bfe4b5a958ec945a76cdd0cc48d2ae3e93f4340ccf5b778ad63663787a79bf  assets/word_hunt/v5_reference_assets/bonus_plaque_empty.png
          71aa162fc3dd24ef6f84c04792c87eb8800e63ff8b92b933bab13f2b72731c5c  assets/word_hunt/v5_reference_assets/instruction_panel_empty.png
          4d086841a7fc4cb4bb194ab72fd3f9f34c3d84adc836b965ab15e651ac92b24f  assets/word_hunt/v5_reference_assets/icon_back.png
          da26169dc521284e58144453ce756053a1b153e7c467d90a860d1cf5c2ec71fe  assets/word_hunt/v5_reference_assets/icon_search.png
          b77fe3628dc98162e1d739d649dffc426ec293f88579716c25e459de2e0d6253  assets/word_hunt/v5_reference_assets/icon_mistake.png
          f276c862e3ecae30853ff8d0f3fe8e08d2878e1357d67a4eb3e13c95affa54ec  assets/word_hunt/v5_reference_assets/icon_timer.png
          EOF
          sha256sum -c /tmp/v5-assets.sha256

      - name: Isolate production metric icon callsites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/word_hunt/word_hunt_screens.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index("key: const Key('word_hunt_production_screen')")
          end = text.index('/// İzole rota ekranı.', start)
          prefix, middle, suffix = text[:start], text[start:end], text[end:]
          masks = {
              'Icons.search_rounded': 'Icons.__v5_masked_search__',
              'Icons.close_rounded': 'Icons.__v5_masked_close__',
              'Icons.timer_outlined': 'Icons.__v5_masked_timer__',
          }
          for original, masked in masks.items():
              prefix = prefix.replace(original, masked)
              suffix = suffix.replace(original, masked)
              if middle.count(original) != 1:
                  raise SystemExit(f'Production callsite count for {original}: {middle.count(original)}')
          path.write_text(prefix + middle + suffix, encoding='utf-8')
          PY

      - name: Apply deterministic presentation patch
        run: python3 tools/qa/apply_word_hunt_v5_reference_assets.py

      - name: Restore non-production metric icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/word_hunt/word_hunt_screens.dart')
          text = path.read_text(encoding='utf-8')
          masks = {
              'Icons.__v5_masked_search__': 'Icons.search_rounded',
              'Icons.__v5_masked_close__': 'Icons.close_rounded',
              'Icons.__v5_masked_timer__': 'Icons.timer_outlined',
          }
          for masked, original in masks.items():
              text = text.replace(masked, original)
          if '__v5_masked_' in text:
              raise SystemExit('A temporary icon mask was not restored')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/word_hunt/word_hunt_screens.dart test/word_hunt_level_production_test.dart test/word_hunt_v5_reference_assets_test.dart

      - name: Analyze Word Hunt
        run: dart analyze lib/word_hunt

      - name: Focused Word Hunt tests
        run: flutter test test/word_hunt_*_test.dart

      - name: Diff and protected-scope gate
        run: |
          set -euo pipefail
          git diff --check
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          test "$(git diff --name-only -- assets/word_hunt/v5_reference_assets | wc -l)" -eq 0
          while IFS= read -r path; do
            case "$path" in
              pubspec.yaml|lib/word_hunt/word_hunt_screens.dart|test/word_hunt_level_production_test.dart|test/word_hunt_v5_reference_assets_test.dart) ;;
              *) echo "Protected-scope violation: $path"; exit 1 ;;
            esac
          done < <(git status --porcelain=v1 | cut -c4-)

      - name: Commit tested integration
        run: |
          set -euo pipefail
          git add pubspec.yaml lib/word_hunt/word_hunt_screens.dart test/word_hunt_level_production_test.dart test/word_hunt_v5_reference_assets_test.dart
          git diff --cached --check
          git commit -m "feat(kelime-avi): integrate approved V5 reference assets"
          git push origin HEAD:feat/kelime-avi-v5-reference-assets-integration-20260831
