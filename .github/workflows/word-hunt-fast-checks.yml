name: Kelime Avi Fast Checks

on:
  pull_request:
    paths:
      - 'lib/word_hunt/**'
      - 'test/word_hunt_*.dart'
      - '.github/workflows/word-hunt-fast-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Bagimliliklari kur
        run: flutter pub get

      - name: Kelime Avi analyze
        run: dart analyze lib/word_hunt

      - name: Kelime Avi testleri
        run: flutter test test/word_hunt_*_test.dart --reporter expanded

      - name: Diff whitespace kapisi
        run: git diff --check
