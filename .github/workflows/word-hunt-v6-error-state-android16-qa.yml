name: Kelime Avi V6 error state raw Android 16

on:
  push:
    branches:
      - qa/kelime-avi-v6-error-state-android16-20260901
    paths:
      - '.github/workflows/word-hunt-v6-error-state-android16-qa.yml'
      - 'tools/qa/word_hunt_v6_error_state_android16.sh'

permissions:
  contents: read

jobs:
  b10-error-state:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 889cf391d3db9b34644699237ff8c50d2744e061
      TARGET_BLOB: f43deaad5328f6263f9479de1738cc1f4ac465e0
      PACKAGE_NAME: com.leventua.bilgirotasi
      REPORTS: reports/word_hunt_v6_error_state

    steps:
      - name: Checkout exact accepted product checkpoint
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Checkout error-state QA harness
        uses: actions/checkout@v4
        with:
          ref: qa/kelime-avi-v6-error-state-android16-20260901
          path: qa-tools

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Exact product guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORTS"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object lib/word_hunt/word_hunt_screens.dart)" = "$TARGET_BLOB"
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          grep -q 'Duration(milliseconds: 280)' lib/word_hunt/word_hunt_screens.dart
          grep -q 'Color(0x338B3B20)' lib/word_hunt/word_hunt_screens.dart
          grep -q 'Color(0xFFFFB06A)' lib/word_hunt/word_hunt_screens.dart
          git diff --check
          printf '%s\n' "$TARGET_SHA" > "$REPORTS/TARGET_SHA.txt"
          git hash-object lib/word_hunt/word_hunt_screens.dart > "$REPORTS/PRODUCT_FILE_BLOB.txt"

      - name: Build exact QA APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/debug "$REPORTS"
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          printf '%s\n' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <application>' \
            '    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' \
            '  </application>' \
            '</manifest>' \
            > android/app/src/debug/AndroidManifest.xml
          flutter build apk --debug \
            -t tools/word_hunt_v5_gameplay_qa_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > "$REPORTS/APK_SHA256.txt"
          (cd android && ./gradlew --stop)

      - name: Prepare Android emulator KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Raw Android 16 B10 transient error-state recording
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: REPORTS="$REPORTS" PACKAGE_NAME="$PACKAGE_NAME" bash qa-tools/tools/qa/word_hunt_v6_error_state_android16.sh

      - name: Raw proof contract
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REPORTS/08_B10_ERROR_BEFORE.png"
          test -s "$REPORTS/09_B10_ERROR_RECORD.mp4"
          test -s "$REPORTS/10_B10_ERROR_CLEARED.png"
          grep -q '^PRODUCT_ERROR_FEEDBACK_MS=280 (UNCHANGED)$' "$REPORTS/QA_SUMMARY.txt"
          grep -q '^WRONG_WORD_REGISTERED_GATE=PASS$' "$REPORTS/QA_SUMMARY.txt"
          grep -q '^RAW_ERROR_PROOF=ANDROID_SCREENRECORD$' "$REPORTS/QA_SUMMARY.txt"

      - name: Upload raw error-state proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-V6-error-state-${{ env.TARGET_SHA }}
          path: reports/word_hunt_v6_error_state/**
          if-no-files-found: error
          retention-days: 21
