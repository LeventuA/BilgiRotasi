name: Kelime Avi V6 swipe tolerance Android 16

on:
  push:
    branches:
      - integrate/kelime-avi-v6-b5-swipe-20260903
    paths:
      - .github/workflows/word-hunt-v6-swipe-tolerance-android16.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      EXPECTED_INPUT_BLOB: 547ee0b54aa1cb2d922717b848334af9f09565b5
      EXPECTED_SCREEN_BLOB: 607121ba6526b73e34e9f8e77b67c6ac9ee77d4b
      EXPECTED_STARTER_BLOB: a408ea631d267c6763baa3642ab4b92171eeafc8
      QA_PACKAGE: com.leventua.bilgirotasi.wordhuntswipeqa
      REPORT_DIR: reports/word_hunt_v6_swipe_tolerance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Verify exact product blobs and focused gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git hash-object lib/word_hunt/word_hunt_input.dart)" = "$EXPECTED_INPUT_BLOB"
          test "$(git hash-object lib/word_hunt/word_hunt_screens.dart)" = "$EXPECTED_SCREEN_BLOB"
          test "$(git hash-object lib/word_hunt/word_hunt_starter_content.dart)" = "$EXPECTED_STARTER_BLOB"
          grep -q '^version: 1.68.19+109$' pubspec.yaml
          bash -n tools/qa/word_hunt_v6_swipe_tolerance_android16.sh
          flutter pub get
          dart analyze lib/word_hunt tools/word_hunt_v6_swipe_tolerance_qa_main.dart
          flutter test test/word_hunt_*_test.dart --reporter expanded 2>&1 | tee "$REPORT_DIR/FOCUSED_TESTS.txt"
          git diff --check

      - name: Restore exact prebuilt QA APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/word_hunt_apk "$REPORT_DIR"
          gh run download 33722288193 --repo "$GITHUB_REPOSITORY" --name Kelime-Avi-V6-Swipe-Tolerance-Android16 --dir /tmp/word_hunt_apk
          source_apk="$(find /tmp/word_hunt_apk -type f -name 'KelimeAvi-V6-Swipe-Tolerance-QA.apk' -print -quit)"
          test -n "$source_apk"
          cp "$source_apk" "$REPORT_DIR/KelimeAvi-V6-Swipe-Tolerance-QA.apk"
          sha256sum "$REPORT_DIR/KelimeAvi-V6-Swipe-Tolerance-QA.apk" | tee "$REPORT_DIR/APK_SHA256.txt"
          grep -q '^73618f5af356374104475d457fe15f263cdd370b009f81f7691c5f7d333dbd ' "$REPORT_DIR/APK_SHA256.txt"

      - name: Prepare KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Android 16 real overshoot gesture proof
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          adb_bin="$ANDROID_HOME/platform-tools/adb"
          "$sdkmanager_bin" --install emulator platform-tools 'system-images;android-36;aosp_atd;x86_64' >/dev/null
          echo no | "$avdmanager_bin" create avd --force -n word_hunt_api36 --package 'system-images;android-36;aosp_atd;x86_64' --device pixel_2 >/dev/null
          printf '%s\n' 'hw.cpu.ncore=2' 'hw.ramSize=3072M' 'hw.heapSize=512M' >> "$HOME/.android/avd/word_hunt_api36.avd/config.ini"
          "$emulator_bin" -port 5554 -avd word_hunt_api36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > "$REPORT_DIR/EMULATOR_LOG.txt" 2>&1 &
          emulator_pid=$!
          cleanup() {
            "$adb_bin" -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$adb_bin" start-server
          ready=0
          for _ in $(seq 1 180); do
            "$adb_bin" reconnect offline >/dev/null 2>&1 || true
            if [[ "$("$adb_bin" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          "$adb_bin" devices -l | tee "$REPORT_DIR/ADB_DEVICES.txt"
          test "$ready" = 1
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          bash tools/qa/word_hunt_v6_swipe_tolerance_android16.sh

      - name: Upload APK and raw Android proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Avi-V6-Swipe-Tolerance-Android16
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 7
