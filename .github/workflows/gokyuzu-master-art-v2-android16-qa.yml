name: Gokyuzu Master Art V2 Android16 QA

on:
  push:
    branches:
      - qa/gokyuzu-master-art-v2-android16-20260905

permissions:
  contents: read

jobs:
  android16-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PRODUCT_SHA: 4145f0fe8d716d6951e1ee53215812b56150c73c
      PRODUCT_PARENT_SHA: 7783ac9076cc793e839ee7250991527b5a6f63ec
      CANONICAL_SHA: 3557a7e4f2f2917d61ba61866c6d4c8561994667
      CONTENT_SHA: 4ec33de7438fcbd15ed63b1ae2adda127da3be8c
      MASTER_ART_SHA256: 8a34b03f9c24400d7ebb80c2396d457fc0335b7b11cf77278990cf72fd5e21ea
      MASTER_ART_SIZE: '222508'

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact product chain and protected scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git rev-parse "$PRODUCT_SHA^")" = "$PRODUCT_PARENT_SHA"
          test "$(git rev-parse "$PRODUCT_PARENT_SHA^")" = "$CANONICAL_SHA"
          test "$(grep '^version:' pubspec.yaml | awk '{print $2}')" = '1.68.19+109'
          test -z "$(git diff --name-only "$CANONICAL_SHA" "$PRODUCT_SHA" -- assets/questions.json android/ || true)"
          test "$(wc -c < assets/word_hunt/gokyuzu_adalari_master_art_v2.webp)" = "$MASTER_ART_SIZE"
          test "$(sha256sum assets/word_hunt/gokyuzu_adalari_master_art_v2.webp | cut -d' ' -f1)" = "$MASTER_ART_SHA256"

      - name: Inject exact DRAFT content only into QA workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTENT_SHA"
          git show "$CONTENT_SHA:lib/word_hunt/word_hunt_gokyuzu_content.dart" > lib/word_hunt/word_hunt_gokyuzu_content.dart
          test "$(git hash-object lib/word_hunt/word_hunt_gokyuzu_content.dart)" = '4070a85e7fbac5fda0d3967815cea7c673322a61'
          grep -q "id: 'gokyuzu-adalari'" lib/word_hunt/word_hunt_gokyuzu_content.dart
          grep -q 'unlockStarsRequired: 18' lib/word_hunt/word_hunt_gokyuzu_content.dart

      - name: Create isolated QA entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cat > lib/word_hunt/gokyuzu_master_art_v2_qa_main.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'word_hunt_gokyuzu_content.dart';
          import 'word_hunt_production_entry_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            debugPrint('[GOKYUZU_MASTER_ART_ANDROID16_RUNTIME_READY]');
            runApp(
              const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: WordHuntProductionEntryScreen(
                  route: WordHuntGokyuzuContent.gokyuzuAdalari,
                  infoCards: WordHuntGokyuzuContent.infoCards,
                ),
              ),
            );
          }
          DART

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Analyze and focused regression
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          git checkout -- pubspec.lock 2>/dev/null || true
          dart format --output=none --set-exit-if-changed lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart lib/word_hunt/word_hunt_production_entry_screen.dart lib/word_hunt/word_hunt_progress.dart test/word_hunt_gokyuzu_master_art_screen_test.dart
          dart analyze lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart lib/word_hunt/word_hunt_production_entry_screen.dart lib/word_hunt/word_hunt_progress.dart lib/word_hunt/word_hunt_gokyuzu_content.dart lib/word_hunt/gokyuzu_master_art_v2_qa_main.dart
          flutter test test/word_hunt_gokyuzu_master_art_screen_test.dart test/word_hunt_progress_test.dart test/word_hunt_pixel_proof_screen_test.dart test/word_hunt_reference_route_screen_test.dart test/word_hunt_production_flow_test.dart --reporter expanded
          git diff --check "$CANONICAL_SHA" "$PRODUCT_SHA"

      - name: Build isolated debug APK and verify packaged MASTER ART
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug -t lib/word_hunt/gokyuzu_master_art_v2_qa_main.dart --dart-define=ADMOB_ENVIRONMENT=test
          apk='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$apk"
          mkdir -p reports
          unzip -p "$apk" assets/flutter_assets/assets/word_hunt/gokyuzu_adalari_master_art_v2.webp > reports/gokyuzu_adalari_master_art_v2.packaged.webp
          cmp -s assets/word_hunt/gokyuzu_adalari_master_art_v2.webp reports/gokyuzu_adalari_master_art_v2.packaged.webp
          sha256sum "$apk" | tee reports/APK_SHA256.txt
          printf '%s\n' "$PRODUCT_SHA" > reports/PRODUCT_SHA.txt
          printf '%s\n' "$CONTENT_SHA" > reports/CONTENT_SHA.txt
          printf '%s\n' "$MASTER_ART_SHA256" > reports/MASTER_ART_SHA256.txt

      - name: Prepare Android 16 KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Capture raw Android 16 MASTER ART route
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            set -e
            mkdir -p reports
            adb shell wm size 1080x1920
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.leventua.bilgirotasi
            adb shell monkey -p com.leventua.bilgirotasi -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 10
            adb shell dumpsys activity activities > reports/ACTIVITY.txt
            adb shell uiautomator dump /sdcard/gokyuzu_ui.xml >/dev/null
            adb pull /sdcard/gokyuzu_ui.xml reports/UI.xml >/dev/null
            adb exec-out screencap -p > reports/GOKYUZU_MASTER_ART_V2_ANDROID16_RAW.png
            adb logcat -d > reports/LOGCAT.txt
            test -s reports/GOKYUZU_MASTER_ART_V2_ANDROID16_RAW.png
            grep -q 'GOKYUZU_MASTER_ART_ANDROID16_RUNTIME_READY' reports/LOGCAT.txt
            grep -Eq 'mResumedActivity.*com\.leventua\.bilgirotasi|topResumedActivity=.*com\.leventua\.bilgirotasi|mCurrentFocus=.*com\.leventua\.bilgirotasi' reports/ACTIVITY.txt
            grep -q 'Bölüm 1' reports/UI.xml
            grep -q 'Pusula' reports/UI.xml
            grep -q 'Bilgi Kitabı' reports/UI.xml
            if grep -E 'FATAL EXCEPTION|ANR in com\.leventua\.bilgirotasi|am_crash.*com\.leventua\.bilgirotasi|am_proc_died.*com\.leventua\.bilgirotasi|A RenderFlex overflowed|FlutterError' reports/LOGCAT.txt; then echo 'Application/runtime failure detected' >&2; exit 1; fi
            python3 - <<'PY'
            import struct
            p='reports/GOKYUZU_MASTER_ART_V2_ANDROID16_RAW.png'
            with open(p,'rb') as f:
                sig=f.read(24)
            assert sig[:8] == b'\x89PNG\r\n\x1a\n'
            width,height=struct.unpack('>II',sig[16:24])
            print(f'RAW_SCREENSHOT={width}x{height}')
            assert (width,height)==(1080,1920)
            PY
            sha256sum reports/GOKYUZU_MASTER_ART_V2_ANDROID16_RAW.png | tee reports/SCREENSHOT_SHA256.txt

      - name: Upload exact Android16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gokyuzu-MasterArt-V2-Android16-4145f0f
          path: reports/
          if-no-files-found: warn
          retention-days: 14
