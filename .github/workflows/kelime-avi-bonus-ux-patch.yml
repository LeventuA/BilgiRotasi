name: Kelime Avi bonus UX patch

on:
  push:
    branches:
      - fix/kelime-avi-bonus-after-targets-soft-timer-20260828
    paths:
      - .github/workflows/kelime-avi-bonus-ux-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply exact patch
        run: python3 tools/apply_kelime_avi_bonus_ux_patch.py
      - name: Format
        run: dart format lib/word_hunt/word_hunt_screens.dart test/word_hunt_level_production_test.dart test/word_hunt_scoring_test.dart
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze lib/word_hunt
          mapfile -t tests < <(find test -maxdepth 1 -type f -name 'word_hunt_*_test.dart' | sort)
          flutter test "${tests[@]}" --concurrency=1
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(lib/word_hunt/word_hunt_screens\.dart|test/word_hunt_level_production_test\.dart|test/word_hunt_scoring_test\.dart|docs/kelime-avi/BONUS_AFTER_TARGETS_UX_20260828\.md)$' || true)"
          test -z "$unexpected"
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ZMilaStudio
          git config user.email levent.ua@gmail.com
          git add lib/word_hunt/word_hunt_screens.dart test/word_hunt_level_production_test.dart test/word_hunt_scoring_test.dart docs/kelime-avi/BONUS_AFTER_TARGETS_UX_20260828.md
          git diff --cached --check
          git commit -m 'fix(kelime-avi): keep bonus play open after targets'
          git push origin HEAD:fix/kelime-avi-bonus-after-targets-soft-timer-20260828
