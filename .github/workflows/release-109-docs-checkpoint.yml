name: Release 109 project checkpoint

on:
  pull_request:
    branches:
      - release/1.68.19-109-admob-fix-20260821

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply checkpoint to exact product head
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 1999a049018b5d23eeda59b0b9d2e0e435cf0a64
          python3 - <<'PY'
          from pathlib import Path

          def insert_after_title(path_str: str, block: str):
              path = Path(path_str)
              text = path.read_text()
              if block.strip() in text:
                  return
              first_nl = text.find('\n')
              if first_nl < 0:
                  raise SystemExit(f'heading missing: {path_str}')
              path.write_text(text[:first_nl+1] + '\n' + block.strip() + '\n\n---\n\n' + text[first_nl+1:].lstrip('\n'))

          durum = r'''## 0M. 1.68.19+109 birleşik soru + AdMob/UMP yayın adayı — 21 Ağustos 2026

- Kanonik taban `release/final-closed-test-aab-1.68.8` / `fea206036366c604a54159be3bbe39e22fe24a2d` / `1.68.18+108` olarak canlı GitHub'dan kilitlendi.
- `+108`, PR #79 ile gelen soru geri bildirimi sürümüdür: 128 olay / 122 benzersiz soru incelendi; 53 içerik/şık, 27 zorluk ve 1 kategori olmak üzere 81 gerçek soru bankası düzeltmesi release'tedir.
- +109 adayı bu exact +108 tabanından türetildi. `assets/questions.json` değiştirilmedi; +108 soru bankası aynen korunur.
- Fiziksel production tanısında önce UMP `CONSENT_INFO_UPDATE_FAILED` ortak reklam blokajı doğrulandı. Minimal düzeltme, consent-info güncellemesi hata verirse UMP `canRequestAds()` ile geçerli cached consent'i kontrol eder; consent form/privacy-status hataları fail-closed kalır. FormError code/message tanısı korunur.
- Production fiziksel kabul: banner PASS; rewarded reklam PASS; AdMob Verify URL PASS ve kaydedildi; yalnız `rewardedSsvCallback` selective redeploy sonrası fail-closed `503 SSV_NOT_ENABLED` PASS; Levent'in açık cutover onayıyla `server_config/rewarded.ssvEnabled=true` yapıldı ve readback PASS; ardından fiziksel reklam -> SSV claim -> tek +10 XP ödülü PASS.
- Test-before-commit run `32481091014`, job `96767404086`: focused AdMob/privacy **42/42 PASS**, tüm Flutter **301/301 PASS**, analyze non-fatal PASS, `git diff --check` PASS, `assets/questions.json` sıfır fark. Exact candidate artifact ID `9446124898`, digest `sha256:3c9e11123a9203ba1efce156044e72a3cab2a3b8f116f04ab08cb1d26df60c17`.
- Exact artifact SHA'ları promotion kapısında doğrulandı. Temiz ürün branch'i `release/1.68.19-109-admob-fix-20260821`; ürün commit `1999a049018b5d23eeda59b0b9d2e0e435cf0a64` — `fix: ship 1.68.19+109 with AdMob UMP recovery`.
- Draft PR #88 release'e açıktır. Ürün diff'i yalnız `lib/ad_monetization.dart`, `lib/app_build_info.dart`, `pubspec.yaml`, `test/ad_monetization_diagnostics_test.dart`, `test/admob_ump_fallback_test.dart`; soru bankası değişmez.
- `KARARLAR.md` değişmedi; reklam ürün sözleşmesi aynı: kullanıcı isteğiyle +10 XP, tamamlanan oyun başına en fazla bir ödül, aktif soru/canlı maç ekranında reklam yok.
- **Merge / Play upload YOK.** PR #88 için exact-head standart AdMob/Android 16 CI tamamlanacak ve Levent ayrıca açık merge onayı vermeden release'e merge edilmeyecek.
'''

          gorev = r'''## 0L - 21 Ağustos 2026 / 1.68.19+109 birleşik yayın adayı

- **Durum:** +108 SORU DÜZELTMELERİ KORUNDU / UMP-ADMOB FİZİKSEL PASS / SSV CUTOVER +10 XP PASS / +109 TEST-BEFORE-COMMIT PASS / DRAFT PR #88 / MERGE VE PLAY YÜKLEME YOK.
- Taban: `fea206036366c604a54159be3bbe39e22fe24a2d` / `1.68.18+108`.
- Aday: branch `release/1.68.19-109-admob-fix-20260821`; commit `1999a049018b5d23eeda59b0b9d2e0e435cf0a64`; hedef sürüm `1.68.19+109`; Draft PR #88.
- +108'deki 81 gerçek soru düzeltmesi korunur; `assets/questions.json` +109 adayında değiştirilmez.
- Pre-commit run `32481091014`: focused 42/42, all Flutter 301/301, analyze non-fatal, diff check PASS; exact candidate artifact ID `9446124898`.
- Fiziksel production: banner PASS, rewarded PASS, AdMob Verify URL PASS, SSV cutover readback PASS, reklam sonrası +10 XP PASS.

**Bitti ölçütü:**
- [x] Canlı +108 release SHA/sürüm doğrulandı.
- [x] +108 soru bankasının +109 adayında sıfır fark olduğu doğrulandı.
- [x] UMP/AdMob düzeltmesi fiziksel production cihazda banner + rewarded ile doğrulandı.
- [x] SSV callback redeploy + Verify URL + açık cutover sonrası gerçek +10 XP fiziksel PASS.
- [x] +109 test-before-commit: focused 42/42, tüm Flutter 301/301, analyze/diff PASS.
- [x] Exact test edilmiş artifacttan tek temiz +109 ürün commit'i üretildi; Draft PR #88 açıldı.
- [ ] PR #88 final exact-head AdMob PR doğrulaması tam log + Android 16 + artifact ile PASS.
- [ ] Aynı tamamlanan `gameId` için fiziksel ikinci +10 XP verilmediği no-double kabulü tamamlanır.
- [ ] Levent açık merge onayı verir; PR #88 expected-head kilidiyle merge edilir.
- [ ] Merge sonrası exact release HEAD'den production profilli `1.68.19+109` AAB üretilir ve paket/sürüm/imza/production AdMob-Firebase profili doğrulanır.
- [ ] Levent onayıyla yalnız doğrulanan +109 AAB Play Console'a yüklenir.
'''

          acik = r'''## 1.68.19+109 birleşik yayın adayı — AÇIK

- Draft PR #88, exact +108 `fea206036366c604a54159be3bbe39e22fe24a2d` tabanında +108 soru düzeltmelerini koruyup fiziksel doğrulanmış UMP/AdMob düzeltmesini taşır.
- SSV production cutover açıktır ve fiziksel reklam sonrası +10 XP PASS olmuştur.
- **DOĞRULANACAK:** aynı tamamlanan oyun/gameId için ikinci +10 XP fiziksel olarak verilmemelidir (no-double).
- **DOĞRULANACAK:** PR #88 final docs-head exact-head CI, Android 16 ve artifact kanıtı.
- **DOĞRULANACAK:** merge sonrası release exact SHA'dan production `1.68.19+109` AAB üretimi; package/version/signing ve gerçek AdMob + Firebase production profilinin artifact içinden doğrulanması.
- **DOĞRULANACAK:** +109 Play Console upload/review/public rollout. Açık kullanıcı onayı olmadan upload/merge yapılmaz.
'''

          insert_after_title('docs/project-memory/BILGI_ROTASI_DURUM.md', durum)
          insert_after_title('docs/project-memory/GOREV_HAVUZU.md', gorev)
          insert_after_title('docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md', acik)

          checkpoint = Path('docs/project-memory/checkpoints/RELEASE_109_ADMOB_20260821.md')
          checkpoint.parent.mkdir(parents=True, exist_ok=True)
          checkpoint.write_text(r'''# Bilgi Rotası 1.68.19+109 AdMob/UMP birleşik yayın checkpointi

- Tarih: 21 Ağustos 2026
- Base: `fea206036366c604a54159be3bbe39e22fe24a2d` / `1.68.18+108`
- Product branch: `release/1.68.19-109-admob-fix-20260821`
- Product commit: `1999a049018b5d23eeda59b0b9d2e0e435cf0a64`
- Draft PR: #88
- Commit adı: `fix: ship 1.68.19+109 with AdMob UMP recovery`
- Pre-commit run: `32481091014`, job `96767404086`
- Focused AdMob/privacy: 42/42 PASS
- Full Flutter: 301/301 PASS
- Analyze: non-fatal PASS; mevcut warning/info borcu ayrı kapsam
- `git diff --check`: PASS
- +109 adayı `assets/questions.json`: base +108 ile sıfır fark
- Candidate artifact: ID `9446124898`, digest `sha256:3c9e11123a9203ba1efce156044e72a3cab2a3b8f116f04ab08cb1d26df60c17`
- Fiziksel production: banner PASS, rewarded PASS, AdMob Verify URL PASS, SSV cutover/readback PASS, +10 XP PASS.
- Açık: fiziksel no-double; PR #88 final exact-head CI; explicit merge; merge sonrası production AAB; Play upload.
- `assets/questions.json`, BoardMap/67 node/3B tahta bu +109 AdMob taşımasında değiştirilmedi.
''')
          PY

          git diff --check
          git diff --exit-code 1999a049018b5d23eeda59b0b9d2e0e435cf0a64 -- assets/questions.json lib/ad_monetization.dart lib/app_build_info.dart pubspec.yaml test/ad_monetization_diagnostics_test.dart test/admob_ump_fallback_test.dart
          test "$(git diff --name-only | grep -v '^docs/project-memory/' | wc -l)" -eq 0
          git add docs/project-memory/BILGI_ROTASI_DURUM.md docs/project-memory/GOREV_HAVUZU.md docs/project-memory/ACIK_SORULAR_VE_DOGRULAMALAR.md docs/project-memory/checkpoints/RELEASE_109_ADMOB_20260821.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record 1.68.19+109 release checkpoint'
          git push origin HEAD:refs/heads/release/1.68.19-109-admob-fix-20260821
