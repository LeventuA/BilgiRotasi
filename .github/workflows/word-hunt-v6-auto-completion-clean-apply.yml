name: Word Hunt auto completion clean apply

on:
  push:
    branches:
      - fix/kelime-avi-v6-auto-completion-dialog-clean-20260902
    paths:
      - .github/workflows/word-hunt-v6-auto-completion-clean-apply.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tools/qa/apply_word_hunt_auto_completion_clean.py
      - run: dart analyze lib/word_hunt
      - run: flutter test test/word_hunt_level_production_test.dart test/word_hunt_auto_completion_regression_test.dart
      - name: Full Word Hunt tests
        shell: bash
        run: flutter test test/word_hunt_*_test.dart
      - name: Commit exact tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/word_hunt/word_hunt_screens.dart test/word_hunt_level_production_test.dart
          git diff --cached --check
          git commit -m "fix(kelime-avi): auto-open completion result per play session"
          git push origin HEAD:fix/kelime-avi-v6-auto-completion-dialog-clean-20260902
