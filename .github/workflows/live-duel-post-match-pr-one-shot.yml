name: Live Duel post-match PR one-shot

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - release/final-closed-test-aab-1.68.8

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/live-duel-post-match-finalization-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-duel-post-match-finalization-20260818
          fetch-depth: 0

      - name: Verify release ancestry and apply patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 15ebf296bce2782bcdc19748c8581d77700ef036 HEAD
          python3 .github/scripts/live_duel_post_match_patch.py
          rm -f \
            .github/scripts/live_duel_post_match_patch.py \
            .github/workflows/live-duel-post-match-one-shot.yml \
            .github/workflows/live-duel-post-match-pr-one-shot.yml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/live_duel_screen.dart \
            lib/live_duel_play_screen.dart \
            test/live_duel_screen_test.dart \
            test/live_duel_play_screen_test.dart

      - name: Focused Live Duel and reward tests
        run: |
          flutter test \
            test/live_duel_screen_test.dart \
            test/live_duel_play_screen_test.dart \
            test/live_duel_connection_test.dart \
            test/live_duel_result_test.dart \
            test/ad_monetization_test.dart \
            --concurrency=1 --reporter expanded

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Full Flutter tests
        run: flutter test --concurrency=1

      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -z "$(printf '%s\n' "$changed" | grep -v -E '^(\.github/scripts/live_duel_post_match_patch\.py|\.github/workflows/live-duel-post-match-one-shot\.yml|\.github/workflows/live-duel-post-match-pr-one-shot\.yml|lib/live_duel_screen\.dart|lib/live_duel_play_screen\.dart|test/live_duel_screen_test\.dart|test/live_duel_play_screen_test\.dart)$')"

      - name: Commit tested product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize Live Duel post-match flow'
          git push origin HEAD:fix/live-duel-post-match-finalization-20260818
