name: Kelime Avi 8x8 final gate v2

on:
  push:
    branches:
      - feat/kelime-avi-8x8-content-v1-20260829
    paths:
      - '.github/workflows/tmp-kelime-8x8-final-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-gate:
    name: 8x8 format + tests + Android16
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      PRODUCT_BASE_SHA: 0e9408ddda511259f588a338b3fcd8192bf92431
      PACKAGE_NAME: com.leventua.bilgirotasi
    steps:
      - name: Checkout exact gate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Decode staged 8x8 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, tarfile
          parts = sorted(Path('tools').glob('.tmp_word_hunt_8x8_payload_*'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 payload parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          decoded = lzma.decompress(compressed)
          out = Path('/tmp/word_hunt_8x8_payload.tar')
          out.write_bytes(decoded)
          if not tarfile.is_tarfile(out):
              raise SystemExit('Decoded payload is not the expected TAR archive')
          with tarfile.open(out) as tf:
              tf.extractall('.')
          Path('/tmp/PAYLOAD_SHA256.txt').write_text(
              f'base64_chars={len(encoded)}\n'
              f'xz_sha256={hashlib.sha256(compressed).hexdigest()}\n'
              f'decoded_sha256={hashlib.sha256(decoded).hexdigest()}\n',
              encoding='utf-8',
          )
          print(Path('/tmp/PAYLOAD_SHA256.txt').read_text())
          PY
          rm -f tools/tmp_finalize_word_hunt_8x8.py
          git restore --worktree -- BILGI_ROTASI_DURUM.md docs/kelime-avi/BASLANGIC_LIMANI_LEVEL_2_10_PRODUCTION_CONTENT_20260828.md
          git diff --check
          git diff --exit-code -- \
            lib/main.dart pubspec.yaml assets/questions.json assets/word_hunt \
            lib/word_hunt/word_hunt_screens.dart \
            lib/word_hunt/word_hunt_path.dart \
            lib/word_hunt/word_hunt_models.dart
          echo '--- candidate scope ---'
          git status --short

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format, analyze and test exact candidate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/word_hunt/word_hunt_starter_content.dart \
            lib/word_hunt/word_hunt_8x8_qa_main.dart \
            test/word_hunt_level_one_engine_test.dart \
            test/word_hunt_level_production_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_starter_content_test.dart
          dart format --output=none --set-exit-if-changed \
            lib/word_hunt/word_hunt_starter_content.dart \
            lib/word_hunt/word_hunt_8x8_qa_main.dart \
            test/word_hunt_level_one_engine_test.dart \
            test/word_hunt_level_production_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_starter_content_test.dart
          dart analyze lib/word_hunt
          flutter test \
            test/word_hunt_starter_content_test.dart \
            test/word_hunt_level_one_engine_test.dart \
            test/word_hunt_level_production_test.dart \
            test/word_hunt_production_flow_test.dart \
            --reporter expanded
          flutter test --reporter compact
          git diff --check

      - name: Build isolated Android16 proof APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/tmp_word_hunt_8x8_ui.py
          bash -n tools/tmp_word_hunt_8x8_android16.sh
          flutter build apk --debug \
            -t lib/word_hunt/word_hunt_8x8_qa_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p reports/word_hunt_8x8
          git rev-parse HEAD > reports/word_hunt_8x8/GATE_HEAD_SHA.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > reports/word_hunt_8x8/APK_SHA256.txt
          cp /tmp/PAYLOAD_SHA256.txt reports/word_hunt_8x8/PAYLOAD_SHA256.txt

      - name: Prepare Android emulator KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Android16 64-cell + soft-time + gesture proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: adb shell wm size 1080x1920 && adb shell wm density 420 && bash tools/tmp_word_hunt_8x8_android16.sh

      - name: Upload Android16 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KelimeAvi-8x8-FINAL-v2-${{ github.sha }}
          path: reports/word_hunt_8x8/**
          if-no-files-found: warn
          retention-days: 7

      - name: Commit only tested 8x8 product files
        shell: bash
        run: |
          set -euo pipefail
          rm -f lib/word_hunt/word_hunt_8x8_qa_main.dart
          rm -f tools/tmp_word_hunt_8x8_android16.sh tools/tmp_word_hunt_8x8_ui.py
          git restore --worktree -- BILGI_ROTASI_DURUM.md docs/kelime-avi/BASLANGIC_LIMANI_LEVEL_2_10_PRODUCTION_CONTENT_20260828.md
          rm -rf reports
          git rm -f \
            tools/.tmp_word_hunt_8x8_payload_00 \
            tools/.tmp_word_hunt_8x8_payload_01 \
            tools/.tmp_word_hunt_8x8_payload_02 \
            tools/.tmp_word_hunt_8x8_payload_03 \
            tools/.tmp_word_hunt_8x8_payload_04 \
            tools/.tmp_word_hunt_8x8_payload_05 \
            .github/workflows/tmp-kelime-8x8-final-gate.yml
          git add \
            lib/word_hunt/word_hunt_starter_content.dart \
            test/word_hunt_level_one_engine_test.dart \
            test/word_hunt_level_production_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_starter_content_test.dart
          git diff --cached --check
          git diff --cached --exit-code -- \
            lib/main.dart pubspec.yaml assets/questions.json assets/word_hunt \
            lib/word_hunt/word_hunt_screens.dart \
            lib/word_hunt/word_hunt_path.dart \
            lib/word_hunt/word_hunt_models.dart
          if git diff --cached --name-only | grep -E 'word_hunt_8x8_qa_main|tmp_word_hunt_8x8_(android16|ui)|tmp_finalize_word_hunt_8x8'; then
            echo 'QA-only file staged' >&2
            exit 1
          fi
          expected=$(printf '%s\n' \
            lib/word_hunt/word_hunt_starter_content.dart \
            test/word_hunt_level_one_engine_test.dart \
            test/word_hunt_level_production_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_starter_content_test.dart | sort)
          actual=$(git diff --cached --name-only -- lib/word_hunt test | sort)
          test "$actual" = "$expected"
          git status --short
          git config user.name 'ZMilaStudio'
          git config user.email 'levent.ua@gmail.com'
          git commit -m 'feat(kelime-avi): switch starter levels to 8x8 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
