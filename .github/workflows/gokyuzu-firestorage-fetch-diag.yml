name: Gokyuzu firestorage fetch diagnostic
on:
  push:
    branches: [tmp/gokyuzu-master-art-bytes-20260905]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe current public share API prefixes
        shell: bash
        run: |
          set -euo pipefail
          share='svAE-i6Hj1So'
          object='icRkjthG4tP6Pa7m/KjDJJY'
          for prefix in \
            'https://api.firestorage.ai/dev/file' \
            'https://api.firestorage.ai/file' \
            'https://api.firestorage.ai/api/file' \
            'https://api.firestorage.ai/v1/file' \
            'https://api.firestorage.ai/prod/file' \
            'https://api.firestorage.ai/api/v1/file'; do
            for path in "shares/$share" "objects/$object"; do
              code="$(curl -sS -o body.tmp -w '%{http_code}' "$prefix/$path" || true)"
              ctype="$(file -b --mime-type body.tmp 2>/dev/null || true)"
              bytes="$(wc -c < body.tmp 2>/dev/null || echo 0)"
              echo "$code $bytes $ctype $prefix/$path"
              if [ "$code" = 200 ]; then head -c 1000 body.tmp; echo; fi
            done
          done
