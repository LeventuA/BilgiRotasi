name: Phone RC2 TSV System ANR fix

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8
    types: [opened, reopened]
    paths:
      - ".github/workflows/phone-rc2-tsv-fix.yml"
      - "tools/detect_android16_system_anr.sh"
      - "test/android16_system_anr_detector_test.dart"
      - "test/fixtures/android16_system_ui_anr_multiline.tsv"

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Patch the exact broken TSV detector call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/validate_android16_closed_test.sh')
          text = path.read_text(encoding='utf-8')
          old = '''dismiss_system_anr() {
            local label="$1"
            local wait_point
            if ! grep -Eqi 'system' "reports/UI_${label}.tsv" \\
                || ! grep -Eqi 'responding' "reports/UI_${label}.tsv" \\
                || ! grep -Eqi 'Process|System[[:space:]]+UI' "reports/UI_${label}.tsv"; then
              return 1
            fi
          '''
          new = '''dismiss_system_anr() {
            local label="$1"
            local wait_point
            if ! bash tools/detect_android16_system_anr.sh \\
                "reports/UI_${label}.tsv"; then
              return 1
            fi
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected broken detector block once, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Test before committing the fix
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/validate_android16_closed_test.sh
          bash -n tools/detect_android16_system_anr.sh
          bash tools/detect_android16_system_anr.sh \
            test/fixtures/android16_system_ui_anr_multiline.tsv
          flutter pub get
          flutter test test/android16_system_anr_detector_test.dart
          flutter test test/closed_test_release_workflow_test.dart
          git diff --check

      - name: Commit tested fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phone-rc2-tsv-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            tools/validate_android16_closed_test.sh \
            tools/detect_android16_system_anr.sh \
            test/android16_system_anr_detector_test.dart \
            test/fixtures/android16_system_ui_anr_multiline.tsv \
            .github/workflows/phone-rc2-tsv-fix.yml
          git commit -m 'fix: detect multiline Android system ANR OCR'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
