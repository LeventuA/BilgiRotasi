name: Phone RC2 TSV System ANR fix

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/phone-rc2-tsv-fix.yml"
      - "tools/detect_android16_system_anr.sh"
      - "test/android16_system_anr_detector_test.dart"
      - "test/fixtures/android16_system_ui_anr_multiline.tsv"
      - "test/closed_test_release_workflow_test.dart"

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Patch detector integration and stale regression assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          validator_path = Path('tools/validate_android16_closed_test.sh')
          validator = validator_path.read_text(encoding='utf-8')
          old_validator = '''dismiss_system_anr() {
            local label="$1"
            local wait_point
            if ! grep -Eqi 'system' "reports/UI_${label}.tsv" \\
                || ! grep -Eqi 'responding' "reports/UI_${label}.tsv" \\
                || ! grep -Eqi 'Process|System[[:space:]]+UI' "reports/UI_${label}.tsv"; then
              return 1
            fi
          '''
          new_validator = '''dismiss_system_anr() {
            local label="$1"
            local wait_point
            if ! bash tools/detect_android16_system_anr.sh \\
                "reports/UI_${label}.tsv"; then
              return 1
            fi
          '''
          count = validator.count(old_validator)
          if count != 1:
              raise SystemExit(
                  f'Expected broken detector block once, found {count}'
              )
          validator_path.write_text(
              validator.replace(old_validator, new_validator, 1),
              encoding='utf-8',
          )

          workflow_test_path = Path('test/closed_test_release_workflow_test.dart')
          workflow_test = workflow_test_path.read_text(encoding='utf-8')
          old_assertion = '''      expect(workflow, contains("'Process|System[[:space:]]+UI'"));
          '''
          new_assertion = '''      expect(
            android16Script,
            contains('bash tools/detect_android16_system_anr.sh'),
          );
          '''
          count = workflow_test.count(old_assertion)
          if count != 1:
              raise SystemExit(
                  f'Expected stale detector assertion once, found {count}'
              )
          workflow_test_path.write_text(
              workflow_test.replace(old_assertion, new_assertion, 1),
              encoding='utf-8',
          )
          PY

      - name: Test before committing the fix
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/validate_android16_closed_test.sh
          bash -n tools/detect_android16_system_anr.sh
          bash tools/detect_android16_system_anr.sh \
            test/fixtures/android16_system_ui_anr_multiline.tsv
          flutter pub get
          flutter test test/android16_system_anr_detector_test.dart
          flutter test test/closed_test_release_workflow_test.dart
          git diff --check

      - name: Commit tested fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phone-rc2-tsv-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            tools/validate_android16_closed_test.sh \
            tools/detect_android16_system_anr.sh \
            test/android16_system_anr_detector_test.dart \
            test/fixtures/android16_system_ui_anr_multiline.tsv \
            test/closed_test_release_workflow_test.dart \
            .github/workflows/phone-rc2-tsv-fix.yml
          git commit -m 'fix: detect multiline Android system ANR OCR'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
