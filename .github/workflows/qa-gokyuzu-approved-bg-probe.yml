name: QA Gokyuzu approved bg probe

on:
  push:
    branches:
      - ci/gokyuzu-approved-bg-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve firestorage API base and downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request
          js='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          req=urllib.request.Request(js,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              text=r.read().decode('utf-8','ignore')
          for needle in ('let f=', 'const f=', 'f="', 'api.firestorage', 'NEXT_PUBLIC'):
              pos=0
              while True:
                  i=text.find(needle,pos)
                  if i<0: break
                  print('NEEDLE',needle,text[max(0,i-600):i+1200])
                  pos=i+len(needle)
          # Probe likely API bases with current public share slugs.
          slug='C_m_OOFsBhd-'
          candidates=['https://api.firestorage.ai','https://firestorage.ai/api','https://api.firestorage.ai/api','https://firestorage.ai']
          for base in candidates:
              url=f'{base}/shares/{slug}/files?maxResults=1000'
              try:
                  rq=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                  with urllib.request.urlopen(rq,timeout=15) as rr:
                      body=rr.read()
                      print('CANDIDATE',url,'STATUS',rr.status,'TYPE',rr.headers.get('content-type'),'BYTES',len(body),'BODY',body[:1200])
              except Exception as e:
                  print('CANDIDATE',url,'ERROR',repr(e))
          PY
