name: QA Gokyuzu approved gameplay backgrounds

on:
  push:
    branches: [ci/gokyuzu-approved-bg-probe-20260906]

permissions:
  contents: write

jobs:
  productize:
    runs-on: ubuntu-22.04
    env:
      PRODUCT_BRANCH: feat/kelime-avi-gokyuzu-master-art-v2-20260905
      EXPECTED_PRODUCT_SHA: 116449196d7486278ff02790d23da4919442f736
      CANONICAL_SHA: 3557a7e4f2f2917d61ba61866c6d4c8561994667
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0

      - name: Verify exact product and canonical refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          git fetch origin release/final-closed-test-aab-1.68.8 --quiet
          test "$(git rev-parse origin/release/final-closed-test-aab-1.68.8)" = "$CANONICAL_SHA"
          test "$(grep '^version:' pubspec.yaml | awk '{print $2}')" = '1.68.19+109'

      - name: Download and convert approved backgrounds
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import json, pathlib, urllib.request
          from PIL import Image
          base='https://api.firestorage.ai/dev/file'
          shares={'bright':'C_m_OOFsBhd-','storm':'mZ1-zXW_LzOa','airship':'vmItWK_Vq4D-','moon':'TJ_bzLOVSvTM'}
          dst=pathlib.Path('assets/word_hunt/gokyuzu_adalari')
          dst.mkdir(parents=True,exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for name,slug in shares.items():
              with urllib.request.urlopen(urllib.request.Request(f'{base}/shares/{slug}/files?maxResults=1000',headers=headers),timeout=30) as r:
                  files=json.load(r).get('files') or []
              if len(files)!=1: raise SystemExit(f'{name}: expected 1 file, got {len(files)}')
              file_id=files[0].get('fileId') or files[0].get('file_id')
              req=urllib.request.Request(f'{base}/shares/{slug}/files/{file_id}/download',method='POST',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: url=json.load(r)['downloadUrl']
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60) as r: data=r.read()
              tmp=pathlib.Path(f'/tmp/{name}.png'); tmp.write_bytes(data)
              im=Image.open(tmp).convert('RGB')
              if im.size!=(941,1672): raise SystemExit(f'{name}: dimensions {im.size}')
              out=dst/f'gameplay_bg_{name}.webp'; im.save(out,'WEBP',quality=92,method=6)
              print(name,out.stat().st_size)
          for old in dst.glob('scene_level_*.webp'): old.unlink()
          PY

      - name: Wire approved backgrounds and tests
        shell: bash
        run: |
          set -euo pipefail
          cat > lib/word_hunt/word_hunt_gokyuzu_gameplay_backgrounds.dart <<'DART'
          abstract final class WordHuntGokyuzuGameplayBackgrounds {
            static const String bright = 'assets/word_hunt/gokyuzu_adalari/gameplay_bg_bright.webp';
            static const String storm = 'assets/word_hunt/gokyuzu_adalari/gameplay_bg_storm.webp';
            static const String airship = 'assets/word_hunt/gokyuzu_adalari/gameplay_bg_airship.webp';
            static const String moon = 'assets/word_hunt/gokyuzu_adalari/gameplay_bg_moon.webp';

            static String forLevel(int levelIndex) => switch (levelIndex) {
              5 || 8 => storm,
              6 => airship,
              7 || 9 => moon,
              _ => bright,
            };
          }
          DART
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/word_hunt/word_hunt_production_entry_screen.dart'); s=p.read_text()
          imp="import 'word_hunt_gokyuzu_gameplay_backgrounds.dart';\n"; anchor="import 'word_hunt_gokyuzu_master_art_screen.dart';\n"
          if imp not in s: s=s.replace(anchor,imp+anchor)
          old="""    final backgroundAsset =\n        isGokyuzu\n            ? 'assets/word_hunt/gokyuzu_adalari/scene_level_${level.index.toString().padLeft(2, '0')}.webp'\n            : null;\n"""
          new="""    final backgroundAsset =\n        isGokyuzu\n            ? WordHuntGokyuzuGameplayBackgrounds.forLevel(level.index)\n            : null;\n"""
          if old not in s: raise SystemExit('old scene mapping not found')
          p.write_text(s.replace(old,new))

          p=Path('test/word_hunt_gokyuzu_device_regression_test.dart'); s=p.read_text()
          imp="import 'package:bilgi_rotasi/word_hunt/word_hunt_gokyuzu_gameplay_backgrounds.dart';\n"; anchor="import 'package:bilgi_rotasi/word_hunt/word_hunt_gokyuzu_master_art_screen.dart';\n"
          if imp not in s: s=s.replace(anchor,imp+anchor)
          s=s.replace("const background = 'assets/word_hunt/gokyuzu_adalari/scene_level_04.webp';","const background = WordHuntGokyuzuGameplayBackgrounds.bright;")
          if 'maps levels to approved scenic backgrounds' not in s:
              block="""void main() {\n  test('Gökyüzü gameplay maps levels to approved scenic backgrounds', () {\n    const expected = <int, String>{\n      1: WordHuntGokyuzuGameplayBackgrounds.bright,\n      2: WordHuntGokyuzuGameplayBackgrounds.bright,\n      3: WordHuntGokyuzuGameplayBackgrounds.bright,\n      4: WordHuntGokyuzuGameplayBackgrounds.bright,\n      5: WordHuntGokyuzuGameplayBackgrounds.storm,\n      6: WordHuntGokyuzuGameplayBackgrounds.airship,\n      7: WordHuntGokyuzuGameplayBackgrounds.moon,\n      8: WordHuntGokyuzuGameplayBackgrounds.storm,\n      9: WordHuntGokyuzuGameplayBackgrounds.moon,\n      10: WordHuntGokyuzuGameplayBackgrounds.bright,\n    };\n    for (final entry in expected.entries) {\n      expect(WordHuntGokyuzuGameplayBackgrounds.forLevel(entry.key), entry.value);\n      expect(entry.value, isNot(contains('scene_level_')));\n    }\n  });\n\n"""
              s=s.replace('void main() {\n',block,1)
          p.write_text(s)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format and dependencies
        shell: bash
        run: |
          dart format lib/word_hunt/word_hunt_gokyuzu_gameplay_backgrounds.dart lib/word_hunt/word_hunt_production_entry_screen.dart test/word_hunt_gokyuzu_device_regression_test.dart
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Word Hunt regression suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -maxdepth 1 -type f -name 'word_hunt*_test.dart' | sort)
          flutter test "${tests[@]}"

      - name: Validate protected scope
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$EXPECTED_PRODUCT_SHA" -- assets/questions.json android/ pubspec.yaml || true)"
          test "$(find assets/word_hunt/gokyuzu_adalari -maxdepth 1 -name 'gameplay_bg_*.webp' | wc -l)" -eq 4
          test "$(find assets/word_hunt/gokyuzu_adalari -maxdepth 1 -name 'scene_level_*.webp' | wc -l)" -eq 0
          ! grep -q 'scene_level_' lib/word_hunt/word_hunt_production_entry_screen.dart
          git diff --check

      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/word_hunt/gokyuzu_adalari lib/word_hunt/word_hunt_gokyuzu_gameplay_backgrounds.dart lib/word_hunt/word_hunt_production_entry_screen.dart test/word_hunt_gokyuzu_device_regression_test.dart
          git commit -m 'fix(kelime-avi): use approved gokyuzu gameplay backgrounds'
          git push origin HEAD:"$PRODUCT_BRANCH"
          git rev-parse HEAD
