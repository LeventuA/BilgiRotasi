name: QA Gokyuzu approved bg probe

on:
  push:
    branches:
      - ci/gokyuzu-approved-bg-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe firestorage share page internals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          url = 'https://firestorage.ai/ja/f/C_m_OOFsBhd-'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = r.read()
          text = data.decode('utf-8', errors='ignore')
          print('PAGE_BYTES', len(data))
          print('SCRIPT_SRCS')
          for src in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)', text):
              print(urllib.parse.urljoin(url, src))
          print('MATCHING_LINES')
          for line in text.splitlines():
              low = line.lower()
              if any(k in low for k in ('download', 'public_id', 'publicid', 'share', '/api/', 'file_id', 'fileid')):
                  print(line[:2000])
          print('ABSOLUTE_URLS')
          for found in sorted(set(re.findall(r'https?://[^\"\'<> ]+', text))):
              print(found[:2000])
          PY
